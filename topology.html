<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>集群网络拓扑 - 架构视图</title>
  <script src="https://unpkg.com/animejs@3.2.2/lib/anime.min.js"></script>
  <style>
    :root {
      --bg: #08111f;
      --surface: #0f172a;
      --panel: #111827;
      --panel-2: #172033;
      --line: #263245;
      --line-strong: #39516f;
      --text: #e5edf7;
      --muted: #91a0b6;
      --accent: #22d3ee;
      --ok: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      grid-template-rows: 56px minmax(0, 1fr);
      height: 100vh;
    }
    .shell.sidebar-collapsed {
      grid-template-columns: minmax(0, 1fr) 0;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #0f172a;
    }
    .title {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }
    .title h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: #67e8f9;
      letter-spacing: 0;
    }
    .title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      white-space: nowrap;
    }
    .actions a,
    .actions button {
      color: var(--text);
      background: #1f2937;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .actions a:hover,
    .actions button:hover {
      border-color: var(--accent);
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      -webkit-user-select: none;
      user-select: none;
    }
    .toggle input { margin: 0; }
    .stage {
      position: relative;
      overflow: auto;
      background: #08111f;
    }
    .info-fab {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #e0f2fe;
      background: rgba(8, 17, 31, .92);
      border: 1px solid rgba(34, 211, 238, .45);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
    }
    .info-fab:hover {
      border-color: var(--accent);
      background: rgba(15, 32, 51, .96);
    }
    .info-fab svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }
    .shell:not(.sidebar-collapsed) .info-fab {
      padding: 8px 12px;
      background: rgba(15, 23, 42, .82);
    }
    .shell:not(.sidebar-collapsed) .info-fab span:last-child {
      display: none;
    }
    .canvas-wrap {
      position: relative;
      min-width: 1180px;
      min-height: 760px;
      width: 100%;
      height: 100%;
    }
    svg#topology-svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 760px;
    }
    .zone-text-layer {
      pointer-events: none;
    }
    .side {
      border-left: 1px solid var(--line);
      background: #0f172a;
      overflow: auto;
      padding: 14px;
    }
    .shell.sidebar-collapsed .side {
      display: none;
    }
    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .side-head h2 {
      margin: 0;
      color: #67e8f9;
      font-size: 15px;
    }
    .side-toggle {
      color: #67e8f9;
      background: #172033;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .side-toggle:hover { border-color: var(--accent); }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      appearance: none;
      text-align: left;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
    }
    .metric:hover,
    .metric.active {
      border-color: var(--accent);
      background: #132033;
    }
    .metric b {
      display: block;
      font-size: 18px;
      color: #f8fafc;
    }
    .metric span {
      color: var(--muted);
      font-size: 12px;
    }
    .section {
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .section h2 {
      margin: 0 0 10px;
      color: #67e8f9;
      font-size: 15px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-line {
      width: 72px;
      height: 3px;
      border-radius: 99px;
      background: var(--line);
    }
    .detail {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .detail-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .detail-title b {
      color: #f8fafc;
      font-size: 14px;
    }
    .detail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .detail-btn {
      color: #67e8f9;
      background: #172033;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .detail-btn:hover { border-color: var(--accent); }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 8px 0;
    }
    .info-item {
      background: rgba(17, 24, 39, .72);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
    }
    .info-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .info-item b {
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
    }
    .list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .list-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: rgba(17, 24, 39, .55);
      cursor: pointer;
    }
    .list-row:hover { border-color: var(--accent); }
    .list-row strong {
      color: #f8fafc;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .list-row small {
      display: block;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 11px;
      color: #dbeafe;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .badge.ok { color: #bbf7d0; border-color: rgba(34,197,94,.45); background: rgba(22,101,52,.25); }
    .badge.bad { color: #fecaca; border-color: rgba(239,68,68,.45); background: rgba(127,29,29,.25); }
    .badge.warn { color: #fde68a; border-color: rgba(245,158,11,.45); background: rgba(120,53,15,.25); }
    .detail-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-top: 8px;
    }
    .port-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      color: #dbeafe;
      background: rgba(15, 23, 42, .72);
    }
    .port-table th,
    .port-table td {
      border-bottom: 1px solid var(--line);
      padding: 6px 7px;
      text-align: left;
      font-size: 12px;
      white-space: nowrap;
    }
    .port-table th {
      color: #93c5fd;
      font-weight: 600;
      background: #111827;
    }
    .port-table tr:last-child td { border-bottom: 0; }
    .port-up { color: var(--ok); }
    .port-down { color: var(--bad); }
    .port-muted { color: var(--muted); }
    .alarm-row { background: rgba(127, 29, 29, .22); }
    .peer-stack {
      display: grid;
      gap: 4px;
    }
    .peer-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #dbeafe;
      background: rgba(15, 23, 42, .55);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 6px;
    }
    .peer-chip small {
      color: var(--muted);
    }
    .zone-label {
      fill: #f8fafc;
      font-size: 15px;
      font-weight: 700;
    }
    .zone-sub {
      fill: #94a3b8;
      font-size: 11px;
    }
    .zone-bg {
      fill: #0f1a2d;
      stroke: #263245;
      stroke-width: 1;
      rx: 8;
    }
    .cluster-bg {
      fill: rgba(15, 23, 42, .36);
      stroke: rgba(100, 116, 139, .3);
      stroke-width: 1;
      stroke-dasharray: 5 5;
    }
    .cluster-label {
      fill: #93c5fd;
      font-size: 11px;
      font-weight: 700;
    }
    .cluster-label.shared { fill: #cbd5e1; }
    .cluster-label.ali { fill: #67e8f9; }
    .cluster-label.zp { fill: #c4b5fd; }
    .node-card {
      cursor: pointer;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.25));
      opacity: .96;
      transition: opacity .18s ease;
    }
    .node-card.dimmed {
      opacity: .28;
    }
    .node-card.connected .node-rect,
    .node-card.selected .node-rect {
      stroke: #67e8f9;
      stroke-width: 2;
    }
    .node-card.selected {
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, .5));
    }
    .node-rect {
      fill: #172033;
      stroke: #38506d;
      stroke-width: 1.2;
      rx: 7;
    }
    .node-card.down .node-rect {
      fill: #2a1218;
      stroke: #ef4444;
    }
    .node-card.group .node-rect {
      fill: #102a3a;
      stroke: #0ea5e9;
    }
    .node-card.device .node-rect {
      fill: #161d2d;
      stroke: #7c93b6;
    }
    .node-title {
      fill: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      text-anchor: middle;
    }
    .node-meta {
      fill: #94a3b8;
      font-size: 10px;
      pointer-events: none;
      text-anchor: middle;
    }
    .node-dot {
      stroke: rgba(255,255,255,.35);
      stroke-width: 1;
    }
    .node-dot.alarm {
      fill: var(--bad);
      animation: alarmPulse 1.8s ease-in-out infinite;
    }
    .switch-icon-body {
      stroke: rgba(224, 242, 254, .62);
      stroke-width: 1.2;
    }
    .switch-icon-mark {
      fill: none;
      stroke: #e0f2fe;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .node-card.down .switch-icon-body {
      stroke: rgba(254, 202, 202, .8);
    }
    .link {
      fill: none;
      stroke-linecap: round;
      opacity: .62;
      cursor: pointer;
      pointer-events: stroke;
      vector-effect: non-scaling-stroke;
    }
    .link-underlay {
      fill: none;
      stroke: rgba(8, 17, 31, .9);
      stroke-linecap: round;
      opacity: .82;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }
    .link:hover {
      opacity: 1;
      filter: drop-shadow(0 0 6px rgba(34,211,238,.6));
    }
    .link.down {
      opacity: .92;
      stroke-dasharray: 8 6;
      animation: linkAlarm 1.8s ease-in-out infinite;
    }
    .link.dimmed,
    .link-underlay.dimmed {
      opacity: .12;
    }
    .link.connected {
      opacity: .95;
    }
    .link-focus {
      fill: none;
      stroke-linecap: round;
      pointer-events: stroke;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, .55));
      vector-effect: non-scaling-stroke;
    }
    .link-focus.down {
      stroke-dasharray: 8 6;
      animation: linkAlarm 1.8s ease-in-out infinite;
    }
    @keyframes alarmPulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes linkAlarm {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(8,17,31,.7);
      z-index: 3;
    }
    .link-fs {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      overflow: auto;
      padding: 16px;
      color: var(--text);
      background: #0f172a;
    }
    .link-fs .port-table {
      min-width: 1180px;
    }
    @media (max-width: 768px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: 56px minmax(0, 1fr) 280px;
      }
      .side {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .canvas-wrap {
        min-width: 980px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title">
        <h1 id="page-title">集群网络拓扑 - 架构视图</h1>
        <span id="subtitle">分区聚合视图</span>
      </div>
      <div class="actions">
        <label class="toggle"><input type="checkbox" id="toggle-meth" />显示管理接口</label>
        <button id="reload">刷新</button>
        <a id="admin-link" href="/topology/config.html">管理后台</a>
      </div>
    </header>
    <main class="stage">
      <div class="canvas-wrap">
        <svg id="topology-svg" role="img" aria-label="架构拓扑图"></svg>
        <div id="loading" class="loading">正在加载拓扑数据...</div>
        <button id="info-toggle" class="info-fab" type="button" aria-label="切换集群信息">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3a9 9 0 1 1 0 18a9 9 0 0 1 0-18Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 10.2v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="7.4" r="1.1" fill="currentColor"/>
          </svg>
          <span>集群信息</span>
        </button>
      </div>
    </main>
    <aside class="side">
      <div class="side-head">
        <h2>集群信息</h2>
        <button id="side-toggle" class="side-toggle" type="button">隐藏</button>
      </div>
      <div class="metric-grid">
        <button class="metric" data-metric="devices"><b id="metric-devices">-</b><span>设备</span></button>
        <button class="metric" data-metric="links"><b id="metric-links">-</b><span>聚合链路</span></button>
        <button class="metric" data-metric="down"><b id="metric-down">-</b><span>故障设备</span></button>
        <button class="metric" data-metric="faults"><b id="metric-fault-links">-</b><span>故障链路</span></button>
        <button class="metric" data-metric="meth"><b id="metric-meth">-</b><span>隐藏管理</span></button>
      </div>
      <div class="section">
        <h2>链路图例</h2>
        <div class="legend-row"><span>400G</span><i class="legend-line" style="background:#06b6d4"></i></div>
        <div class="legend-row"><span>200G</span><i class="legend-line" style="background:#22c55e"></i></div>
        <div class="legend-row"><span>100G</span><i class="legend-line" style="background:#fb923c"></i></div>
        <div class="legend-row"><span>25G</span><i class="legend-line" style="background:#8b5cf6"></i></div>
        <div class="legend-row"><span>10G</span><i class="legend-line" style="background:#64748b"></i></div>
        <div class="legend-row"><span>DOWN</span><i class="legend-line" style="background:#ef4444;border-top:0"></i></div>
      </div>
      <div id="line-monitor-section" class="section" style="display:none">
        <div class="detail-title">
          <b id="line-monitor-title">专线监控</b>
          <span id="line-monitor-count" class="badge">0</span>
        </div>
        <div id="line-monitor-legend" class="list">
          <div class="info-item">暂无监控项</div>
        </div>
      </div>
      <div class="section">
        <h2>详情</h2>
        <div id="detail" class="detail">点击节点、链路或上方统计查看详情。</div>
      </div>
    </aside>
  </div>

  <script>
    const svg = document.getElementById('topology-svg');
    const loading = document.getElementById('loading');
    const methToggle = document.getElementById('toggle-meth');
    const stage = document.querySelector('.stage');
    const shell = document.querySelector('.shell');
    const state = {
      config: {},
      groupRules: { groups: [] },
      architectureConfig: null,
      baseConfig: {},
      topology: { nodes: [] },
      links: [],
      allLinks: [],
      lineMonitorData: { lines: [], last_updated: null },
      lineMonitorGroups: [],
      faultIndex: { rawDown: new Set(), nodeFaultLinks: new Set(), portFaults: new Map(), downNodeIds: new Set() },
      showMeth: false,
      displayNodes: [],
      displayLinks: [],
      peerIndex: new Map(),
      hiddenMethLinks: 0,
      lastLoadedAt: null,
      dataUpdatedAt: null,
      topologyUpdatedAt: null,
      linksUpdatedAt: null,
      monitorUpdatedAt: null,
      runtimeStatus: { datasets: {}, checked_at: null },
      dataSourceError: false,
      sidebarCollapsed: false,
      sidebarAutoOpened: false,
      detailHistory: [],
      loadAllInFlight: null,
      lineMonitorRefreshInFlight: null
    };
    const SYNTHETIC_GROUPS = {
      mgmt: '__fallback-mgmt-devices__',
      compute: '__fallback-compute-devices__',
      mgmtAccess: '__mgmt-access-devices__',
      oobAgg: '__oob-aggregate-devices__',
      oobAccess: '__oob-access-devices__',
      storage: '__storage-devices__'
    };
    const SPECIAL_OOB_AGG_IDS = new Set([
      'NXDX01201F06--E02-03-25GYW-AGG2',
      'NXDX01201F06-E02-01-25GYW-AGG1',
      'NXDX01201F06-E02-09-100GPubic-AGG1',
      'NXDXA01FO2-FO2-03-25-ALIzhuanxian',
      'NXDXA01FO2-FO2-03-25-huoshanzhuanxian'
    ]);

    const DEFAULT_ARCHITECTURE_CONFIG = {
      version: 1,
      refresh_ms: 360000,
      sidebar: { enabled: true, default_collapsed: false },
      layout: { rows: [['default']] },
      zones: [{ id: 'default', title: '默认分区', subtitle: '', column: 'left', minH: 260, default: true, role_titles: {}, layout_template: 'stack', section_rules: [] }],
      clusters: [{ id: 'default', title: '集群', order: 1, default: true }],
      roles: [{ id: 'access', title: '接入', order: 1, default: true }]
    };
    let zoneDefinitions = DEFAULT_ARCHITECTURE_CONFIG.zones.slice();
    let activeZones = [];
    let activeDetail = { type: 'overview' };
    let selectedDisplayNodeId = '';
    let selectedLinkId = '';
    let focusLinkLayer = null;

    function $(id) { return document.getElementById(id); }
    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function currentClusterCode() {
      return new URLSearchParams(location.search).get('cs') || '';
    }

    function withClusterContext(path) {
      const cs = currentClusterCode();
      const [base, hash = ''] = String(path || '').split('#');
      const qIndex = base.indexOf('?');
      const rawPath = qIndex >= 0 ? base.slice(0, qIndex) : base;
      const rawQuery = qIndex >= 0 ? base.slice(qIndex + 1) : '';
      const params = new URLSearchParams(rawQuery);
      if (cs) params.set('cs', cs);
      params.set('t', String(Date.now()));
      const query = params.toString();
      return rawPath + (query ? `?${query}` : '') + (hash ? `#${hash}` : '');
    }

    function normalizeLinksPayload(payload) {
      if (Array.isArray(payload)) return payload;
      if (payload && Array.isArray(payload.lines)) return payload.lines;
      return [];
    }

    async function fetchJSON(path, fallback) {
      try {
        const res = await fetch(withClusterContext(path), { cache: 'no-store' });
        if (!res.ok) return fallback;
        return await res.json();
      } catch (e) {
        return fallback;
      }
    }

    async function fetchJSONWithMeta(path, fallback) {
      try {
        const res = await fetch(withClusterContext(path), { cache: 'no-store' });
        if (!res.ok) return { data: fallback, updatedAt: null };
        const lastModified = res.headers.get('Last-Modified');
        const updatedAt = lastModified ? new Date(lastModified) : null;
        return { data: await res.json(), updatedAt: updatedAt && !Number.isNaN(updatedAt.getTime()) ? updatedAt : null };
      } catch (e) {
        return { data: fallback, updatedAt: null };
      }
    }

    function formatDateTime(date) {
      if (!date) return '';
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function latestDate(...dates) {
      return dates.filter(Boolean).sort((a, b) => b.getTime() - a.getTime())[0] || null;
    }

    function parseDateValue(value) {
      if (!value) return null;
      const date = value instanceof Date ? value : new Date(value);
      return Number.isNaN(date.getTime()) ? null : date;
    }

    function datasetIsStale(dataset) {
      if (!dataset || dataset.required === false) return false;
      const updatedAt = parseDateValue(dataset.updated_at || dataset.last_success_at);
      const thresholdMs = Math.max(0, Number(dataset.error_after_sec) || 0) * 1000;
      if (!updatedAt) return true;
      if (thresholdMs <= 0) return false;
      return (Date.now() - updatedAt.getTime()) > thresholdMs;
    }

    function computeDataSourceError(status) {
      const datasets = (status && status.datasets) || {};
      return Object.values(datasets).some(dataset => {
        return datasetIsStale(dataset);
      });
    }

    function datasetErrorWithLoadedTime(dataset, loadedAt) {
      if (!dataset || dataset.required === false) return false;
      if (!loadedAt) return true;
      const thresholdMs = Math.max(0, Number(dataset.error_after_sec) || 0) * 1000;
      if (thresholdMs <= 0) return false;
      return (Date.now() - loadedAt.getTime()) > thresholdMs;
    }

    function computeLoadedDataSourceError(runtimeStatus, loaded) {
      const datasets = (runtimeStatus && runtimeStatus.datasets) || {};
      const topologyError = datasetErrorWithLoadedTime(datasets.topology || { required: true }, loaded.topologyUpdatedAt);
      const linksError = loaded.linksSatisfied
        ? false
        : datasetErrorWithLoadedTime(datasets.links || { required: true }, loaded.linksUpdatedAt);
      const monitorError = datasetErrorWithLoadedTime(datasets.prometheus || { required: false }, loaded.monitorUpdatedAt);
      return topologyError || linksError || monitorError;
    }

    function applyRuntimeStatus(status) {
      state.runtimeStatus = status && typeof status === 'object'
        ? { datasets: status.datasets || {}, checked_at: status.checked_at || null }
        : { datasets: {}, checked_at: null };
      state.dataSourceError = computeDataSourceError(state.runtimeStatus);
    }

    function lineMonitorConfig() {
      return ((((state.config || {}).features || {}).line_monitors) || {});
    }

    function lineMonitorEnabled() {
      return lineMonitorConfig().enabled === true;
    }

    function syntheticDevicesConfig() {
      return toArray((((state.config || {}).features || {}).synthetic_devices || {}).devices);
    }

    function portStateOverrideRules() {
      return toArray((((state.config || {}).features || {}).port_state_overrides || {}).rules);
    }

    function normalizePortList(value) {
      if (Array.isArray(value)) {
        return value.map(item => String(item || '').trim()).filter(Boolean);
      }
      if (typeof value === 'string') {
        return value.split('|').map(item => item.trim()).filter(Boolean);
      }
      return [];
    }

    function statusValueToUp(value) {
      if (value == null || value === '') return null;
      if (typeof value === 'boolean') return value;
      if (typeof value === 'number') return value === 0;
      const text = String(value).trim().toLowerCase();
      if (!text) return null;
      if (['up', 'ok', 'normal', '0', 'true'].includes(text)) return true;
      if (['down', 'alarm', 'critical', '1', 'false'].includes(text)) return false;
      return null;
    }

    function statusValueToCode(value, fallback) {
      const up = statusValueToUp(value);
      if (up == null) return typeof fallback === 'number' ? fallback : 0;
      return up ? 0 : 1;
    }

    function mergeProfile(base) {
      const params = new URLSearchParams(location.search);
      const profile = params.get('profile') || base.home_topology || 'main';
      const prof = base.profiles && base.profiles[profile] ? base.profiles[profile] : null;
      if (!prof) return base;
      const out = JSON.parse(JSON.stringify(base));
      ['title'].forEach(k => { if (typeof prof[k] !== 'undefined') out[k] = prof[k]; });
      ['default_icons', 'types', 'aliases', 'display', 'visibility'].forEach(k => {
        if (prof[k] && typeof prof[k] === 'object') out[k] = { ...(out[k] || {}), ...(prof[k] || {}) };
      });
      return out;
    }

    function normalizeName(value) {
      return String(value || '').trim();
    }

    function detailStateKey(detail) {
      const current = detail || { type: 'overview' };
      return [current.type || 'overview', current.id || '', current.metric || ''].join('::');
    }

    function cloneDetail(detail) {
      return detail ? { ...detail } : { type: 'overview' };
    }

    function rememberDetail(nextDetail) {
      const next = cloneDetail(nextDetail);
      const current = cloneDetail(activeDetail);
      if (detailStateKey(current) === detailStateKey(next)) return;
      state.detailHistory.push(current);
      if (state.detailHistory.length > 50) state.detailHistory.shift();
    }

    function detailBackButtonHtml() {
      if (!state.detailHistory.length) return '';
      return '<button id="detail-back" class="detail-btn" type="button">返回上一页</button>';
    }

    function detailActionsHtml(extraHtml) {
      const items = [detailBackButtonHtml(), extraHtml || ''].filter(Boolean);
      return items.length ? `<div class="detail-actions">${items.join('')}</div>` : '';
    }

    function bindDetailBackButton() {
      const btn = $('detail-back');
      if (!btn) return;
      btn.addEventListener('click', event => {
        event.stopPropagation();
        goBackDetail();
      });
    }

    function renderOverviewPanel() {
      const groups = state.lineMonitorGroups || [];
      const monitorItems = groups.flatMap(group => group.items || []);
      const downNodeIds = (state.faultIndex && state.faultIndex.downNodeIds) || new Set();
      const downLinks = state.displayLinks.filter(link => link.down).length;
      const zoneRows = zoneDefinitions.map(zone => {
        const count = state.displayNodes.filter(node => node.zone === zone.id).length;
        return `<div class="list-row"><div><strong>${esc(zone.title)}</strong><small>${esc(zone.subtitle || '-')}</small></div><span class="badge">${count}</span></div>`;
      }).join('');
      activeDetail = { type: 'overview' };
      selectedDisplayNodeId = '';
      selectedLinkId = '';
      applySelectionHighlight();
      setActiveMetric('');
      $('detail').innerHTML = `<div class="detail-title"><b>集群信息</b><span class="badge">${state.displayNodes.length}</span></div>
        <div class="info-grid">
          <div class="info-item"><span>展示节点</span><b>${state.displayNodes.length}</b></div>
          <div class="info-item"><span>聚合链路</span><b>${state.displayLinks.length}</b></div>
          <div class="info-item"><span>故障设备</span><b>${downNodeIds.size}</b></div>
          <div class="info-item"><span>故障链路</span><b>${downLinks}</b></div>
          <div class="info-item"><span>专线监控</span><b>${monitorItems.length}</b></div>
          <div class="info-item"><span>更新时间</span><b>${esc(formatDateTime(state.dataUpdatedAt) || '-')}</b></div>
          <div class="info-item"><span>数据源异常</span><b>${state.dataSourceError ? '是' : '否'}</b></div>
        </div>
        <div class="list">${zoneRows || '<div class="info-item">暂无分区信息</div>'}</div>`;
      restoreAutoHiddenSidebar();
    }

    function clearDetailPanel() {
      renderOverviewPanel();
    }

    function goBackDetail() {
      const previous = state.detailHistory.pop();
      if (!previous || previous.type === 'overview') {
        clearDetailPanel();
        return;
      }
      renderDetailState(previous);
    }

    function renderDetailState(detail) {
      if (!detail || detail.type === 'overview') {
        clearDetailPanel();
        return;
      }
      if (detail.type === 'node') {
        const node = state.displayNodeById && state.displayNodeById.get(detail.id);
        if (node) showNodeDetail(node, { recordHistory: false });
        else clearDetailPanel();
        return;
      }
      if (detail.type === 'raw-device') {
        showRawDeviceDetail(detail.id, { recordHistory: false });
        return;
      }
      if (detail.type === 'link') {
        const link = state.displayLinks.find(item => item.id === detail.id);
        if (link) showLinkDetail(link, state.displayNodeById.get(link.from), state.displayNodeById.get(link.to), { recordHistory: false });
        else clearDetailPanel();
        return;
      }
      if (detail.type === 'metric') {
        showMetric(detail.metric, { recordHistory: false });
        return;
      }
      if (detail.type === 'line-monitor-group') {
        showLineMonitorGroupDetail(detail.id, { recordHistory: false });
        return;
      }
      if (detail.type === 'line-monitor-item') {
        showLineMonitorItemDetail(detail.groupId, detail.id, { recordHistory: false });
        return;
      }
      clearDetailPanel();
    }

    function isSpecialOobAggregate(id, label) {
      return SPECIAL_OOB_AGG_IDS.has(String(id || '')) || SPECIAL_OOB_AGG_IDS.has(String(label || ''));
    }

    function isManagementPortName(value) {
      const name = normalizeName(value);
      if (!name) return false;
      return /^meth/i.test(name)
        || /^m-gigabitethernet/i.test(name)
        || /^mgmt(?:\s|$)/i.test(name)
        || /^mgmt [0-9]+$/i.test(name)
        || /^eth0$/i.test(name)
        || /^ethernet0$/i.test(name)
        || /^management port$/i.test(name)
        || /(loopback|null|tunnel|vlan)/i.test(name);
    }

    function isManagementNodeName(value) {
      const name = normalizeName(value);
      if (!name) return false;
      return /(?:^|[^a-z0-9])(oob|mgmt|gmgt|management)(?:[^a-z0-9]|$)/i.test(name);
    }

    function isMethPortName(value) {
      return isManagementPortName(value);
    }

    function isMgmtNumberPortName(value) {
      return isManagementPortName(value);
    }

    function isHiddenManagementPortName(value) {
      return isManagementPortName(value);
    }

    function linkUsesMeth(link) {
      return isHiddenManagementPortName(link.sourcePort)
        || isHiddenManagementPortName(link.targetPort)
        || isManagementNodeName(link.source)
        || isManagementNodeName(link.target);
    }

    const PORT_NAME_COLLATOR = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });

    function normalizePortName(name) {
      const text = normalizeName(name);
      if (!text) return '';
      if (text.toLowerCase() === 'eth0') return 'Ethernet0';
      return text;
    }

    function portKey(name) {
      return normalizeName(name).toLowerCase().replace(/\s+/g, '');
    }

    function comparePortNames(a, b) {
      return PORT_NAME_COLLATOR.compare(normalizeName(a), normalizeName(b));
    }

    function isAggregatePortName(name) {
      const text = normalizeName(name);
      return /^Bridge-Aggregation\d+$/i.test(text)
        || /^Eth-Trunk\d+$/i.test(text)
        || /^Port-Channel\d+$/i.test(text)
        || /^Route-Aggregation\d+$/i.test(text);
    }

    function portIsUp(port) {
      return !!port && (Number(port.status) === 0 || Number(port.transmit) > 0 || Number(port.receive) > 0);
    }

    function portAffectsFaultState(port) {
      if (!port) return false;
      return !(isHiddenManagementPortName(port.ifName) || isHiddenManagementPortName(port.ifDescr) || isHiddenManagementPortName(port.ifAlias) || isHiddenManagementPortName(port.ifIndex));
    }

    function portHasFault(port) {
      return portAffectsFaultState(port) && !portIsUp(port);
    }

    function rawLinkKey(link) {
      if (!link) return '';
      return [
        link.source || '',
        portKey(link.sourcePort),
        link.target || '',
        portKey(link.targetPort)
      ].join('\x01');
    }

    function markFaultPort(portFaults, nodeId, portName) {
      const key = portKey(portName);
      if (!nodeId || !key) return;
      if (!portFaults.has(nodeId)) portFaults.set(nodeId, new Set());
      portFaults.get(nodeId).add(key);
    }

    function buildFaultIndex(nodes, links, portIndex) {
      const rawDown = new Set();
      const nodeFaultLinks = new Set();
      const portFaults = new Map();
      (links || []).forEach(link => {
        if (!link || !link.source || !link.target) return;
        if (!state.showMeth && linkUsesMeth(link)) return;
        const srcPort = findPortByNameFromIndex(portIndex, link.source, link.sourcePort);
        const tgtPort = findPortByNameFromIndex(portIndex, link.target, link.targetPort);
        const srcState = portStatusSnapshot(link.source, link.sourcePort, link.target, srcPort);
        const tgtState = portStatusSnapshot(link.target, link.targetPort, link.source, tgtPort);
        const srcUp = srcState.exists ? srcState.up : true;
        const tgtUp = tgtState.exists ? tgtState.up : true;
        if (srcUp && tgtUp) return;
        rawDown.add(rawLinkKey(link));
        nodeFaultLinks.add(link.source);
        nodeFaultLinks.add(link.target);
        if (!srcUp) markFaultPort(portFaults, link.source, link.sourcePort);
        if (!tgtUp) markFaultPort(portFaults, link.target, link.targetPort);
      });
      const downNodeIds = new Set((nodes || [])
        .filter(node => deviceStatusIsDown(node))
        .map(node => node.id));
      return { rawDown, nodeFaultLinks, portFaults, downNodeIds };
    }

    function portHasLinkedFault(node, port) {
      if (!node || !port || !state.faultIndex) return false;
      const faultPorts = state.faultIndex.portFaults.get(node.id);
      if (!faultPorts) return false;
      const keys = [port.ifName, port.ifDescr, port.ifAlias, port.ifIndex].map(portKey).filter(Boolean);
      return keys.some(key => faultPorts.has(key));
    }

    function formatBytes(value) {
      const n = Number(value) || 0;
      if (n >= 1024 ** 4) return (n / 1024 ** 4).toFixed(2) + ' TB';
      if (n >= 1024 ** 3) return (n / 1024 ** 3).toFixed(2) + ' GB';
      if (n >= 1024 ** 2) return (n / 1024 ** 2).toFixed(2) + ' MB';
      if (n >= 1024) return (n / 1024).toFixed(2) + ' KB';
      return n.toFixed(0) + ' B';
    }

    function normalizeDisplayLabel(value) {
      return String(value || '')
        .replace(/^group:/i, '')
        .replace(/\bGoup(\d+)/g, 'Group$1')
        .replace(/\bCORE(\d+)\b/g, 'Core$1')
        .replace(/\bCore-(\d+)\b/g, 'Core$1');
    }

    function aliasFor(id) {
      const aliases = state.config.aliases || {};
      return normalizeDisplayLabel(aliases[id] || aliases['group:' + id] || id);
    }

    function configuredTypeFor(id, options) {
      const opts = options || {};
      const key = opts.group ? 'group:' + id : id;
      const types = (state.config && state.config.types) || {};
      return String(types[key] || (!opts.group ? (types['group:' + id] || '') : '')).trim().toLowerCase();
    }

    function configuredRoleFor(id) {
      const roles = (state.config && state.config.roles) || {};
      const value = Number(roles[id]);
      return Number.isFinite(value) && value > 0 ? value : null;
    }

    function deviceTypeFor(id) {
      const raw = state.nodeById && state.nodeById.get(id);
      return configuredTypeFor(id) || String(raw && raw.__display_meta && raw.__display_meta.type || '').trim().toLowerCase();
    }

    function deviceStatusIsDown(node) {
      if (!node) return false;
      if (node.__fixed_status_code != null) return Number(node.__fixed_status_code) !== 0;
      return Number(node.status) !== 0;
    }

    function matchesPortOverrideRule(rule, nodeId, portName, peerNodeId) {
      if (!rule || !nodeId) return false;
      const deviceIds = normalizePortList(rule.device_ids || rule.device_id);
      if (deviceIds.length && !deviceIds.includes(nodeId)) return false;
      const deviceTypes = normalizePortList(rule.device_types || rule.device_type).map(item => item.toLowerCase());
      const nodeType = deviceTypeFor(nodeId);
      if (deviceTypes.length && !deviceTypes.includes(nodeType)) return false;
      const peerIds = normalizePortList(rule.peer_device_ids || rule.peer_device_id);
      if (peerIds.length && !peerIds.includes(peerNodeId || '')) return false;
      const ports = normalizePortList(rule.ports || rule.port_names || rule.port_name);
      if (ports.length && !ports.includes(portName || '')) return false;
      return true;
    }

    function resolvePortStateOverride(nodeId, portName, peerNodeId) {
      const rules = portStateOverrideRules();
      for (const rule of rules) {
        if (!matchesPortOverrideRule(rule, nodeId, portName, peerNodeId)) continue;
        const up = statusValueToUp(rule.state);
        if (up == null) continue;
        return {
          exists: true,
          up,
          text: up ? 'UP' : 'DOWN',
          forced: true
        };
      }
      return null;
    }

    function portStatusSnapshot(nodeId, portName, peerNodeId, port) {
      const override = resolvePortStateOverride(nodeId, portName, peerNodeId);
      if (override) return { ...override, port: port || null };
      if (!port) return { exists: false, up: false, text: '缺失', forced: false, port: null };
      const up = portIsUp(port);
      return { exists: true, up, text: up ? 'UP' : 'DOWN', forced: false, port };
    }

    function inferPeerStatusFromLocalPort(port) {
      if (!port) return { exists: false, up: false, text: '-', inferred: false };
      const hasTraffic = Number(port.transmit) > 0 || Number(port.receive) > 0;
      if (!hasTraffic) return { exists: false, up: false, text: '-', inferred: false };
      return { exists: true, up: true, text: 'UP', inferred: true };
    }

    function buildSyntheticNodes() {
      return syntheticDevicesConfig().map((device, index) => {
        const id = String(device.id || `synthetic-device-${index + 1}`);
        const label = device.label || device.name || aliasFor(id) || id;
        const statusCode = statusValueToCode(device.fixed_status, 0);
        return {
          id,
          label,
          name: label,
          ip: device.ip || '',
          status: statusCode,
          __fixed_status_code: statusCode,
          ports: toArray(device.ports),
          __synthetic: true,
          __display_meta: {
            zone: device.zone || '',
            cluster: device.cluster || '',
            role: Number(device.role) || configuredRoleFor(id) || 3,
            type: String(device.type || configuredTypeFor(id) || '').trim().toLowerCase()
          },
          __synthetic_links: toArray(device.links).map(link => ({
            source: id,
            target: link.target_id,
            sourcePort: link.source_port || link.sourcePort || '',
            targetPort: link.target_port || link.targetPort || '',
            __synthetic: true
          }))
        };
      }).filter(device => device.id);
    }

    function buildSyntheticLinks(nodes) {
      return toArray(nodes).flatMap(node => toArray(node.__synthetic_links)).filter(link => link.source && link.target);
    }

    function lineEntryForMonitor(item) {
      const lines = (state.lineMonitorData && Array.isArray(state.lineMonitorData.lines)) ? state.lineMonitorData.lines : [];
      const names = [item.source_id, item.label, item.display_name, item.name]
        .map(value => String(value || '').trim())
        .filter(Boolean);
      return lines.find(line => {
        const candidates = [line && line.id, line && line.display_name, line && line.name]
          .map(value => String(value || '').trim())
          .filter(Boolean);
        return names.some(name => candidates.includes(name));
      }) || null;
    }

    function monitorStatusMeta(status) {
      if (status == null || status === '') return { down: false, text: '未知', badge: 'warn' };
      if (typeof status === 'number') return status !== 0 ? { down: true, text: 'DOWN', badge: 'bad' } : { down: false, text: 'UP', badge: 'ok' };
      const value = String(status).trim().toLowerCase();
      if (!value) return { down: false, text: '未知', badge: 'warn' };
      if (['up', 'ok', 'normal', '0', 'false'].includes(value)) return { down: false, text: 'UP', badge: 'ok' };
      if (['down', '1', 'true', 'alarm', 'critical'].includes(value)) return { down: true, text: 'DOWN', badge: 'bad' };
      return { down: false, text: String(status).toUpperCase(), badge: 'warn' };
    }

    function summarizeMonitorPorts(portDetails) {
      if (!portDetails.length) return { text: '-', badge: 'warn', down: false };
      const upCount = portDetails.filter(item => item.exists && item.up).length;
      const missingCount = portDetails.filter(item => !item.exists).length;
      if (upCount === portDetails.length) return { text: 'UP', badge: 'ok', down: false };
      if (upCount === 0 && missingCount === 0) return { text: 'DOWN', badge: 'bad', down: true };
      return { text: missingCount > 0 ? '端口缺失' : '部分异常', badge: 'warn', down: true };
    }

    function monitorPortDetails(deviceId, ports) {
      return normalizePortList(ports).map(name => {
        const port = findPortByName(deviceId, name);
        const stateInfo = portStatusSnapshot(deviceId, name, '', port);
        return {
          name,
          exists: stateInfo.exists,
          up: stateInfo.up,
          text: stateInfo.text,
          forced: stateInfo.forced,
          port
        };
      });
    }

    function effectiveMonitorMeta(statusSource, portSummary, monitorMeta) {
      const source = String(statusSource || 'monitor').trim().toLowerCase();
      if (source === 'ports') {
        return {
          down: !!portSummary.down,
          text: portSummary.down ? 'DOWN' : (portSummary.text === '-' ? '未知' : 'UP'),
          badge: portSummary.badge || 'warn'
        };
      }
      if (source === 'monitor_or_ports') {
        if (portSummary.down) return { down: true, text: 'DOWN', badge: 'bad' };
        return monitorMeta;
      }
      if (source === 'monitor_and_ports') {
        const down = !!monitorMeta.down && !!portSummary.down;
        return { down, text: down ? 'DOWN' : 'UP', badge: down ? 'bad' : 'ok' };
      }
      return monitorMeta;
    }

    function normalizeLineMonitorGroups(memberToDisplay) {
      const cfg = lineMonitorConfig();
      const groups = toArray(cfg.groups).map((group, index) => {
        const groupId = String(group.id || `group-${index + 1}`);
        const items = toArray(group.items).map((item, itemIndex) => {
          const itemId = String(item.id || item.source_id || item.name || item.display_name || item.label || `item-${itemIndex + 1}`);
          const label = item.label || item.display_name || item.name || itemId;
          const deviceId = item.device_id || group.device_id || '';
          const deviceLabel = item.device_label || aliasFor(deviceId) || deviceId || '-';
          const ports = normalizePortList(item.ports || group.ports);
          const portDetails = monitorPortDetails(deviceId, ports);
          const portSummary = summarizeMonitorPorts(portDetails);
          const lineEntry = lineEntryForMonitor({ ...item, label, source_id: item.source_id || item.id });
          const monitorMeta = monitorStatusMeta(lineEntry && lineEntry.status);
          const monitorTextMeta = monitorStatusMeta(lineEntry && (typeof lineEntry.status_text !== 'undefined' ? lineEntry.status_text : lineEntry.status));
          const statusSource = item.status_source || group.status_source || cfg.status_source || 'monitor';
          const effectiveMeta = effectiveMonitorMeta(statusSource, portSummary, monitorMeta);
          return {
            id: itemId,
            label,
            deviceId,
            deviceLabel,
            ports,
            portDetails,
            portSummary,
            lineEntry,
            statusSource,
            monitorText: lineEntry ? (lineEntry.status_text || monitorTextMeta.text) : '未知',
            monitorBadge: lineEntry ? monitorMeta.badge : 'warn',
            monitorDown: lineEntry ? monitorMeta.down : false,
            effectiveText: effectiveMeta.text,
            effectiveBadge: effectiveMeta.badge,
            effectiveDown: effectiveMeta.down
          };
        });
        const label = group.label || group.title || cfg.title || '专线监控';
        const anchorDeviceId = group.anchor_device_id || group.device_id || (items[0] && items[0].deviceId) || '';
        const anchorDisplayId = group.anchor_display_id || memberToDisplay.get(anchorDeviceId) || anchorDeviceId || '';
        const anchorRaw = anchorDeviceId ? state.nodeById.get(anchorDeviceId) : null;
        const anchorLabel = anchorRaw ? (aliasFor(anchorRaw.id) || anchorRaw.label || anchorRaw.id) : anchorDeviceId;
        const zone = group.zone || (anchorRaw ? classifyZone(anchorRaw.id, anchorLabel) : 'compute');
        const cluster = group.cluster || (anchorRaw ? clusterKey(anchorRaw.id, anchorLabel) : 'default');
        const role = Number(group.role) || (anchorRaw ? roleRank(anchorRaw.id, anchorLabel) : 3);
        return {
          id: groupId,
          nodeId: `monitor:${groupId}`,
          label,
          title: group.title || label,
          anchorDeviceId,
          anchorDisplayId,
          zone,
          cluster,
          role,
