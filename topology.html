<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>智谱集群拓扑监控</title>
<!-- 引入 vis.js -->
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0d1421;
    color: #fff;
    /* 移除触控高亮与焦点环 */
    -webkit-tap-highlight-color: transparent;
}
#title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    padding: 10px;
    color: #00e5ff;
    width: calc(100vw - 350px);
    box-sizing: border-box;
}
/* 页面内的拓扑配置切换导航 */
.profile-nav {
    text-align: center;
    font-size: 13px;
    color: #8aa;
    width: calc(100vw - 350px);
    box-sizing: border-box;
    margin-top: -6px;
    margin-bottom: 6px;
}
.profile-nav a {
    color: #00e5ff;
    margin: 0 8px;
    text-decoration: underline;
    cursor: pointer;
}
.profile-nav a.active {
    color: #ffd166;
    text-decoration: none;
}
#topo {
    width: calc(100vw - 350px);
    height: calc(100vh - 50px);
    float: left;
    position: relative;
    /* 移除径向渐变，避免在放大时出现圆形圈 */
    background: #0a1120;
    overflow: hidden; /* 避免溢出导致的边缘伪影 */
}
/* 独立的画布容器，避免清空 legend */
.topo-canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}
.sidebar {
    position: absolute;
    top: 50px;
    right: 0;
    width: 350px;
    height: calc(100% - 50px);
    background-color: #1a1f2e;
    border-left: 1px solid #2a3244;
    padding: 10px;
    overflow-y: auto;
}
.sidebar-resizer {
    position: absolute;
    left: -4px;
    top: 0;
    width: 8px;
    height: 100%;
    cursor: col-resize;
    z-index: 1201;
    background: transparent;
}
.sidebar-resizer:hover { background: rgba(255,255,255,0.06); }
.sidebar h2 {
    margin-top: 0;
    font-size: 18px;
    color: #00e5ff;
}
.port-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
.port-table th, .port-table td {
    border: 1px solid #2a3244;
    padding: 4px;
    font-size: 12px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
/* 表格斑马条纹，便于跨列阅读 */
.port-table tbody tr:nth-child(even):not(.alarm-row) { background-color: transparent !important; }
.port-table tbody tr { cursor: pointer; }
.port-table tbody tr:hover { background-color: #2a354d; }
.port-table tbody tr.row-selected { background-color: #3e5a8f !important; box-shadow: inset 0 0 0 2px #7aa2ff; }
.port-table tbody tr.row-selected td { font-weight: 600; color: #e6f1ff; }
.port-up { color: #00ff9d; }
.port-down { color: #ff4d4d; }
.legend {
    position: absolute;
    left: 20px;
    bottom: 20px;
    background: rgba(26, 31, 46, 0.85);
    padding: 8px;
    border-radius: 5px;
    z-index: 1000;
    font-size: 12px;
}
.legend-item {
    display: flex;
    align-items: center;
    margin: 4px 0;
}
/* 新增样式 */
.status-up {
    color: #00ff9d;
    font-weight: bold;
}
.status-down {
    color: #ff4d4d;
    font-weight: bold;
}
/* 集群信息数字颜色 */
.total-count { color: #ffffff; }   /* 白色 */
.down-count { color: #ff4d4d; }     /* 红色 */
.online-count { color: #00ff9d; }  /* 绿色 */

/* 集群信息区域样式 */
.overview-box {
    background: #1f2637;
    border: 1px solid #2a3244;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.overview-box p {
    margin: 6px 0;
    font-size: 14px;
}

/* 设备详情区域样式 */
.device-info-box {
    background: #1f2637;
    border: 1px solid #2a3244;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.device-info-box p {
    margin: 6px 0;
    font-size: 14px;
}
.device-info-box b {
    font-size: 16px;
    color: #00e5ff;
}

/* 告警列表样式 */
.alarm-box {
    background: #1f2637;
    border: 1px solid #2a3244;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.alarm-box h3 {
    margin: 0 0 8px 0;
    font-size: 16px;
    color: #00e5ff;
}
.alarm-list {
    list-style: none;
    padding: 0;
    margin: 0;
}
.alarm-list li {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
}
.alarm-list li span {
    flex: 1;
}
.alarm-list li.alarm {
    color: #ff4d4d;
    animation: blink 1.2s infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* 整行告警标红 */
.alarm-row {
    background-color: #3c1e1e !important;
    color: #ff4d4d !important;
}

/* 故障节点原图标闪烁 */
@keyframes node-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
/* 节点标签颜色：正常节点白色，故障节点红色 */
.vis-network .vis-label {
    color: #ffffff !important;
}
.vis-network .vis-label.status-down {
    color: #ff4d4d !important;
}

/* 专线样式：虚线蓝色，故障红色闪烁 */
@keyframes dash-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}
.dash-line {
    stroke-dasharray: 8,4;
    stroke: #00e5ff;
    stroke-width: 2;
    fill: none;
    animation: dash-blink 1s infinite;
}
.dash-line.down {
    stroke: #ff4d4d;
}

/* 图例中专线样式 */
.legend-item span.dash-legend {
    display: inline-block;

    height: 0;

}
/* 拓扑重置按钮样式（右下角） */
.reset-btn {

/* 管理员模式按钮与弹窗样式 */

.admin-modal .btn {

/* 管理员模式图标配置表单 */

/* 前台编辑工具条，置于画布上方并可点击 */
.edit-toolbar {

/* 前台编辑弹窗与遮罩，置于最上层 */

/* 移除焦点环，避免缩放时出现圆形轮廓 */
#topo-canvas:focus,
.vis-network:focus,

/* 返回组按钮与组成员设备名使用与 UP 状态一致的绿色 */

<script>
// Prometheus 地址


// 链路互联信息缓存
let linkMap = new Map();

// 字节单位转换
function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// =========== 管理员模式 & 配置加载/生成 ===========
const CONFIG_PATHS = {
  groupRules: 'config/group_rules.json',
  topology: ['config/topology_config.json', 'config/topology.config.json'],
  positions: 'config/positions.json',
  linkOverrides: 'config/link_overrides.json',
  usersLocal: 'config/.users.local'
};

const DEFAULTS = {
  groupRules: { version: 1, updatedAt: new Date().toISOString(), groups: [] },
  topology: {
    version: 1,
    backgroundColor: '#1f2637',
    sidebar: { visible: true, sections: ['overview','filters','search','alerts'] },
    layout: { mode: 'grid', forceStrength: 0.3, gridCell: 120, compact: true },
    // 响应式与交互配置（可通过 config/topology_config.json 覆盖）
    responsive: {
      auto_fit_on_load: true,           // 渲染完成后自动看全
      mode: '',                  // 默认看全（contain）；过小则保留原布局（见 min_scale）
      min_scale: 0.6,                   // 若 fit 后缩放比例 < 0.6，则保留原布局视图
      small_screen_threshold: 1280,     // 小屏阈值（容器宽度小于此值触发小屏策略）
      node_scale_small: 0.85,          // 小屏节点尺寸缩放比例
      font_scale_small: 0.9,           // 小屏字体尺寸缩放比例
      enable_dragView_on_small: true    // 小屏允许拖动画布
    },
    edgeHover: {
      enabled: true,
      hoverWidth: 10,                   // 悬停加粗宽度（更明显）
      hoverColor: '#00ff9d'             // 悬停临时颜色（亮绿，与UP一致）
    },
    performance: {
      lod: {
        hide_labels_below: 0.0,         // 始终显示设备名称（不隐藏标签）
        hide_group_members_below: 0.7,
        thin_edges_below: 0.8,
        disable_hover_below: 0.5,       // 更少关闭 hover，保证悬停可见
        disable_blink_below: 0.65
      }
    },
    default_icons: {
      group: 'icons/sigle-sw.png',
      group_bad: 'icons/sigle-sw-bad.png',
      device: 'icons/sw.png',
      device_bad: 'icons/sw-bad.png',
      core_switch: 'icons/core.png',
      core_switch_bad: 'icons/core-bad.png',
      firewall: 'icons/firewall.png',
      firewall_bad: 'icons/firewall.png',
      // 兼容旧字段
      firewall_main: 'icons/firewall.png',
      firewall_backup: 'icons/core.png'
    },
    features: { line_monitors: { enabled: false, names: [] }, auto_groups: { enabled: false } },
    refresh: { devices_ms: 5000, links_ms: 3000 },
    dynamic_links: { debounce_ms: 500, grace_ms: 3000 },
    display: { showPorts: false, showLabels: 'auto' }
  },
  positions: { version: 1, nodes: {}, groups: {} },
  linkOverrides: { version: 1, whitelist: [], blacklist: [] }
};

function downloadJson(filename, obj) {
  try {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (e) { console.error('下载 JSON 失败:', e); }
}

async function fetchJsonOrNull(url) {
  try {
    const u = url.includes('?') ? `${url}&t=${Date.now()}` : `${url}?t=${Date.now()}`;
    const res = await fetch(u, { cache: 'no-store' });
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

// 清理本地缓存并重载页面（前台编辑工具可调用）
function clearTopoCaches() {
  try {
    localStorage.removeItem('topology_config_local_cache');
    localStorage.removeItem('positions_local_cache');
    localStorage.removeItem('topo_cfg_updated');
    alert('已清理本地缓存');
  } catch (e) {
    alert('清理缓存失败: ' + e);
  }
  try { location.reload(); } catch (_) {}
}

// 监听跨标签页的配置更新通知，自动刷新视图
try {

async function loadConfigs() {
  const groupRules = await fetchJsonOrNull(CONFIG_PATHS.groupRules);
  let topology = null;
  for (const p of CONFIG_PATHS.topology) {
    topology = await fetchJsonOrNull(p);
    if (topology) break;
  }
  // 将本地缓存的拓扑配置叠加到已加载的配置上（用于前台编辑无后端保存时）
  try {
    const ls = localStorage.getItem('topology_config_local_cache');
    if (ls) {
      const cached = JSON.parse(ls);
      if (cached && typeof cached === 'object') {
        const base = topology || DEFAULTS.topology;
        const merged = { ...(base || {}), ...(cached || {}) };
        // 对对象属性做浅合并以保留已有键
        ['default_icons','visibility','types','aliases','profiles'].forEach(k => {
          if ((base && base[k]) || (cached && cached[k])) {
            merged[k] = { ...((base && base[k]) || {}), ...((cached && cached[k]) || {}) };
          }
        });
        topology = merged;
      }
    }
  } catch (e) { /* ignore */ }
  const positions = await fetchJsonOrNull(CONFIG_PATHS.positions);
  const linkOverrides = await fetchJsonOrNull(CONFIG_PATHS.linkOverrides);
  return {
    groupRules: groupRules || DEFAULTS.groupRules,
    topology: topology || DEFAULTS.topology,
    positions: positions || DEFAULTS.positions,
    linkOverrides: linkOverrides || DEFAULTS.linkOverrides,
    missing: {
      groupRules: !groupRules,
      topology: !topology,
      positions: !positions,
      linkOverrides: !linkOverrides
    }
  };
}

function getActiveProfileName(cfg) {
  try {
    const params = new URLSearchParams(location.search);
    const p1 = params.get('profile');
    if (p1) return p1;
    // 若未显式传参，则按配置的首页选择
    const home = (cfg && cfg.home_topology) ? String(cfg.home_topology) : '';
    if (home) return home;
    // 本地选择兜底
    const ls = localStorage.getItem('active_topology');
    if (ls) return ls;
  } catch (e) { /* ignore */ }
  return 'main';
}

function mergeProfile(base, prof) {
  if (!prof || typeof prof !== 'object') return base;
  const out = JSON.parse(JSON.stringify(base || {}));
  const copy = (k) => { if (typeof prof[k] !== 'undefined') out[k] = prof[k]; };
  copy('title');
  // 嵌套对象按键覆盖
  ['default_icons','types','aliases'].forEach(key => {
    if (prof[key] && typeof prof[key] === 'object') {
      out[key] = { ...(out[key] || {}), ...(prof[key] || {}) };
    }
  });
  // visibility 特殊处理：子配置若提供则完全覆盖，不与主配置合并
  if (prof.visibility && typeof prof.visibility === 'object') {
    out.visibility = JSON.parse(JSON.stringify(prof.visibility));
  }
  return out;
}

function initProfileNav(cfg) {
  try {
    const nav = document.getElementById('profile-nav');
    if (!nav) return;
    const active = getActiveProfileName(cfg);
    const names = (function(){
      const extra = Object.keys((cfg && cfg.profiles) || {});
      return ['main', ...extra];
    })();
    if (names.length <= 1) {
      nav.style.display = 'none';
      return;
    }
    nav.style.display = '';
    // 动态生成导航链接，保持现有样式与交互
    const makeLabel = (n) => {
      const p = (cfg && cfg.profiles && cfg.profiles[n]) || {};
      const t = p.title || '';
      if (t) return String(t);
      if (n === 'main') return '集群';
      if (n === 'ethernet') return '以太网';
      return n;
    };
    // 清空后重建
    nav.innerHTML = '';
    names.forEach((n, idx) => {
      const a = document.createElement('a');
      a.href = '#';
      a.setAttribute('data-profile', n);
      a.textContent = makeLabel(n);
      a.classList.toggle('active', n === active);
      a.addEventListener('click', (ev) => {
        ev.preventDefault();
        try { localStorage.setItem('active_topology', n); } catch (e) {}
        const url = new URL(window.location.href);
        url.searchParams.set('profile', n);
        window.location.href = url.toString();
      });
      nav.appendChild(a);
      if (idx < names.length - 1) {
        const sep = document.createTextNode(' | ');
        nav.appendChild(sep);
      }
    });
  } catch (e) { /* ignore */ }
}

function applyTopologyConfig(cfg) {
  try {
    // 解析 active profile 并合并子配置
    const activeName = getActiveProfileName(cfg);
    const prof = (cfg && cfg.profiles && cfg.profiles[activeName]) ? cfg.profiles[activeName] : null;
    const merged = mergeProfile(cfg || DEFAULTS.topology, prof);
    // 持久化到全局，便于图标等逻辑访问
    window.__TOPO_CFG = merged || window.__TOPO_CFG || DEFAULTS.topology;
    if (cfg && cfg.backgroundColor) {
      // 仅调整整体背景色，不改变现有渐变效果
      document.body.style.backgroundColor = cfg.backgroundColor;
    }
    const sidebarEl = document.querySelector('.sidebar');
    if (sidebarEl && (cfg && cfg.sidebar)) {
      sidebarEl.style.display = cfg.sidebar.visible ? 'block' : 'none';
    }
    // 配置页面标题（文档标题与顶部可视标题）
    const titleText = (window.__TOPO_CFG && window.__TOPO_CFG.title) ? String(window.__TOPO_CFG.title) : ((cfg && cfg.title) ? String(cfg.title) : '集群拓扑监控');
    try { document.title = titleText; } catch (e) {}
    const titleEl = document.getElementById('title');
    if (titleEl) { titleEl.textContent = titleText; }
    // 更新页面内的主/以太网切换导航高亮与行为
    initProfileNav(cfg);
    // 初始化可见性结构，确保访问安全
    try {
      const v = (window.__TOPO_CFG && window.__TOPO_CFG.visibility) || {};
      window.__TOPO_CFG.visibility = {
        devices: v.devices || {},
        groups: v.groups || {}
      };
    } catch (e) { /* ignore */ }
  } catch (e) { console.warn('应用拓扑配置失败:', e); }
}

// 专线监控配置获取与过滤
function getLineMonitorConfig() {
  const cfg = window.__TOPO_CFG || DEFAULTS.topology;
  const fm = (cfg.features && cfg.features.line_monitors) || null;
  const names = (fm && Array.isArray(fm.names)) ? fm.names : [];
  const enabled = !!(fm && (fm.enabled || names.length > 0));
  return { enabled, names };
}

function filterLinesByConfig(lines) {
  const { names } = getLineMonitorConfig();
  if (!Array.isArray(lines)) return [];
  if (!names || names.length === 0) return lines;
  const set = new Set(names);
  return lines.filter(l => set.has(l.display_name || l.name));
}

function showAdminModal(missing) {

  const modal = document.getElementById('admin-modal');
  const list = document.getElementById('missing-config-list');

  if (missing.groupRules) names.push('group_rules.json');

  const cfg = await loadConfigs();
  applyTopologyConfig(cfg.topology);
  showAdminModal(cfg.missing);
  // 免登录一小时：如本地已有登录令牌且未超过1小时，自动启用控件
  try {
    const token = localStorage.getItem('token');
    const tStr = localStorage.getItem('token_time');
    const t = tStr ? Number(tStr) : 0;
    const withinOneHour = !!(token && t && (Date.now() - t < 60 * 60 * 1000));
    const statusEl = document.getElementById('admin-login-status');
    if (withinOneHour) {
      statusEl && (statusEl.textContent = '已登录');
      window.__ADMIN_AUTH = true;
      setAdminUIEnabled(true);
    } else {
      statusEl && (statusEl.textContent = '未登录');
      window.__ADMIN_AUTH = false;
      setAdminUIEnabled(false);
    }
  } catch (e) { /* ignore */ }
  // 填充图标输入
  try {
    const icons = (window.__TOPO_CFG && window.__TOPO_CFG.default_icons) || {};
    document.getElementById('icon-group').value = icons.group || '';
    document.getElementById('icon-device').value = icons.device || '';
    document.getElementById('icon-device-bad').value = icons.device_bad || '';
    document.getElementById('icon-core').value = icons.core_switch || '';
    document.getElementById('icon-core-bad').value = icons.core_switch_bad || '';
    document.getElementById('icon-fw-main').value = icons.firewall_main || '';
    document.getElementById('icon-fw-backup').value = icons.firewall_backup || '';
  } catch (e) { /* ignore */ }
  // 上面已根据令牌状态处理，无需强制禁用
}

// 读取管理员凭证
async function loadAdminCreds() {
  try {
    const res = await fetch(CONFIG_PATHS.usersLocal);
    if (!res.ok) return null;
    const text = await res.text();
    const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if (lines.length < 2) return null;
    return { username: lines[0], password: lines[1] };
  } catch (e) {
    return null;
  }
}

function setAdminUIEnabled(enabled) {
  const ids = ['icon-group','icon-device','icon-device-bad','icon-core','icon-core-bad','icon-fw-main','icon-fw-backup','save-icons'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.disabled = !enabled;
  });
}

// 登录逻辑
document.getElementById('admin-login-btn').addEventListener('click', async () => {
  const statusEl = document.getElementById('admin-login-status');
  statusEl.textContent = '正在验证...';
  const inputUser = document.getElementById('admin-login-username').value.trim();
  const inputPass = document.getElementById('admin-login-password').value;
  const creds = await loadAdminCreds();
  if (!creds) {
    statusEl.textContent = '未找到 config/.users.local 或格式错误';
    setAdminUIEnabled(false);
    return;
  }
  if (creds.username === inputUser && creds.password === inputPass) {
    statusEl.textContent = '已登录';
    window.__ADMIN_AUTH = true;
    setAdminUIEnabled(true);
  } else {
    statusEl.textContent = '用户名或密码错误';
    window.__ADMIN_AUTH = false;
    setAdminUIEnabled(false);
  }
});

// ===== 前台编辑模式（需登录） =====
(function setupFrontEditMode(){
  const token = localStorage.getItem('token');
  const tStr = localStorage.getItem('token_time');
  const t = tStr ? Number(tStr) : 0;
  // 工具条显示仅依赖 token 存在；保存动作由后端校验
  const validAuth = !!token;
  const auth = validAuth ? { 'Authorization': 'Bearer ' + token } : {};
  const params = new URLSearchParams(location.search);
  const editParam = params.get('edit');
  const editFlag = localStorage.getItem('edit_mode');
  const editMode = (editParam === '1' || editFlag === '1') && validAuth;
  window.__EDIT_MODE = editMode;
  const toolbar = document.getElementById('front-edit-toolbar');
  if (toolbar) toolbar.style.display = editMode ? 'flex' : 'none';
  try {
    if (!editMode) {
      const reason = !token ? '未检测到登录令牌' : (!((editParam === '1') || (editFlag === '1')) ? '未开启编辑模式' : '未知原因');
      console.info('[front-edit] 工具条未显示：', reason);
    }
  } catch (e) { /* ignore */ }

  async function putConfig(name, obj) {
    const resp = await fetch(`/api/config/${name}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json', ...auth },
      body: JSON.stringify(obj)
    });
    const data = await resp.json().catch(()=>({}));
    if (!resp.ok) throw new Error(data.error || '保存失败');
    return data;
  }

  async function savePositionsFront() {
    // 允许使用全局变量 networkData 或挂载到 window 的 networkData
    const nds = window.networkData || (typeof networkData !== 'undefined' ? networkData : null);
    if (!window.network || !nds) return;
    try {
      const activeName = getActiveProfileName(window.__TOPO_CFG || DEFAULTS.topology);
      const ids = nds.nodes.getIds();
      const pos = window.network.getPositions(ids);
      const out = { version: 1, updatedAt: new Date().toISOString(), nodes: {} };
      ids.forEach(id => { const p = pos[id]; if (p) out.nodes[id] = { x: p.x, y: p.y }; });
      // 读取原有 positions 以合并不同 profile 的布局
      let prev = null;
      try {
        const r = await fetch('/api/config/positions');
        if (r && r.ok) prev = await r.json().catch(()=>null);
      } catch (e) { /* ignore */ }
      if (!prev) {
        try {
          const r2 = await fetch('/config/positions.json');
          if (r2 && r2.ok) prev = await r2.json().catch(()=>null);
        } catch (e) { /* ignore */ }
      }
      prev = prev || { version: 1, nodes: {}, profiles: {} };
      const next = { ...prev };
      next.version = 1;
      next.updatedAt = new Date().toISOString();
      next.profiles = next.profiles || {};
      if (activeName === 'main') {
        // 主拓扑：写入顶层 nodes，不影响其它 profile
        next.nodes = out.nodes;
      } else {
        // 子拓扑：写入 profiles[active].nodes，不影响顶层 nodes
        next.profiles[activeName] = next.profiles[activeName] || {};
        next.profiles[activeName].nodes = out.nodes;
      }
      const res = await putConfig('positions', next);
      // 本地缓存兜底，便于服务暂不可用时前端仍可恢复位置
      try { localStorage.setItem(`positions_local_cache_${activeName}`, JSON.stringify(out)); } catch (e) {}
      localStorage.setItem(`positions_updated_${activeName}`, String(Date.now()));
      try {
        if (res && res.message === 'no changes') {
          console.info('位置未变化（未写入服务器），已应用到当前页面');
        } else {
          console.info('位置已保存（已写入服务器），并已应用到当前页面');
        }
        // 立即应用当前页面位置，避免刷新前还原
        Object.entries(out.nodes).forEach(([id, p]) => { try { window.network.moveNode(id, p.x, p.y); } catch (e) {} });
      } catch (e) {}
    } catch (e) { console.error('保存位置失败:', e); }
  }

  async function saveFrontAll() {
    try {
      const backdrop = document.getElementById('fe-backdrop');
      const modal = document.getElementById('fe-modal');
      const isOpen = backdrop && modal && backdrop.style.display !== 'none' && modal.style.display !== 'none';
      if (isOpen) {
        const propBtn = document.getElementById('fe-save-prop');
        if (propBtn) {
          propBtn.click();
          await new Promise(r => setTimeout(r, 50));
        }
      }
      await savePositionsFront();
    } catch (e) { console.error('保存失败:', e); }
  }

  async function openFrontEditor(nodeId) {
    try {
      const cfgAll = await loadConfigs();
      const cfg = cfgAll.topology || {};
      const active = getActiveProfileName(cfg);
      const prof = (cfg && cfg.profiles && cfg.profiles[active]) ? cfg.profiles[active] : null;
      const aliases = (active === 'main') ? (cfg.aliases || {}) : ((prof && prof.aliases) || {});
      const types = (active === 'main') ? (cfg.types || {}) : ((prof && prof.types) || {});
      const modal = document.getElementById('fe-modal');
      const backdrop = document.getElementById('fe-backdrop');
      document.getElementById('fe-node-id').value = nodeId;
      document.getElementById('fe-node-name').value = aliases[nodeId] || '';
      document.getElementById('fe-node-type').value = types[nodeId] || 'switch';
      backdrop.style.display = 'block';
      modal.style.display = 'block';
      // 保存按钮行为
      const saveBtn = document.getElementById('fe-save-prop');
      const cancelBtn = document.getElementById('fe-cancel');
      const close = () => { backdrop.style.display = 'none'; modal.style.display = 'none'; };
      cancelBtn.onclick = close;
      saveBtn.onclick = async () => {
        try {
          const name = document.getElementById('fe-node-name').value.trim();
          const type = document.getElementById('fe-node-type').value;
          const id = document.getElementById('fe-node-id').value;
          const activeName = getActiveProfileName(cfg);
          const next = { ...cfg };
          next.profiles = next.profiles || {};
          if (activeName === 'main') {
            next.aliases = { ...(cfg.aliases || {}) };
            next.types = { ...(cfg.types || {}) };
            if (name) next.aliases[id] = name; else delete next.aliases[id];
            if (type) next.types[id] = type; else delete next.types[id];
          } else {
            const p = next.profiles[activeName] = next.profiles[activeName] || {};
            p.aliases = { ...(p.aliases || {}) };
            p.types = { ...(p.types || {}) };
            if (name) p.aliases[id] = name; else if (p.aliases) delete p.aliases[id];
            if (type) p.types[id] = type; else if (p.types) delete p.types[id];
          }
          await putConfig('topology_config', next);
          // 同页立即应用最新配置，便于图标与别名即时更新
          try { window.__TOPO_CFG = next; applyTopologyConfig(next); } catch (e) {}
          localStorage.setItem('topo_config_updated', String(Date.now()));
          // 即时更新当前图
          if (window.networkData && window.networkData.nodes) {
            const n = window.networkData.nodes.get(id) || { id, status: 0 };
            const img = getNodeIcon({ id, status: n.status });
            const fallbackImg = resolveIconUrl((DEFAULTS.topology && DEFAULTS.topology.default_icons && DEFAULTS.topology.default_icons.device) || 'icons/sw.png');
            window.networkData.nodes.update({ id, label: name || id, image: img || fallbackImg, shape: 'image' });
          }
          close();
        } catch (e) { console.error('保存属性失败:', e); }
      };
    } catch (e) { console.error('打开前台编辑弹窗失败:', e); }
  }

  // 工具条事件
  const saveBtn = document.getElementById('fe-save');
  const exitBtn = document.getElementById('fe-exit');
  if (saveBtn) saveBtn.addEventListener('click', () => saveFrontAll());
  const exitFrontEdit = () => {
    // 退出编辑模式：清除登录信息与编辑标记，关闭权限
    try {
      localStorage.removeItem('edit_mode');
      localStorage.removeItem('token');
      localStorage.removeItem('token_time');
    } catch (e) {}
    window.location.href = '/';
  };
  if (exitBtn) exitBtn.addEventListener('click', exitFrontEdit);
  window.exitFrontEdit = exitFrontEdit;

  // 暴露编辑器打开函数供点击事件调用
  window.openFrontEditor = openFrontEditor;
  window.savePositionsFront = savePositionsFront;
  window.saveFrontAll = saveFrontAll;
})();

// 前台编辑：保存设备显示开关到当前激活的拓扑配置
async function saveDeviceVisibility(deviceId, visible) {
  // 获取最新的拓扑配置（优先后端，其次本地文件，最后本地缓存/内存）
  const token = localStorage.getItem('token') || '';
  const auth = token ? { 'Authorization': 'Bearer ' + token } : {};
  let cfg = null;
  try {
    const r = await fetch('/api/config/topology_config', { headers: { ...auth } });
    if (r && r.ok) cfg = await r.json().catch(()=>null);
  } catch (e) { /* ignore */ }
  if (!cfg) {
    try {
      const r2 = await fetch('/config/topology_config.json');
      if (r2 && r2.ok) cfg = await r2.json().catch(()=>null);
    } catch (e) { /* ignore */ }
  }
  if (!cfg) {
    try {
      const ls = localStorage.getItem('topology_config_local_cache');
      if (ls) cfg = JSON.parse(ls);
    } catch (e) { /* ignore */ }
  }
  cfg = cfg || (window.__TOPO_CFG ? JSON.parse(JSON.stringify(window.__TOPO_CFG)) : JSON.parse(JSON.stringify(DEFAULTS.topology)));
  const active = getActiveProfileName(window.__TOPO_CFG || cfg);
  const target = (function(){
    if (active === 'main') {
      cfg.visibility = cfg.visibility || { devices: {}, groups: {} };
      return cfg.visibility;
    } else {
      cfg.profiles = cfg.profiles || {};
      const prof = cfg.profiles[active] = cfg.profiles[active] || {};
      prof.visibility = prof.visibility || { devices: {}, groups: {} };
      return prof.visibility;
    }
  })();
  const isGroup = String(deviceId).startsWith('group:');
  const gid = isGroup ? String(deviceId).slice(6) : null;
  if (isGroup) {
    target.groups = target.groups || {};
    target.groups[gid] = !!visible;
  } else {
    target.devices = target.devices || {};
    target.devices[deviceId] = !!visible;
  }
  // 试图写回后端；若失败则写入本地缓存
  try {
    const wr = await fetch('/api/config/topology_config', {
      method: 'PUT', headers: { 'Content-Type': 'application/json', ...auth },
      body: JSON.stringify(cfg)
    });
    if (!wr.ok) throw new Error('server write failed');
  } catch (e) {
    try { localStorage.setItem('topology_config_local_cache', JSON.stringify(cfg)); } catch (e2) { /* ignore */ }
  }
  // 本页立即应用并重载拓扑
  try {
    const v = (((window.__TOPO_CFG || {}).visibility) || { devices: {}, groups: {} });
    if (isGroup) {
      v.groups = v.groups || {};
      v.groups[gid] = !!visible;
    } else {
      v.devices = v.devices || {};
      v.devices[deviceId] = !!visible;
    }
    window.__TOPO_CFG.visibility = v;
    // 广播更新（跨标签页）
    try { localStorage.setItem('topo_cfg_updated', String(Date.now())); } catch (_) {}
  } catch (e) {}
  try { localStorage.setItem('topo_config_updated', String(Date.now())); } catch (e) {}
  await loadTopology();
}

// 计算流量占用百分比
function calcUtil(tx, rx, upPorts) {
    const maxVal = Math.max(tx||0, rx||0);
    const totalGb = 400 * 1000 * 1000 * 1000 * upPorts;
    return totalGb ? (maxVal/totalGb*100) : 0;
}

// 节点显示名称处理：优先别名，否则取最后一段
function formatName(name, alias) {
    if (alias) return alias;
    const parts = name.split('_');
    return parts[parts.length - 1];
}

// 将相对图标路径在本地预览环境下解析为 /web/* 路径
function resolveIconUrl(icon) {
    if (!icon) return icon;
    // 外链或绝对路径直接返回
    if (/^(https?:)?\/\//.test(icon)) return icon;
    if (icon.startsWith('/web/')) return icon;
    // 统一前缀到 /web 下的静态目录（server/main.go 将 webRoot 挂载到 /web）
    const normalized = icon.replace(/^\.\/?/, '');
    return '/web/' + normalized;
}

// 获取节点图标
function getNodeIcon(d) {
    const cfg = window.__TOPO_CFG || DEFAULTS.topology;
    const icons = (cfg && cfg.default_icons) || {};
    const types = (cfg && cfg.types) || {};
    const t = types[d.id] || null;
    const isCore = d.id.includes('25Gnei_AGG01') || d.id.includes('25Gnei_AGG02');
    // 优先使用类型配置
    if (t === 'firewall') {
        return resolveIconUrl(d.status !== 0 ? (icons.firewall_bad || icons.firewall || icons.device_bad || 'icons/firewall.png') : (icons.firewall || icons.device || 'icons/firewall.png'));
    }
    if (t === 'core_switch') {
        return resolveIconUrl(d.status !== 0 ? (icons.core_switch_bad || icons.core_switch || icons.device_bad || 'icons/core-bad.png') : (icons.core_switch || icons.device || 'icons/core.png'));
    }
    if (t === 'switch_group') {
        return resolveIconUrl(d.status !== 0 ? (icons.group_bad || icons.group || icons.device_bad || 'icons/sigle-sw-bad.png') : (icons.group || icons.device || 'icons/sigle-sw.png'));
    }
    if (t === 'switch') {
        return resolveIconUrl(d.status !== 0 ? (icons.device_bad || icons.device || 'icons/sw-bad.png') : (icons.device || 'icons/sw.png'));
    }
    if (d.status !== 0) {
        if (isCore) return resolveIconUrl(icons.core_switch_bad || icons.core_switch || 'icons/core-bad.png');
        return resolveIconUrl(icons.device_bad || icons.device || 'icons/sw-bad.png');
    }
    return resolveIconUrl(isCore ? (icons.core_switch || 'icons/core.png') : (icons.device || 'icons/sw.png'));
}

// 获取连线颜色：任一设备总体或端口超阈值即按阈值着色
function getLinkColor(d, nodeMap) {
    if (d.status !== 0) return '#ff4d4d';
    const srcNode = nodeMap.get(d.from);
    const tgtNode = nodeMap.get(d.to);
    const srcUtil = srcNode ? calcUtil(srcNode.transmit||0, srcNode.receive||0,
        (srcNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
    const tgtUtil = tgtNode ? calcUtil(tgtNode.transmit||0, tgtNode.receive||0,
        (tgtNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
    const maxUtil = Math.max(srcUtil, tgtUtil);
    if (maxUtil < 20) return '#006400';
    if (maxUtil <= 70) return '#ffd166';
    return '#ff9e44';
}

// 端口名归一化与索引（加速端口查找）
function normalizePortName(s) {
    return String(s || '')
        .replace(/\s+/g, '')
        .replace(/FourHundredGigabitEthernet/gi, 'FHGigabitEthernet')
        .replace(/FourHundredGigE/gi, 'FHGigabitEthernet')
        .toLowerCase();
}
window.__PORT_INDEX = new Map(); // deviceId -> Map(normalizedPortName -> port)
function buildPortIndex(nodesArr) {
    try {
        const idx = new Map();
        (nodesArr || []).forEach(n => {
            const m = new Map();
            (n.ports || []).forEach(p => {
                const d1 = normalizePortName(p.ifDescr);
                const d2 = normalizePortName(p.ifIndex);
                if (d1) m.set(d1, p);
                if (d2) m.set(d2, p);
            });
            idx.set(n.id, m);
        });
        window.__PORT_INDEX = idx;
    } catch (e) {}
}
// 根据端口名称查找端口（优先使用索引）
function findPortByName(node, portName) {
    if (!node || !portName) return null;
    const target = normalizePortName(portName);
    const devIdx = window.__PORT_INDEX && window.__PORT_INDEX.get(node.id);
    if (devIdx && devIdx.has(target)) return devIdx.get(target);
    // 回退线性查找
    const ports = node.ports || [];
    for (let i = 0; i < ports.length; i++) {
        const p = ports[i];
        const d1 = normalizePortName(p.ifDescr);
        const d2 = normalizePortName(p.ifIndex);
        if (d1 === target || d2 === target) return p;
    }
    return null;
}

// 无向边键：将 A-B 与 B-A 合并到同一键，避免重复
function makeUndirectedKey(a, b) {
    return a < b ? `${a}-${b}` : `${b}-${a}`;
}

// ===== 组感知：端点展开与原始链路聚合 =====
// 展开端点到设备ID列表：设备→自身；组→成员设备ID列表
function expandEndpointToDevices(endpointId) {
    try {
        if (String(endpointId).startsWith('group:')) {
            const gid = String(endpointId).slice(6);
            const members = (groupMembersById && groupMembersById[gid]) ? groupMembersById[gid] : [];
            return members.map(m => m.id);
        }
        return [endpointId];
    } catch (e) { return [endpointId]; }
}
// 聚合某条边（可能为组端点）的所有原始端口互联记录
function gatherRawLinksForEdge(edge) {
    const fromIds = expandEndpointToDevices(edge.from);
    const toIds = expandEndpointToDevices(edge.to);
    const results = [];
    const seen = new Set();
    for (const a of fromIds) {
        for (const b of toIds) {
            if (a === b) continue; // 跳过自环
            const key = makeUndirectedKey(a, b);
            const arr = linkMap.get(key) || [];
            for (const rec of arr) {
                // 规整方向为 a→b
                const oriented = (rec.source === a && rec.target === b)
                    ? rec
                    : { source: rec.target, sourcePort: rec.targetPort, target: rec.source, targetPort: rec.sourcePort };
                const pidA = `${oriented.source}|${oriented.sourcePort}`;
                const pidB = `${oriented.target}|${oriented.targetPort}`;
                const undirectedPairId = pidA < pidB ? `${pidA}__${pidB}` : `${pidB}__${pidA}`;
                if (seen.has(undirectedPairId)) continue;
                seen.add(undirectedPairId);
                results.push(oriented);
            }
        }
    }
    return results;
}

// 辅助：判断某条边是否存在互联端口DOWN（以 links.json 的端口对为准）
function edgeHasDownInterPort(edge, nodeMap) {
    // 覆盖状态优先
    try {
        const undirectedKey = makeUndirectedKey(edge.from, edge.to);
        const overrides = (window.__LINK_OVERRIDES && window.__LINK_OVERRIDES.status) || null;
        const forced = overrides ? overrides[undirectedKey] : null;
        if (forced === 'DOWN') return true;
        if (forced === 'UP') return false;
    } catch (e) { /* ignore */ }
    const rawLinks = gatherRawLinksForEdge(edge);
    if (rawLinks.length === 0) {
        const fromIds = expandEndpointToDevices(edge.from);
        const toIds = expandEndpointToDevices(edge.to);
        const anyFromDown = fromIds.some(id => { const n = nodeMap.get(id); return !!(n && n.status !== 0); });
        const anyToDown = toIds.some(id => { const n = nodeMap.get(id); return !!(n && n.status !== 0); });
        return anyFromDown || anyToDown;
    }
    for (const rec of rawLinks) {
        const srcNode = nodeMap.get(rec.source);
        const tgtNode = nodeMap.get(rec.target);
        const srcPort = findPortByName(srcNode, rec.sourcePort);
        const tgtPort = findPortByName(tgtNode, rec.targetPort);
        const srcUp = srcPort ? (srcPort.status === 1 || (srcPort.transmit > 0 || srcPort.receive > 0)) : false;
        const tgtUp = tgtPort ? (tgtPort.status === 1 || (tgtPort.transmit > 0 || tgtPort.receive > 0)) : false;
        if (!srcUp || !tgtUp) return true;
    }
    return false;
}

async function loadLinkInfo() {
    try {
        const res = await fetch('links.json?t=' + Date.now(), { cache: 'no-store' });
        const data = await res.json();
        if (!Array.isArray(data)) return;
        linkMap.clear();
        data.forEach(link => {
            const key = makeUndirectedKey(link.source, link.target);
            if (!linkMap.has(key)) linkMap.set(key, []);
            // 仅存原始条目，点击时按 from/to 方向规整并在展示层去重
            linkMap.get(key).push(link);
        });
    } catch (e) {
        console.error('加载 links.json 失败:', e);
    }
}

function attachRowSelectHandlers(root) {
    try {
        const tbody = root.querySelector('.port-table tbody');
        if (!tbody) return;
        const getRows = () => Array.from(tbody.querySelectorAll('tr'));
        tbody.addEventListener('click', (ev) => {

            if (!tr || !tbody.contains(tr)) return;
            const rows = getRows();
            const idx = rows.indexOf(tr);
            const hasShift = !!ev.shiftKey;
            const hasMeta = !!ev.metaKey || !!ev.ctrlKey;
            let lastIdx = parseInt(tbody.getAttribute('data-last-selected-index') || '-1', 10);
            if (hasShift && lastIdx >= 0) {
                const start = Math.min(lastIdx, idx);
                const end = Math.max(lastIdx, idx);
                rows.forEach((r, i) => { if (i >= start && i <= end) r.classList.add('row-selected'); });
            } else if (hasMeta) {
                if (tr.classList.contains('row-selected')) tr.classList.remove('row-selected'); else tr.classList.add('row-selected');
            } else {
                rows.forEach(r => r.classList.remove('row-selected'));

            }
            tbody.setAttribute('data-last-selected-index', String(idx));
        });
    } catch (e) {}
}

}

// 检查互联端口是否DOWN
function hasDownInterPort(node) {
    if (!node || !node.ports) return false;
    return node.ports.some(p => {
        const portUp = p.status === 1 || (p.transmit > 0 || p.receive > 0);
        return !portUp;
    });
}

// 获取节点图标
function getNodeIconWithInterPort(d) {
    const cfg = window.__TOPO_CFG || DEFAULTS.topology;
    const icons = (cfg && cfg.default_icons) || {};
    const types = (cfg && cfg.types) || {};
    const t = types[d.id] || null;
    const isCore = d.id.includes('25Gnei_AGG01') || d.id.includes('25Gnei_AGG02');
    // 优先类型逻辑
    const bad = (d.status !== 0 || hasDownInterPort(d));
    if (t === 'firewall') {
        return resolveIconUrl(bad ? (icons.firewall_bad || icons.firewall || icons.device_bad || 'icons/firewall.png') : (icons.firewall || icons.device || 'icons/firewall.png'));
    }
    if (t === 'core_switch') {
        return resolveIconUrl(bad ? (icons.core_switch_bad || icons.core_switch || icons.device_bad || 'icons/core-bad.png') : (icons.core_switch || icons.device || 'icons/core.png'));
    }
    if (t === 'switch_group') {
        // 仅在组节点（id 以 group: 开头）时使用组图标；普通设备误配为 switch_group 时按交换机处理
        if (String(d.id).startsWith('group:')) {
            return resolveIconUrl(bad ? (icons.group_bad || icons.group || icons.device_bad || 'icons/sigle-sw-bad.png') : (icons.group || icons.device || 'icons/sigle-sw.png'));
        }
        // fallback 为交换机图标
        return resolveIconUrl(bad ? (icons.device_bad || icons.device || 'icons/sw-bad.png') : (icons.device || 'icons/sw.png'));
    }
    if (t === 'switch') {
        return resolveIconUrl(bad ? (icons.device_bad || icons.device || 'icons/sw-bad.png') : (icons.device || 'icons/sw.png'));
    }
    if (bad) {
        if (isCore) return resolveIconUrl(icons.core_switch_bad || icons.core_switch || 'icons/core-bad.png');
        return resolveIconUrl(icons.device_bad || icons.device || 'icons/sw-bad.png');
    }
    return resolveIconUrl(isCore ? (icons.core_switch || 'icons/core.png') : (icons.device || 'icons/sw.png'));
}

// 获取连线颜色
function getLinkColorWithInterPort(d, nodeMap) {
    const rawLinks = gatherRawLinksForEdge(d);
    // 覆盖状态（编辑模式可设置）：link_overrides.status[undirectedKey] = 'UP'/'DOWN'/null
    try {
        const undirectedKey = makeUndirectedKey(d.from, d.to);
        const overrides = (window.__LINK_OVERRIDES && window.__LINK_OVERRIDES.status) || null;
        const forced = overrides ? overrides[undirectedKey] : null;
        if (forced === 'DOWN') return '#ff4d4d';
        if (forced === 'UP') {
            // 强制UP时忽略端口状态，直接走利用率着色（深绿色）
            const util = getEdgeMaxUtil(d, nodeMap);
            return (util > 20) ? '#ffd166' : '#006400';
        }
    } catch (e) { /* ignore */ }
    let down = false;
    if (rawLinks.length === 0) {
        // 无端口信息时：端点可能为组，按端点设备状态综合判断
        const fromIds = expandEndpointToDevices(d.from);
        const toIds = expandEndpointToDevices(d.to);
        const anyFromDown = fromIds.some(id => { const n = nodeMap.get(id); return !!(n && n.status !== 0); });
        const anyToDown = toIds.some(id => { const n = nodeMap.get(id); return !!(n && n.status !== 0); });
        down = anyFromDown || anyToDown;
    } else {
        for (const rec of rawLinks) {
            const srcNode = nodeMap.get(rec.source);
            const tgtNode = nodeMap.get(rec.target);
            const srcPort = findPortByName(srcNode, rec.sourcePort);
            const tgtPort = findPortByName(tgtNode, rec.targetPort);
            const srcUp = srcPort ? (srcPort.status === 1 || (srcPort.transmit > 0 || srcPort.receive > 0)) : false;
            const tgtUp = tgtPort ? (tgtPort.status === 1 || (tgtPort.transmit > 0 || tgtPort.receive > 0)) : false;
            if (!srcUp || !tgtUp) { down = true; break; }
        }
    }
    if (down) return '#ff4d4d';
    const util = getEdgeMaxUtil(d, nodeMap);
    return (util > 20) ? '#ffd166' : '#006400';
}

// 计算边两端的最大利用率（组端点取成员最大值）
function getEdgeMaxUtil(edge, nodeMap) {
    function nodeUtil(n) {
        if (!n) return 0;
        const upPorts = (n.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1;
        return calcUtil(n.transmit||0, n.receive||0, upPorts);
    }
    const fromIds = expandEndpointToDevices(edge.from);
    const toIds = expandEndpointToDevices(edge.to);
    const fUtil = Math.max(0, ...fromIds.map(id => nodeUtil(nodeMap.get(id))));
    const tUtil = Math.max(0, ...toIds.map(id => nodeUtil(nodeMap.get(id))));
    return Math.max(fUtil, tUtil);
}
