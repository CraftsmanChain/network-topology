          lineColor: group.line_color || '#22d3ee',
          items,
          count: items.length,
          down: items.some(item => item.effectiveDown)
        };
      }).filter(group => group.items.length > 0 || group.anchorDisplayId);
      state.lineMonitorGroups = groups;
      return groups;
    }

    function lineMonitorGroupById(id) {
      return (state.lineMonitorGroups || []).find(group => group.id === id || group.nodeId === id) || null;
    }

    function monitorPortsHtml(portDetails) {
      if (!portDetails.length) return '<span class="port-muted">-</span>';
      return `<div class="peer-stack">${portDetails.map(item => {
        if (!item.exists) return `<div class="peer-chip"><span>${esc(item.name)}</span><span class="badge warn">缺失</span></div>`;
        return `<div class="peer-chip"><span>${esc(item.name)}</span><span class="${item.up ? 'port-up' : 'port-down'}">${item.up ? 'UP' : 'DOWN'}</span></div>`;
      }).join('')}</div>`;
    }

    function monitorBadgeHtml(text, badge) {
      return `<span class="badge ${badge || 'warn'}">${esc(text || '未知')}</span>`;
    }

    function compileRules() {
      return (state.groupRules.groups || []).map(group => {
        const includeRegex = (group.include_regex || []).map(rx => {
          try { return new RegExp(rx); } catch (e) { return null; }
        }).filter(Boolean);
        const excludeRegex = (group.exclude_regex || []).map(rx => {
          try { return new RegExp(rx); } catch (e) { return null; }
        }).filter(Boolean);
        return { ...group, includeRegex, excludeRegex };
      });
    }

    function matchesGroup(group, node) {
      const id = node.id;
      const name = node.label || node.name || id;
      const inIds = (group.include_ids || []).includes(id);
      const inRegex = group.includeRegex.some(rx => rx.test(id) || rx.test(name));
      const exIds = (group.exclude_ids || []).includes(id);
      const exRegex = group.excludeRegex.some(rx => rx.test(id) || rx.test(name));
      return (inIds || inRegex) && !(exIds || exRegex);
    }

    function toArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function compileRegexList(patterns) {
      return toArray(patterns).map(pattern => {
        try { return new RegExp(pattern, 'i'); } catch (e) { return null; }
      }).filter(Boolean);
    }

    function normalizeArchitectureConfig(raw) {
      const cfg = raw && Array.isArray(raw.zones) && raw.zones.length ? raw : DEFAULT_ARCHITECTURE_CONFIG;
      const zones = toArray(cfg.zones).map((zone, idx) => ({
        id: String(zone.id || `zone-${idx + 1}`),
        title: zone.title || zone.name || zone.id || `分区 ${idx + 1}`,
        subtitle: zone.subtitle || '',
        column: zone.column || (idx % 2 === 0 ? 'left' : 'right'),
        minH: Number(zone.minH) || 240,
        default: zone.default === true,
        layout_template: String(zone.layout_template || 'stack'),
        fallback_section_title: zone.fallback_section_title || '其它设备',
        role_titles: zone.role_titles && typeof zone.role_titles === 'object' ? { ...zone.role_titles } : {},
        section_rules: toArray(zone.section_rules).map((section, sectionIdx) => ({
          id: String(section.id || `section-${sectionIdx + 1}`),
          title: section.title || section.name || section.id || `分组 ${sectionIdx + 1}`,
          order: Number(section.order) || sectionIdx + 1,
          include_ids: toArray(section.include_ids),
          exclude_ids: toArray(section.exclude_ids),
          includeRegex: compileRegexList(section.include_regex),
          excludeRegex: compileRegexList(section.exclude_regex)
        })).sort((a, b) => a.order - b.order),
        include_ids: toArray(zone.include_ids),
        exclude_ids: toArray(zone.exclude_ids),
        includeRegex: compileRegexList(zone.include_regex),
        excludeRegex: compileRegexList(zone.exclude_regex)
      }));
      const clusters = (toArray(cfg.clusters).length ? toArray(cfg.clusters) : DEFAULT_ARCHITECTURE_CONFIG.clusters).map((cluster, idx) => ({
        id: String(cluster.id || `cluster-${idx + 1}`),
        title: cluster.title || cluster.name || cluster.id || `集群 ${idx + 1}`,
        order: Number(cluster.order) || idx + 1,
        default: cluster.default === true,
        include_ids: toArray(cluster.include_ids),
        exclude_ids: toArray(cluster.exclude_ids),
        includeRegex: compileRegexList(cluster.include_regex),
        excludeRegex: compileRegexList(cluster.exclude_regex)
      })).sort((a, b) => a.order - b.order);
      const roles = (toArray(cfg.roles).length ? toArray(cfg.roles) : DEFAULT_ARCHITECTURE_CONFIG.roles).map((role, idx) => ({
        id: String(role.id || `role-${idx + 1}`),
        title: role.title || role.name || role.id || `角色 ${idx + 1}`,
        order: Number(role.order) || idx + 1,
        default: role.default === true,
        include_ids: toArray(role.include_ids),
        exclude_ids: toArray(role.exclude_ids),
        includeRegex: compileRegexList(role.include_regex),
        excludeRegex: compileRegexList(role.exclude_regex)
      })).sort((a, b) => a.order - b.order);
      const configuredRows = toArray(cfg.layout && cfg.layout.rows)
        .map(row => toArray(row).map(String).filter(Boolean))
        .filter(row => row.length);
      const rows = configuredRows.length ? configuredRows : [zones.map(zone => zone.id)];
      return {
        ...cfg,
        refresh_ms: Number(cfg.refresh_ms) || 360000,
        sidebar: {
          ...(DEFAULT_ARCHITECTURE_CONFIG.sidebar || {}),
          ...((cfg && cfg.sidebar) || {})
        },
        layout: { ...(cfg.layout || {}), rows },
        zones,
        clusters,
        roles
      };
    }

    function matchesRule(rule, id, label) {
      const text = `${id || ''} ${label || ''}`;
      const inIds = toArray(rule.include_ids).includes(id);
      const inRegex = (rule.includeRegex || []).some(rx => rx.test(text));
      const exIds = toArray(rule.exclude_ids).includes(id);
      const exRegex = (rule.excludeRegex || []).some(rx => rx.test(text));
      const hasInclude = toArray(rule.include_ids).length > 0 || (rule.includeRegex || []).length > 0;
      return (!hasInclude || inIds || inRegex) && !(exIds || exRegex);
    }

    function defaultRule(list) {
      return list.find(item => item.default) || list[0] || null;
    }

    function matchedZoneRule(id, label) {
      const zones = (state.architectureConfig && state.architectureConfig.zones) || DEFAULT_ARCHITECTURE_CONFIG.zones;
      if (isSpecialOobAggregate(id, label)) {
        return zones.find(zone => zone.id === 'oob') || null;
      }
      return zones.find(zone => matchesRule(zone, id, label)) || null;
    }

    function classifyZone(id, label) {
      const zones = (state.architectureConfig && state.architectureConfig.zones) || DEFAULT_ARCHITECTURE_CONFIG.zones;
      const matched = matchedZoneRule(id, label);
      const fallback = defaultRule(zones);
      return (matched || fallback || {}).id || 'default';
    }

    function classifyDisplayZone(node, id, label) {
      if (node && node.kind === 'group' && Array.isArray(node.raw)) {
        const matched = node.raw
          .map(item => matchedZoneRule(item.id, item.label || item.name || item.id))
          .find(Boolean);
        if (matched) return matched.id;
      }
      return classifyZone(id, label);
    }

    function roleRank(id, label) {
      const roles = (state.architectureConfig && state.architectureConfig.roles) || DEFAULT_ARCHITECTURE_CONFIG.roles;
      if (isSpecialOobAggregate(id, label)) {
        const aggregateRole = roles.find(role => role.id === 'aggregate');
        return Number((aggregateRole || defaultRule(roles) || {}).order) || 1;
      }
      const matched = roles.find(role => !role.default && matchesRule(role, id, label));
      const fallback = defaultRule(roles);
      return Number((matched || fallback || {}).order) || 1;
    }

    function roleLabel(role, zoneId) {
      const roles = (state.architectureConfig && state.architectureConfig.roles) || DEFAULT_ARCHITECTURE_CONFIG.roles;
      const roleDef = roles.find(item => Number(item.order) === Number(role)) || {};
      const zone = zoneId ? zoneDefinitions.find(item => item.id === zoneId) : null;
      const roleTitles = zone && zone.role_titles && typeof zone.role_titles === 'object' ? zone.role_titles : null;
      if (roleTitles) {
        if (roleDef.id && roleTitles[roleDef.id]) return roleTitles[roleDef.id];
        if (roleTitles[String(role)]) return roleTitles[String(role)];
      }
      return roleDef.title || '接入';
    }

    function zoneTitle(zoneId) {
      return (zoneDefinitions.find(zone => zone.id === zoneId) || {}).title || zoneId;
    }

    function clusterKey(id, label) {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      const matched = clusters.find(cluster => !cluster.default && matchesRule(cluster, id, label));
      const fallback = defaultRule(clusters);
      return (matched || fallback || {}).id || 'default';
    }

    function clusterTitle(cluster) {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      return (clusters.find(item => item.id === cluster) || {}).title || cluster;
    }

    function hasMultipleClusters() {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      return clusters.length > 1;
    }

    function useLegacyClusterSections(zoneId) {
      if (!hasMultipleClusters()) return false;
      return zoneSectionRules(zoneId).length === 0;
    }

    function displayClusterTitle(cluster) {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      const fallback = defaultRule(clusters);
      if (!hasMultipleClusters() && fallback && cluster === fallback.id) return '';
      return clusterTitle(cluster);
    }

    function currentProfileName() {
      const params = new URLSearchParams(location.search);
      return params.get('profile') || ((state.config && state.config.home_topology) ? state.config.home_topology : 'main') || 'main';
    }

    function baseConfigVisibility() {
      return (state.baseConfig && state.baseConfig.visibility) || { devices: {}, groups: {} };
    }

    function profileConfig(name) {
      const base = state.baseConfig || {};
      return (base.profiles && base.profiles[name]) || null;
    }

    function profileVisibility(name) {
      const prof = profileConfig(name);
      return (prof && prof.visibility) || { devices: {}, groups: {} };
    }

    function explicitVisibleInProfile(id, profileName) {
      const vis = profileVisibility(profileName);
      const devices = vis.devices || {};
      const groups = vis.groups || {};
      if (Object.prototype.hasOwnProperty.call(devices, id)) return devices[id] !== false;
      if (Object.prototype.hasOwnProperty.call(groups, id)) return groups[id] !== false;
      return true;
    }

    function ethernetVisibilityNode(node) {
      const id = node.id;
      const mainVisible = explicitVisibleInProfile(id, 'main');
      const ethernetVisible = explicitVisibleInProfile(id, 'ethernet');
      const baseVisible = baseConfigVisibility();
      const baseDevices = baseVisible.devices || {};
      const baseGroups = baseVisible.groups || {};
      const hiddenInBase = (Object.prototype.hasOwnProperty.call(baseDevices, id) && baseDevices[id] === false)
        || (Object.prototype.hasOwnProperty.call(baseGroups, id) && baseGroups[id] === false);
      return (ethernetVisible && !mainVisible) || hiddenInBase;
    }

    function isExcludedMetricNodeId(id) {
      const value = String(id || '');
      if (!value) return true;
      if (value.startsWith('group:')) return true;
      return value === 'special-line-acc02';
    }

    function zoneSectionRules(zoneId) {
      const zone = zoneDefinitions.find(item => item.id === zoneId);
      return zone ? toArray(zone.section_rules) : [];
    }

    function architectureSectionMeta(node) {
      const candidateId = node.kind === 'group' && node.groupId ? node.groupId : node.id;
      const candidateLabel = node.kind === 'group' && node.groupId ? (aliasFor(node.groupId) || node.label || node.groupId) : (node.label || candidateId);
      if (candidateId === SYNTHETIC_GROUPS.mgmt) {
        return {
          id: `section:mgmt:unmatched-mgmt-devices`,
          title: '带内设备',
          order: 3,
          visual: 'group'
        };
      }
      if (candidateId === SYNTHETIC_GROUPS.compute) {
        return {
          id: `section:compute:compute-devices`,
          title: '智算设备',
          order: 999,
          visual: 'group'
        };
      }
      const sectionRule = zoneSectionRules(node.zone).find(rule => matchesRule(rule, candidateId, candidateLabel));
      if (sectionRule) {
        return {
          id: `section:${node.zone}:${sectionRule.id}`,
          title: sectionRule.title,
          order: Number(sectionRule.order) || 1,
          visual: node.kind === 'device' ? 'device' : 'group'
        };
      }
      if (useLegacyClusterSections(node.zone)) {
        return {
          id: String(node.cluster || 'default'),
          title: clusterTitle(node.cluster || 'default'),
          order: 1000,
          visual: node.kind === 'device' ? 'device' : 'group'
        };
      }
      if (node.zone === 'compute') {
        const zone = zoneDefinitions.find(item => item.id === node.zone) || {};
        return {
          id: `section:${node.zone}:others`,
          title: zone.fallback_section_title || '其它设备',
          order: 999,
          visual: 'device'
        };
      }
      return {
        id: String(node.cluster || 'default'),
        title: node.zone === 'compute' ? clusterTitle(node.cluster || 'default') : roleLabel(node.role, node.zone),
        order: 1000,
        visual: node.kind === 'device' ? 'device' : 'group'
      };
    }

    function deviceHasDownPort(node) {
      return !!(node && state.faultIndex && state.faultIndex.nodeFaultLinks.has(node.id));
    }

    function buildPortIndex(nodes) {
      const index = new Map();
      nodes.forEach(node => {
        const map = new Map();
        (node.ports || []).forEach(port => {
          [port.ifName, port.ifDescr, port.ifAlias, port.ifIndex].forEach(name => {
            const key = portKey(name);
            if (key) map.set(key, port);
          });
        });
        index.set(node.id, map);
      });
      return index;
    }

    function findPortByName(nodeId, name) {
      return state.portIndex && state.portIndex.get(nodeId) ? state.portIndex.get(nodeId).get(portKey(name)) : null;
    }

    function addPeerIndexEntry(index, nodeId, portName, peerNodeId, peerPortName) {
      const key = portKey(portName);
      if (!nodeId || !key || !peerNodeId) return;
      if (!index.has(nodeId)) index.set(nodeId, new Map());
      const nodeMap = index.get(nodeId);
      if (!nodeMap.has(key)) nodeMap.set(key, []);
      const list = nodeMap.get(key);
      const dedupeKey = `${peerNodeId}::${portKey(peerPortName)}`;
      if (!list.some(item => item.key === dedupeKey)) {
        list.push({
          key: dedupeKey,
          nodeId: peerNodeId,
          portName: peerPortName || ''
        });
      }
    }

    function peerTargetNameFromPort(port) {
      if (!port) return '';
      const peerName = normalizeName(port.lldp_peer_name);
      if (peerName) return peerName;
      const aliasPeer = parseLinkAlias(port.ifAlias);
      return normalizeName(aliasPeer && aliasPeer.nodeId);
    }

    function peerEntriesFromIndex(nodeId, port) {
      if (!state.peerIndex || !nodeId || !port) return [];
      const nodeMap = state.peerIndex.get(nodeId);
      const candidates = [port.ifName, port.ifDescr]
        .map(portKey)
        .filter(Boolean);
      const seen = new Set();
      const result = [];
      candidates.forEach(key => {
        ((nodeMap && nodeMap.get(key)) || []).forEach(item => {
          if (seen.has(item.key)) return;
          seen.add(item.key);
          result.push(item);
        });
      });
      return result;
    }

    function directPeerEntries(nodeId, port) {
      if (!nodeId || !port) return [];
      const result = peerEntriesFromIndex(nodeId, port);
      if (result.length) return result;
      const seen = new Set();
      if (port.lldp_peer_name) {
        pushPeerEntry(result, seen, port.lldp_peer_name, normalizePortName(port.lldp_peer_port || ''));
      }
      if (!result.length) {
        const aliasPeer = parseLinkAlias(port.ifAlias);
        if (aliasPeer) {
          pushPeerEntry(result, seen, aliasPeer.nodeId, normalizePortName(aliasPeer.portName || ''));
        }
      }
      return result;
    }

    function aggregateMemberPeerEntries(nodeId, port) {
      const portName = port && (port.ifName || port.ifDescr || '');
      if (!isAggregatePortName(portName)) return [];
      const node = state.nodeById && state.nodeById.get(nodeId);
      const targetName = peerTargetNameFromPort(port);
      if (!node || !targetName) return [];
      const result = [];
      const seen = new Set();
      effectivePorts(node).forEach(candidate => {
        if (!candidate || candidate === port) return;
        const candidateName = candidate.ifName || candidate.ifDescr || '';
        if (isAggregatePortName(candidateName)) return;
        if (peerTargetNameFromPort(candidate) !== targetName) return;
        directPeerEntries(nodeId, candidate).forEach(item => {
          if (seen.has(item.key)) return;
          seen.add(item.key);
          result.push(item);
        });
      });
      if (!result.length) {
        const remoteNode = state.nodeById && state.nodeById.get(targetName);
        effectivePorts(remoteNode).forEach(candidate => {
          if (!candidate) return;
          const candidateName = normalizePortName(candidate.ifName || candidate.ifDescr || candidate.ifIndex || '');
          if (!candidateName || isAggregatePortName(candidateName)) return;
          const peerMatch = directPeerEntries(targetName, candidate)
            .some(item => item.nodeId === nodeId);
          if (!peerMatch) return;
          const dedupeKey = `${targetName}::${portKey(candidateName)}`;
          if (seen.has(dedupeKey)) return;
          seen.add(dedupeKey);
          result.push({
            key: dedupeKey,
            nodeId: targetName,
            portName: candidateName
          });
        });
      }
      return result.sort((a, b) => comparePortNames(a.portName, b.portName));
    }

    function parseLinkAlias(alias) {
      const text = normalizeName(alias);
      const prefix = 'Link-to-';
      if (!text || !text.startsWith(prefix)) return null;
      const payload = text.slice(prefix.length).trim();
      if (!payload) return null;
      const pos = payload.lastIndexOf('_');
      if (pos <= 0) return { nodeId: payload, portName: '' };
      return {
        nodeId: payload.slice(0, pos).trim(),
        portName: payload.slice(pos + 1).trim()
      };
    }

    function buildTopologyFallbackLinks(topology) {
      const nodes = Array.isArray(topology && topology.nodes) ? topology.nodes : [];
      const nodeIds = new Set(nodes.map(node => node && node.id).filter(Boolean));
      const seen = new Set();
      const links = [];
      nodes.forEach(node => {
        const source = node && node.id;
        if (!source) return;
        (node.ports || []).forEach(port => {
          if (!port) return;
          const sourcePort = normalizePortName(port.ifName || port.ifDescr || port.ifIndex || '');
          if (!sourcePort) return;
          const aliasPeer = parseLinkAlias(port.ifAlias);
          const target = normalizeName(port.lldp_peer_name || (aliasPeer && aliasPeer.nodeId) || '');
          if (!target || !nodeIds.has(target) || target === source) return;
          const targetPort = normalizePortName(port.lldp_peer_port || (aliasPeer && aliasPeer.portName) || '');
          const left = `${source}\x01${portKey(sourcePort)}`;
          const right = `${target}\x01${portKey(targetPort)}`;
          const key = left < right ? `${left}\x02${right}` : `${right}\x02${left}`;
          if (seen.has(key)) return;
          seen.add(key);
          links.push({
            source,
            sourcePort,
            target,
            targetPort
          });
        });
      });
      return links;
    }

    function countResolvableLinks(links, topology) {
      const nodeIds = new Set(((topology && topology.nodes) || []).map(node => node && node.id).filter(Boolean));
      return (links || []).filter(link => link && nodeIds.has(link.source) && nodeIds.has(link.target)).length;
    }

    function resolveEffectiveLinks(rawLinks, topology, runtimeStatus) {
      const normalizedLinks = normalizeLinksPayload(rawLinks);
      const fallbackLinks = buildTopologyFallbackLinks(topology);
      const linksStale = datasetIsStale((((runtimeStatus || {}).datasets || {}).links) || null);
      const resolvableLinks = countResolvableLinks(normalizedLinks, topology);
      const shouldUseFallback = fallbackLinks.length > 0 && (
        normalizedLinks.length === 0 ||
        linksStale ||
        resolvableLinks === 0
      );
      return {
        links: shouldUseFallback ? fallbackLinks : normalizedLinks,
        usedFallback: shouldUseFallback
      };
    }

    function pushPeerEntry(list, seen, nodeId, portName) {
      if (!nodeId) return;
      const dedupeKey = `${nodeId}::${portKey(portName)}`;
      if (seen.has(dedupeKey)) return;
      seen.add(dedupeKey);
      list.push({ key: dedupeKey, nodeId, portName: portName || '' });
    }

    function buildPeerIndex(links) {
      const index = new Map();
      (links || []).forEach(link => {
        if (!link || !link.source || !link.target) return;
        addPeerIndexEntry(index, link.source, link.sourcePort, link.target, link.targetPort);
        addPeerIndexEntry(index, link.target, link.targetPort, link.source, link.sourcePort);
      });
      return index;
    }

    function findPeerEntries(nodeId, port) {
      if (!nodeId || !port) return [];
      const aggregatePeers = aggregateMemberPeerEntries(nodeId, port);
      if (aggregatePeers.length) return aggregatePeers;
      return directPeerEntries(nodeId, port);
    }

    function effectivePorts(node) {
      const ports = Array.isArray(node && node.ports) ? node.ports : [];
      if (state.showMeth) return ports;
      return ports.filter(p => !(isHiddenManagementPortName(p.ifName) || isHiddenManagementPortName(p.ifDescr) || isHiddenManagementPortName(p.ifAlias) || isHiddenManagementPortName(p.ifIndex)));
    }

    function hasHighSpeedPort(node, thresholdGbps) {
      return effectivePorts(node).some(port => (Number(port && port.speed_mbps) || 0) >= thresholdGbps);
    }

    function explicitSyntheticBucket(zoneId, role) {
      if (zoneId === 'oob' && Number(role) === 2) {
        return {
          id: SYNTHETIC_GROUPS.oobAgg,
          label: '带外汇聚',
          zone: 'oob',
          cluster: 'default',
          role: 2
        };
      }
      if (zoneId === 'mgmt' && Number(role) === 3) {
        return {
          id: SYNTHETIC_GROUPS.mgmtAccess,
          label: '带内接入',
          zone: 'mgmt',
          cluster: 'default',
          role: 3
        };
      }
      if (zoneId === 'oob' && Number(role) === 3) {
        return {
          id: SYNTHETIC_GROUPS.oobAccess,
          label: '带外接入',
          zone: 'oob',
          cluster: 'default',
          role: 3
        };
      }
      if (zoneId === 'storage') {
        return {
          id: SYNTHETIC_GROUPS.storage,
          label: '存储区',
          zone: 'storage',
          cluster: 'default',
          role: 3
        };
      }
      return null;
    }

    function detectSyntheticArchitectureGroupMeta(id, label) {
      const text = `${id || ''} ${label || ''}`;
      let match = text.match(/(?:^|[\s:_-])CORE\s*([0-9]+)(?:$|[\s:_-])/i);
      if (match) {
        const num = match[1];
        return {
          id: `NXDXA-CORE${num}`,
          include_regex: [`^.*[_-]CORE${num}-\\d+$`, `^CORE${num}-\\d+$`]
        };
      }
      match = text.match(/Group\s*([0-9]+)[-_ ]Spine\s*([0-9]+)/i);
      if (match) {
        return {
          id: `Group${match[1]}-Spine${match[2]}`,
          include_regex: [`^.*Group${match[1]}[-_ ]Spine${match[2]}-\\d+$`]
        };
      }
      match = text.match(/Group\s*([0-9]+)[-_ ]pod\s*([0-9]+)-leaf\s*[0-9]*/i);
      if (match) {
        return {
          id: `Group${match[1]}-pod${match[2]}-Leaf`,
          include_regex: [`^.*Group${match[1]}[_-]pod${match[2]}-leaf\\d+$`]
        };
      }
      match = text.match(/(?:^|[\s:_-])pod\s*([13])[-_ ]leaf\s*[0-9]+(?:$|[\s:_-])/i);
      if (match) {
        return {
          id: `Group2-pod${match[1]}-Leaf`,
          include_regex: [`^pod${match[1]}-leaf\\d+$`]
        };
      }
      return null;
    }

    function buildEffectiveArchitectureGroups(baseGroups, rawNodes) {
      const groups = Array.isArray(baseGroups) ? baseGroups.map(group => ({ ...group })) : [];
      const existing = new Set(groups.map(group => String(group.id || '')));
      (rawNodes || []).forEach(node => {
        const meta = detectSyntheticArchitectureGroupMeta(node && node.id, (node && (node.label || node.name)) || '');
        if (!meta || existing.has(meta.id)) return;
        groups.push({
          id: meta.id,
          include_ids: [],
          exclude_ids: [],
          includeRegex: compileRegexList(meta.include_regex),
          excludeRegex: []
        });
        existing.add(meta.id);
      });
      return groups;
    }

    function buildDisplayModel() {
      const cfg = state.config || {};
      const visibility = cfg.visibility || {};
      const groupVisibility = visibility.groups || {};
      const topologyNodes = (state.topology.nodes || []).filter(n => n && n.id && !isExcludedMetricNodeId(n.id));
      const syntheticNodes = buildSyntheticNodes();
      const metricNodes = topologyNodes.concat(syntheticNodes);
      const effectiveLinks = (state.links || []).concat(buildSyntheticLinks(syntheticNodes));
      // 架构视图需要把未匹配规则的设备收口到 fallback 组里，因此这里不再
      // 先按 device visibility 过滤，避免设备在进入“带内设备/智算设备”前被吞掉。
      const rawNodes = metricNodes;
      const rules = buildEffectiveArchitectureGroups(compileRules(), rawNodes);
      const nodeById = new Map(metricNodes.map(n => [n.id, n]));
      state.nodeById = nodeById;
      const portIndex = buildPortIndex(metricNodes);
      state.portIndex = portIndex;
      state.allLinks = effectiveLinks;
      state.faultIndex = buildFaultIndex(metricNodes, effectiveLinks, portIndex);
      state.metricNodes = metricNodes;
      const groups = new Map();
      const memberToDisplay = new Map();
      const standalone = [];
      const fallbackBuckets = new Map([
        [SYNTHETIC_GROUPS.mgmt, []],
        [SYNTHETIC_GROUPS.compute, []]
      ]);
      const explicitBuckets = new Map();

      rawNodes.forEach(node => {
        const rule = rules.find(g => matchesGroup(g, node));
        if (rule && groupVisibility[rule.id] !== false) {
          if (!groups.has(rule.id)) groups.set(rule.id, { id: 'group:' + rule.id, groupId: rule.id, label: aliasFor(rule.id), members: [], raw: [] });
          const group = groups.get(rule.id);
          group.members.push(node.id);
          group.raw.push(node);
          memberToDisplay.set(node.id, group.id);
        } else {
          standalone.push(node);
        }
      });

      const displayNodes = [];
      groups.forEach(group => {
        const down = group.raw.some(node => deviceStatusIsDown(node));
        const label = aliasFor(group.id) || aliasFor(group.groupId);
        displayNodes.push({
          id: group.id,
          label,
          zone: classifyDisplayZone(group, group.groupId, label),
          cluster: clusterKey(group.groupId, label),
          role: roleRank(group.groupId, label),
          type: configuredTypeFor(group.groupId, { group: true }),
          count: group.members.length,
          down,
          kind: 'group',
          groupId: group.groupId,
          members: group.members
        });
      });

      standalone.forEach(node => {
        const label = aliasFor(node.id) || node.label || node.name || node.id;
        const configuredMeta = node.__display_meta || {};
        if (configuredMeta.zone) {
          displayNodes.push({
            id: node.id,
            label,
            zone: configuredMeta.zone,
            cluster: configuredMeta.cluster || clusterKey(node.id, label),
            role: Number(configuredMeta.role) || roleRank(node.id, label),
            type: configuredMeta.type || configuredTypeFor(node.id),
            count: 1,
            down: deviceStatusIsDown(node),
            kind: 'device',
            members: [node.id]
          });
          memberToDisplay.set(node.id, node.id);
          return;
        }
        const matchedZone = matchedZoneRule(node.id, label);
        if (matchedZone) {
          const role = roleRank(node.id, label);
          const explicitBucket = explicitSyntheticBucket(matchedZone.id, role);
          if (explicitBucket) {
            if (!explicitBuckets.has(explicitBucket.id)) {
              explicitBuckets.set(explicitBucket.id, { ...explicitBucket, nodes: [] });
            }
            explicitBuckets.get(explicitBucket.id).nodes.push(node);
            memberToDisplay.set(node.id, 'group:' + explicitBucket.id);
            return;
          }
          displayNodes.push({
            id: node.id,
            label,
            zone: matchedZone.id,
            cluster: clusterKey(node.id, label),
            role,
            type: configuredMeta.type || configuredTypeFor(node.id),
            count: 1,
            down: deviceStatusIsDown(node),
            kind: 'device',
            members: [node.id]
          });
          memberToDisplay.set(node.id, node.id);
          return;
        }
        const syntheticId = hasHighSpeedPort(node, 200) ? SYNTHETIC_GROUPS.compute : SYNTHETIC_GROUPS.mgmt;
        fallbackBuckets.get(syntheticId).push(node);
        memberToDisplay.set(node.id, 'group:' + syntheticId);
      });

      explicitBuckets.forEach(bucket => {
        if (!bucket.nodes.length) return;
        displayNodes.push({
          id: 'group:' + bucket.id,
          label: bucket.label,
          zone: bucket.zone,
          cluster: bucket.cluster,
          role: bucket.role,
          type: configuredTypeFor(bucket.id, { group: true }),
          count: bucket.nodes.length,
          down: bucket.nodes.some(node => deviceStatusIsDown(node)),
          kind: 'group',
          groupId: bucket.id,
          members: bucket.nodes.map(node => node.id)
        });
      });

      fallbackBuckets.forEach((bucket, syntheticId) => {
        if (!bucket.length) return;
        const computeBucket = syntheticId === SYNTHETIC_GROUPS.compute;
        displayNodes.push({
          id: 'group:' + syntheticId,
          label: computeBucket ? '智算设备' : '带内设备',
          zone: computeBucket ? 'compute' : 'mgmt',
          cluster: computeBucket ? clusterKey(syntheticId, '智算设备') : 'default',
          role: 3,
          type: configuredTypeFor(syntheticId, { group: true }),
          count: bucket.length,
          down: bucket.some(node => deviceStatusIsDown(node)),
          kind: 'group',
          groupId: syntheticId,
          members: bucket.map(node => node.id)
        });
      });

      const monitorGroups = lineMonitorEnabled() ? normalizeLineMonitorGroups(memberToDisplay) : [];
      if (!lineMonitorEnabled()) state.lineMonitorGroups = [];
      monitorGroups.forEach(group => {
        if (!group.anchorDisplayId) return;
        displayNodes.push({
          id: group.nodeId,
          label: group.label,
          zone: group.zone,
          cluster: group.cluster,
          role: group.role,
          type: 'monitor',
          count: group.count,
          down: group.down,
          kind: 'monitor',
          monitorGroupId: group.id,
          members: []
        });
      });

      const linkMap = new Map();
      let hiddenMeth = 0;
      effectiveLinks.forEach(link => {
        if (!link || !link.source || !link.target) return;
        if (!state.showMeth && linkUsesMeth(link)) {
          hiddenMeth++;
          return;
        }
        const from = memberToDisplay.get(link.source) || link.source;
        const to = memberToDisplay.get(link.target) || link.target;
        if (!from || !to || from === to) return;
        const key = from < to ? from + '---' + to : to + '---' + from;
        if (!linkMap.has(key)) linkMap.set(key, { id: key, from: from < to ? from : to, to: from < to ? to : from, count: 0, down: false, speed: 0, raw: [] });
        const rec = linkMap.get(key);
        rec.count++;
        rec.raw.push(link);
        if (rawLinkDown(link)) rec.down = true;
        const srcPort = findPortByNameFromIndex(portIndex, link.source, link.sourcePort);
        const tgtPort = findPortByNameFromIndex(portIndex, link.target, link.targetPort);
        rec.speed = Math.max(rec.speed, Number(srcPort && srcPort.speed_mbps) || 0, Number(tgtPort && tgtPort.speed_mbps) || 0);
      });

      const nodeIds = new Set(displayNodes.map(n => n.id));
      const displayLinks = Array.from(linkMap.values()).filter(link => nodeIds.has(link.from) && nodeIds.has(link.to));
      monitorGroups.forEach(group => {
        if (!group.anchorDisplayId || !nodeIds.has(group.anchorDisplayId) || !nodeIds.has(group.nodeId)) return;
        displayLinks.push({
          id: `monitor-link:${group.id}:${group.anchorDisplayId}`,
          from: group.anchorDisplayId,
          to: group.nodeId,
          count: Math.max(1, group.count),
          down: group.down,
          speed: 0,
          raw: [],
          kind: 'monitor',
          dashed: true,
          fixedColor: group.lineColor,
          monitorGroupId: group.id
        });
      });
      const displayNodeMap = new Map(displayNodes.map(node => [node.id, node]));
      const displayFaultLinkCount = displayLinks.reduce((count, link) => count + (link.down ? 1 : 0), 0);
      state.displayNodes = displayNodes;
      state.displayLinks = displayLinks;
      state.displayFaultLinkCount = displayFaultLinkCount;
      state.hiddenMethLinks = hiddenMeth;
      state.nodeById = nodeById;
      state.peerIndex = buildPeerIndex(effectiveLinks);
      state.displayNodeById = displayNodeMap;
    }

    function shouldAnimateRender() {
      const nodeCount = state.displayNodes.length;
      const linkCount = state.displayLinks.length;
      return nodeCount <= 80 && linkCount <= 120 && (nodeCount + linkCount) <= 180;
    }

    function findPortByNameFromIndex(index, nodeId, name) {
      return index && index.get(nodeId) ? index.get(nodeId).get(portKey(name)) : null;
    }

    function layoutNodes() {
      const byZone = new Map(zoneDefinitions.map(zone => [zone.id, []]));
      const fallbackZoneId = (zoneDefinitions[0] && zoneDefinitions[0].id) || 'compute';
      if (!byZone.has(fallbackZoneId)) byZone.set(fallbackZoneId, []);
      state.displayNodes.forEach(node => {
        const targetZone = byZone.has(node.zone) ? node.zone : fallbackZoneId;
        if (!byZone.has(targetZone)) byZone.set(targetZone, []);
        byZone.get(targetZone).push(node);
      });

      const layoutCfg = {
        cardW: 142,
        cardH: 106,
        padX: 24,
        headerH: 58,
        padBottom: 24,
        colGap: 18,
        rowGap: 18,
        roleGap: 30,
        clusterGap: 18,
        clusterLabelH: 26,
        clusterPadX: 14,
        clusterPadBottom: 14
      };
      const roleOrder = ((state.architectureConfig && state.architectureConfig.roles) || DEFAULT_ARCHITECTURE_CONFIG.roles).map(role => Number(role.order) || 1);

      function columnsFor(width) {
        const usable = Math.max(layoutCfg.cardW, width - layoutCfg.padX * 2);
        return Math.max(1, Math.floor((usable + layoutCfg.colGap) / (layoutCfg.cardW + layoutCfg.colGap)));
      }

      function roleRows(count, width) {
        return Math.max(1, Math.ceil(count / columnsFor(width)));
      }

      function roleBlockHeight(count, width) {
        const rows = roleRows(count, width);
        return rows * layoutCfg.cardH + Math.max(0, rows - 1) * layoutCfg.rowGap;
      }

      function clusterSections(list) {
        const map = new Map();
        list.forEach(node => {
          const meta = architectureSectionMeta(node);
          const key = meta.id;
          if (!map.has(key)) {
            map.set(key, { id: key, title: meta.title, order: meta.order, visual: meta.visual, nodes: [] });
          }
          map.get(key).nodes.push(node);
        });
        return Array.from(map.values())
          .filter(section => section && section.nodes.length > 0)
          .sort((a, b) => {
            if ((a.order || 0) !== (b.order || 0)) return (a.order || 0) - (b.order || 0);
            return String(a.title || '').localeCompare(String(b.title || ''), 'zh-CN');
          });
      }

      function clusterHeight(section, width) {
        const innerWidth = Math.max(layoutCfg.cardW, width - layoutCfg.clusterPadX * 2);
        const roles = roleOrder.filter(role => section.nodes.some(node => node.role === role));
        const blocks = roles.map(role => roleBlockHeight(section.nodes.filter(node => node.role === role).length, innerWidth));
        return layoutCfg.clusterLabelH + blocks.reduce((sum, h) => sum + h, 0) + Math.max(0, blocks.length - 1) * layoutCfg.roleGap + layoutCfg.clusterPadBottom;
      }

      function sectionLayoutMeta(zone, section) {
        if ((zone.layout_template || 'stack') !== 'single_cluster_multi_group') {
          const id = String(section.id || '');
          if (id.endsWith(':unmatched-mgmt-devices')) return { rowOrder: 3, slot: 99 };
          return { rowOrder: Number(section.order) || 1000, slot: Number(section.order) || 1000 };
        }
        const id = String(section.id || '');
        if (id.endsWith(':core')) return { rowOrder: 1, slot: 1 };
        const match = id.match(/group(\d+)-(aggregate|access)$/);
        if (match) {
          return {
            rowOrder: match[2] === 'aggregate' ? 2 : 3,
            slot: Number(match[1]) || 99
          };
        }
        if (id.endsWith(':compute-devices')) return { rowOrder: 4, slot: 1 };
        if (id.endsWith(':others')) return { rowOrder: 4, slot: 1 };
        return { rowOrder: 4, slot: Number(section.order) || 999 };
      }

      function sectionRows(zone, sections) {
        if ((zone.layout_template || 'stack') !== 'single_cluster_multi_group') {
          return sections.map(section => ({ order: Number(section.order) || 1000, sections: [section] }));
        }
        const rowMap = new Map();
        sections.forEach(section => {
          const meta = sectionLayoutMeta(zone, section);
          const key = String(meta.rowOrder);
          if (!rowMap.has(key)) rowMap.set(key, { order: meta.rowOrder, sections: [] });
          rowMap.get(key).sections.push({ ...section, __slot: meta.slot });
        });
        return Array.from(rowMap.values())
          .sort((a, b) => a.order - b.order)
          .map(row => ({
            ...row,
            sections: row.sections.sort((a, b) => (a.__slot || 0) - (b.__slot || 0) || String(a.title || '').localeCompare(String(b.title || ''), 'zh-CN'))
          }));
      }

      function zoneHeight(def, list) {
        const width = def.w || 530;
        const sections = clusterSections(list);
        const rows = sectionRows(def, sections);
        const blocks = rows.map(row => {
          const rowWidth = width - 24;
          const sectionWidth = row.sections.length <= 1
            ? rowWidth
            : Math.floor((rowWidth - layoutCfg.clusterGap * (row.sections.length - 1)) / row.sections.length);
          return Math.max(...row.sections.map(section => clusterHeight(section, sectionWidth)));
        });
        const contentH = layoutCfg.headerH + blocks.reduce((sum, h) => sum + h, 0) + Math.max(0, blocks.length - 1) * layoutCfg.clusterGap + layoutCfg.padBottom;
        return Math.max(def.minH, contentH);
      }

      const viewportWidth = Math.max(1174, (stage && stage.clientWidth) || svg.clientWidth || 1174);
      const outerMargin = 38;
      const zoneGap = 38;
      const contentWidth = viewportWidth - outerMargin * 2;
      const dualZoneWidth = Math.floor((contentWidth - zoneGap) / 2);
      const zoneById = new Map(zoneDefinitions.map(def => [def.id, def]));
      const hasNodes = id => (byZone.get(id) || []).length > 0;
      activeZones = [];
      let y = 34;
      const configuredRows = ((state.architectureConfig && state.architectureConfig.layout && state.architectureConfig.layout.rows) || [zoneDefinitions.map(zone => zone.id)]);
      configuredRows.forEach(pair => {
        const defs = pair.filter(hasNodes).map(id => zoneById.get(id));
        if (!defs.length) return;
        const fullWidth = defs.length === 1;
        const rowDefs = defs.map(def => ({
          ...def,
          x: fullWidth ? outerMargin : (def.column === 'left' ? outerMargin : (outerMargin + dualZoneWidth + zoneGap)),
          w: fullWidth ? contentWidth : dualZoneWidth
        }));
        const rowH = Math.max(...rowDefs.map(def => zoneHeight(def, byZone.get(def.id))));
        rowDefs.forEach(def => {
          activeZones.push({
            ...def,
            y,
            h: rowH
          });
        });
        y += rowH + 22;
      });

      activeZones.forEach(zone => {
        const list = byZone.get(zone.id) || [];
        const sections = clusterSections(list);
        const rows = sectionRows(zone, sections);
        let cursorY = zone.y + layoutCfg.headerH;
        zone.sections = [];
        rows.forEach(row => {
          const totalW = zone.w - 24;
          const sectionCount = row.sections.length;
          const sectionW = sectionCount <= 1
            ? totalW
            : Math.floor((totalW - layoutCfg.clusterGap * (sectionCount - 1)) / sectionCount);
          const rowH = Math.max(...row.sections.map(section => clusterHeight(section, sectionW)));
          row.sections.forEach((section, idx) => {
            const sectionH = clusterHeight(section, sectionW);
            const sectionBox = {
              ...section,
              x: zone.x + 12 + idx * (sectionW + layoutCfg.clusterGap),
              y: cursorY,
              w: sectionW,
              h: sectionH
            };
            zone.sections.push(sectionBox);
            const innerW = sectionBox.w - layoutCfg.clusterPadX * 2;
            const cols = columnsFor(innerW);
            let nodeY = sectionBox.y + layoutCfg.clusterLabelH;
            roleOrder.filter(role => section.nodes.some(node => node.role === role)).forEach(role => {
              const roleNodes = section.nodes.filter(node => node.role === role).sort((a, b) => String(a.label).localeCompare(String(b.label), 'zh-CN'));
              const rowsCount = Math.ceil(roleNodes.length / cols);
              for (let rowIdx = 0; rowIdx < rowsCount; rowIdx++) {
                const rowNodes = roleNodes.slice(rowIdx * cols, rowIdx * cols + cols);
                const rowW = rowNodes.length * layoutCfg.cardW + Math.max(0, rowNodes.length - 1) * layoutCfg.colGap;
                const startX = sectionBox.x + Math.max(layoutCfg.clusterPadX, (sectionBox.w - rowW) / 2);
                rowNodes.forEach((node, nodeIdx) => {
                  node.w = layoutCfg.cardW;
                  node.h = layoutCfg.cardH;
                  node.x = startX + nodeIdx * (layoutCfg.cardW + layoutCfg.colGap);
                  node.y = nodeY;
                  node.cx = node.x + layoutCfg.cardW / 2;
                  node.cy = node.y + layoutCfg.cardH / 2;
                  node.iconCx = node.x + layoutCfg.cardW / 2;
                  node.iconCy = node.y + 38;
                  node.sectionVisual = section.visual || 'group';
                });
                nodeY += layoutCfg.cardH + layoutCfg.rowGap;
              }
              nodeY += layoutCfg.roleGap - layoutCfg.rowGap;
            });
          });
          cursorY += rowH + layoutCfg.clusterGap;
        });
      });
    }

    function colorBySpeed(speed, down) {
      if (down) return '#ef4444';
      if (speed >= 400) return '#06b6d4';
      if (speed >= 200) return '#22c55e';
      if (speed >= 100) return '#fb923c';
      if (speed >= 25) return '#8b5cf6';
      if (speed >= 10) return '#64748b';
      return '#94a3b8';
    }

      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs || {}).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function truncate(text, max) {
      const s = String(text || '');
      return s.length > max ? s.slice(0, max - 1) + '...' : s;
    }
