async function loadTopology() {
    try {
        await loadLinkInfo();
        // 加载连线覆盖配置（优先后端，可回退静态），并缓存到全局
        try {
            let res = await fetch('/api/config/link_overrides').catch(()=>null);
            if (!(res && res.ok)) { res = await fetch('config/link_overrides.json').catch(()=>null); }
            const lo = res && res.ok ? await res.json() : DEFAULTS.linkOverrides;
            const status = (lo && typeof lo === 'object' && lo.status && typeof lo.status === 'object') ? lo.status : {};
            window.__LINK_OVERRIDES = { version: (lo && lo.version) || 1, whitelist: (lo && lo.whitelist) || [], blacklist: (lo && lo.blacklist) || [], status };
        } catch (e) {
            window.__LINK_OVERRIDES = { version: 1, whitelist: [], blacklist: [], status: {} };
        }
        // 刷新最新图标/类型配置，保证拓扑图标随配置更新
        try {
            const cfgAll = await loadConfigs();
            applyTopologyConfig(cfgAll.topology);
        } catch (e) { /* 忽略配置刷新错误 */ }

        // 读取组规则（用于隐藏成员并添加组图标）
        async function loadGroupRules() {
            if (groupRulesCache) return groupRulesCache;
            // 优先读取后端 API；失败则回退到静态文件 /config/group_rules.json
            try {
                const r = await fetch('/api/config/group_rules?t=' + Date.now(), { cache: 'no-store' });
                if (r && r.ok) {
                    const json = await r.json();
                    groupRulesCache = json || { groups: [] };
                    return groupRulesCache;
                }
            } catch (e) { /* ignore */ }
            try {
                const rs = await fetch('/config/group_rules.json?t=' + Date.now(), { cache: 'no-store' });
                if (rs && rs.ok) {
                    const js = await rs.json();
                    groupRulesCache = js || { groups: [] };
                    return groupRulesCache;
                }
            } catch (e) { /* ignore */ }
            groupRulesCache = { groups: [] };
            return groupRulesCache;
        }
        function matches(group, id, name) {
            try {
                const inIds = (group.include_ids || []).includes(id);
                const inRe = (group.include_regex || []).some(rx => new RegExp(rx).test(id) || new RegExp(rx).test(name || ''));
                const exIds = (group.exclude_ids || []).includes(id);
                const exRe = (group.exclude_regex || []).some(rx => new RegExp(rx).test(id) || new RegExp(rx).test(name || ''));
                return (inIds || inRe) && !(exIds || exRe);
            } catch (e) { return false; }
        }

        // 优先使用后端提供的 topology.json（包含设备详细数据）
        let data;
        try {
            const topoRes = await fetch('topology.json?t=' + Date.now(), { cache: 'no-store' });
            data = await topoRes.json();
        } catch (e) {
            data = null;
        }
        // 若 topology.json 不可用，回退到 devices.json（仅节点，便于兜底展示）
        if (!data || !data.nodes) {
            try {
                const devRes = await fetch('/devices.json');
                const devData = await devRes.json();
                if (Array.isArray(devData) && devData.length > 0) {
                    await renderDevicesFallback(devData);
                    return;
                }
            } catch (e) { /* 忽略，回退到固定布局 */ }
        }
        // 最后兜底：使用 topology-debug.json
        if (!data || !data.nodes) {
            try {
                const res = await fetch('topology.json?t=' + Date.now(), { cache: 'no-store' });
                data = await res.json();
            } catch (e) {
                data = null;
            }
        }
        if (!data || !data.nodes) {
            console.error("Topology JSON 数据无效");
            return;
        }

        nodes = (data.nodes || []).filter(d => d && d.id);
        // 记录全局原始节点集合用于设备统计（不受当前视图过滤）
        try {
          window.__ALL_NODES_RAW = nodes.slice();
        } catch (e) { /* ignore */ }
        // 基于配置应用设备可见性初步过滤
        try {
            const devVis = (((window.__TOPO_CFG || {}).visibility || {}).devices) || {};
            nodes = nodes.filter(d => devVis[d.id] !== false);
        } catch (e) { /* ignore */ }
        // 读取已保存的位置配置用于覆盖默认布局（按活动 profile 独立）
        let savedPositions = {};
        const activeProfile = getActiveProfileName(window.__TOPO_CFG || DEFAULTS.topology);
        try {
            let posRes = await fetch('/api/config/positions').catch(()=>null);
            if (!(posRes && posRes.ok)) { posRes = await fetch('/config/positions.json').catch(()=>null); }
            if (posRes && posRes.ok) {
                const posJson = await posRes.json();
                if (activeProfile === 'main') {
                  savedPositions = (posJson && posJson.nodes) ? posJson.nodes : {};
                } else {
                  const profNodes = (posJson && posJson.profiles && posJson.profiles[activeProfile] && posJson.profiles[activeProfile].nodes) || null;
                  savedPositions = profNodes || ((posJson && posJson.nodes) || {});
                }
            }
        } catch (e) { savedPositions = {}; }
        // 本地缓存回退：当服务不可用或静态文件缺失时使用 localStorage
        if (!savedPositions || Object.keys(savedPositions).length === 0) {
            try {
                const ls = localStorage.getItem(`positions_local_cache_${activeProfile}`);
                if (ls) {
                    const parsed = JSON.parse(ls);
                    const nodesMap = (parsed && parsed.nodes) || {};
                    if (nodesMap && Object.keys(nodesMap).length > 0) savedPositions = nodesMap;
                }
            } catch (e) { /* ignore */ }
        }
        nodeMap = new Map(nodes.map(d => [d.id, d]));
        // 计算组成员与需要隐藏的设备
        const gr = await loadGroupRules();
        let ruleGroups = (gr && gr.groups) ? gr.groups.slice() : [];
        // 可选自动识别组：默认关闭，仅当 features.auto_groups.enabled=true 时启用
        try {
            const cfgAuto = window.__TOPO_CFG || DEFAULTS.topology || {};
            const enableAutoGroups = !!(cfgAuto.features && cfgAuto.features.auto_groups && cfgAuto.features.auto_groups.enabled);
            if (enableAutoGroups) {
                const idPattern = /Group(\d+)_pod(\d+)-leaf\d+/;
                const seenCombos = new Set();
                (data.nodes || []).forEach(nd => {
                    const m = idPattern.exec(String(nd.id || ''));
                    if (m) {
                        const combo = `Group${m[1]}_pod${m[2]}`;
                        seenCombos.add(combo);
                    }
                });
                const existingIds = new Set((ruleGroups || []).map(g => String(g.id || '')));
                seenCombos.forEach(combo => {
                    const gid = `Leaf-${combo}`;
                    // 若已存在包含该组合的组则跳过
                    if ([...existingIds].some(eid => eid.includes(combo))) return;
                    ruleGroups.push({
                        id: gid,
                        name: gid,
                        icon_url: '',
                        include_ids: [],
                        include_regex: [`.*${combo}-leaf\\d+$`],
                        exclude_ids: [],
                        exclude_regex: [],
                        style_override: { forcedStatus: null, color: null, icon_url: null }
                    });
                });
            }
        } catch (e) { /* 忽略自动组规则补充错误 */ }
        groupMembersById = {};
        const hiddenIds = new Set();
        nodes.forEach(d => {
            const id = d.id;
            const name = d.label || d.name || id;
            const gMatched = ruleGroups.find(g => matches(g, id, name));
            if (gMatched) {
                const gid = gMatched.id;
                // 组可见性：默认显示，显式为 false 则隐藏该组成员（且不加入组）
                try {
                    const groupsVis = (window.__TOPO_CFG && window.__TOPO_CFG.visibility && window.__TOPO_CFG.visibility.groups) || {};
                    const groupVisible = (groupsVis[gid] === undefined ? true : !!groupsVis[gid]);
                    if (!groupVisible) { hiddenIds.add(id); return; }
                } catch (e) { /* ignore */ }
                if (!groupMembersById[gid]) groupMembersById[gid] = [];
                groupMembersById[gid].push({ id, label: name });
                hiddenIds.add(id);
            }
        });
        // 基于 links.json 自动连线（设备在组内则连到对应组图标）
        // 构造设备→组的快速映射
        const memberToGroupId = new Map();
        Object.entries(groupMembersById || {}).forEach(([gid, arr]) => {
            (arr || []).forEach(m => { memberToGroupId.set(m.id, 'group:' + gid); });
        });
        const agg = new Map(); // undirectedKey -> {from,to}
        linkMap.forEach((arr, key) => {
            (arr || []).forEach(rec => {
                const efFrom = memberToGroupId.get(rec.source) || rec.source;
                const efTo = memberToGroupId.get(rec.target) || rec.target;
                if (efFrom === efTo) return; // 跳过自环
                const k = makeUndirectedKey(efFrom, efTo);
                if (!agg.has(k)) agg.set(k, { from: efFrom, to: efTo });
            });
        });
        edges = Array.from(agg.values());

        // 手动添加核心交换1与核心交换2之间的链路
        const core1Id = 'NXBHZY_102_7-B-05-46U_25Gnei_AGG01';
        const core2Id = 'NXBHZY_102_-7-B-07-46U_25Gnei_AGG02';
        if (nodeMap.has(core1Id) && nodeMap.has(core2Id)) {
            const core1 = nodeMap.get(core1Id);
            const core2 = nodeMap.get(core2Id);
            const maxTx = Math.max(core1.transmit || 0, core2.transmit || 0);
            const maxRx = Math.max(core1.receive || 0, core2.receive || 0);
            const util = calcUtil(maxTx, maxRx, 1);
            edges.push({
                from: core1Id,
                to: core2Id,
                label: '',
                transmit: maxTx,
                receive: maxRx,
                status: core1.status === 0 && core2.status === 0 ? 0 : 1,
                transmit_percent: util,
                receive_percent: util
            });
        }

        // 每台接入交换机分别双上联到两台核心交换机
        const accessIds = [
            'NXBHZY_102_-7-B-09/10-42U_25Gnei_ACC01',
            'NXBHZY_102_-7-B-09/10-30U_25Gnei_ACC02',
            'NXBHZY_103_1B-09/10-34U_25Gnei_ACC03'
        ];

        accessIds.forEach(accId => {
            if (!nodeMap.has(accId)) return;
            const accNode = nodeMap.get(accId);
            [core1Id, core2Id].forEach(coreId => {
                if (!nodeMap.has(coreId)) return;
                    const coreNode = nodeMap.get(coreId);
                    const maxTx = Math.max(accNode.transmit || 0, coreNode.transmit || 0);
                    const maxRx = Math.max(accNode.receive || 0, coreNode.receive || 0);
                    const util = calcUtil(maxTx, maxRx, 1);
                    edges.push({
                        from: accId,
                        to: coreId,
                        label: '',
                        transmit: maxTx,
                        receive: maxRx,
                        status: accNode.status === 0 && coreNode.status === 0 ? 0 : 1,
                        transmit_percent: util,
                        receive_percent: util
                    });
            });
        });

        // === 新增：带外-网络设备分别与 带外-交换1、带外-交换2 互联 ===
        const oob1Id = 'NXBHZY_102_-7-B-10-36U_PCOOB_ACC2'; // 带外-交换1
        const oob2Id = 'NXBHZY_103_1B-08_PCOOB_ACC3';       // 带外-交换2
        const oobDevId = 'NXBHZY_102_-7-B-09-36U_SW00B_ACC1'; // 带外-网络设备

        // 带外-网络设备 ↔ 带外-交换1
        if (nodeMap.has(oobDevId) && nodeMap.has(oob1Id)) {
            const dev = nodeMap.get(oobDevId);
            const oob1 = nodeMap.get(oob1Id);
            const maxTx = Math.max(dev.transmit || 0, oob1.transmit || 0);
            const maxRx = Math.max(dev.receive || 0, oob1.receive || 0);
            const util = calcUtil(maxTx, maxRx, 1);
            edges.push({
                from: oobDevId,
                to: oob1Id,
                label: '',
                transmit: maxTx,
                receive: maxRx,
                status: dev.status === 0 && oob1.status === 0 ? 0 : 1,
                transmit_percent: util,
                receive_percent: util
            });
        }

        // 带外-网络设备 ↔ 带外-交换2
        if (nodeMap.has(oobDevId) && nodeMap.has(oob2Id)) {
            const dev = nodeMap.get(oobDevId);
            const oob2 = nodeMap.get(oob2Id);
            const maxTx = Math.max(dev.transmit || 0, oob2.transmit || 0);
            const maxRx = Math.max(dev.receive || 0, oob2.receive || 0);
            const util = calcUtil(maxTx, maxRx, 1);
            edges.push({
                from: oobDevId,
                to: oob2Id,
                label: '',
                transmit: maxTx,
                receive: maxRx,
                status: dev.status === 0 && oob2.status === 0 ? 0 : 1,
                transmit_percent: util,
                receive_percent: util
            });
        }

        // 已移除：防火墙主节点与其固定连线的硬编码添加
        // 已移除：防火墙备节点的硬编码添加


        const visNodes = [];
        const addedIds = new Set();
        const plannedPos = {};

        // 按分组布局节点
        Object.entries(groups).forEach(([key, grp]) => {
            const count = grp.ids.length;
            const startX = -(count - 1) * 300 / 2;
            grp.ids.forEach((id, idx) => {
                const d = nodeMap.get(id);
                if (!d || addedIds.has(d.id)) return;
                // 二次设备可见性过滤：即使早期未过滤，也在此跳过
                try {
                    const devVis2 = (((window.__TOPO_CFG || {}).visibility || {}).devices) || {};
                    if (devVis2[id] === false) return;
                } catch (e) { /* ignore */ }
                // 显示名称优先使用 topology_config.aliases，其次使用静态分组别名
                const cfgAliases = ((window.__TOPO_CFG || DEFAULTS.topology || {}).aliases) || {};
                const alias = cfgAliases[id] || grp.alias[id];
                const posX = startX + idx * 300;
                const posY = grp.y;
                plannedPos[id] = { x: posX, y: posY };
                if (hiddenIds.has(id)) return;
                addedIds.add(d.id);
                const saved = savedPositions[d.id] || null;
                visNodes.push({
                    id: d.id,
                    label: (alias || (d.label && String(d.label).trim()) || d.id),
                    shape: 'image',
                    image: getNodeIconWithInterPort(d),
                    size: 40,
                    x: saved && typeof saved.x === 'number' ? saved.x : posX,
                    y: saved && typeof saved.y === 'number' ? saved.y : posY,
                    fixed: { x: false, y: false },
                    status: d.status,
                    ip: d.ip || '',
                    transmit: d.transmit || 0,
                    receive: d.receive || 0,
                    transmit_percent: d.transmit_percent || 0,
                    receive_percent: d.receive_percent || 0,
                    ports: d.ports || [],
                    font: {
                        color: '#ffffff',
                        size: 14,
                        bold: true,
                        strokeWidth: 3,
                        strokeColor: '#0a1120',
                        vadjust: LABEL_VADJUST
                    }
                });
            });
        });

        // 自动摆放未分组节点：保持原样式的同时，确保 topology.json 中的设备可见且可点击
        // 过滤已添加节点，同时排除防火墙主/备，避免重复ID
        const otherNodes = nodes.filter(d => d && d.id && !addedIds.has(d.id) && !hiddenIds.has(d.id));
        if (otherNodes.length > 0) {
            const cols = 6; // 每行最多显示 6 个
            const cellX = 220; // 水平间距
            const startX = -(Math.min(cols, otherNodes.length) - 1) * cellX / 2;
            const baseY = 220; // 放在接入层下方一行
            otherNodes.forEach((d, idx) => {
                const col = idx % cols;
                const row = Math.floor(idx / cols);
                const posX = startX + col * cellX;
                const posY = baseY + row * 140;
                plannedPos[d.id] = { x: posX, y: posY };
                const saved = savedPositions[d.id] || null;
                const cfgAliases = ((window.__TOPO_CFG || DEFAULTS.topology || {}).aliases) || {};
                const alias = cfgAliases[d.id] || null;
                visNodes.push({
                    id: d.id,
                    label: (alias || (d.label && String(d.label).trim()) || d.id),
                    shape: 'image',
                    image: getNodeIconWithInterPort(d),
                    size: 36,
                    x: saved && typeof saved.x === 'number' ? saved.x : posX,
                    y: saved && typeof saved.y === 'number' ? saved.y : posY,
                    fixed: { x: false, y: false },
                    status: d.status,
                    ip: d.ip || '',
                    transmit: d.transmit || 0,
                    receive: d.receive || 0,
                    transmit_percent: d.transmit_percent || 0,
                    receive_percent: d.receive_percent || 0,
                    ports: d.ports || [],
                    font: {
                        color: '#ffffff',
                        size: 14,
                        bold: true,
                        strokeWidth: 3,
                        strokeColor: '#0a1120',
                        vadjust: LABEL_VADJUST
                    }
                });
            });
        }

        // 添加组图标节点：使用组规则，隐藏成员并在成员中心放置组节点
        (ruleGroups || []).forEach((g, idx) => {
            // 组可见性过滤：若组被配置为隐藏，则不渲染该组图标节点
            try {
                const gVis = (((window.__TOPO_CFG || {}).visibility || {}).groups) || {};
                if (gVis[g.id] === false) return;
            } catch (e) { /* ignore */ }
            const members = groupMembersById[g.id] || [];
            if (!members.length) return;
            let sumX = 0, sumY = 0, cnt = 0;
            members.forEach(m => {
                const p = plannedPos[m.id];
                if (p && typeof p.x === 'number' && typeof p.y === 'number') {
                    sumX += p.x; sumY += p.y; cnt++;
                }
            });
            const posX = cnt ? (sumX / cnt) : (-(ruleGroups.length - 1) * 240 / 2 + idx * 240);
            const posY = cnt ? (sumY / cnt) : 0;
            const cfg = window.__TOPO_CFG || DEFAULTS.topology || {};
            const icons = (cfg.default_icons || {});
            const anyDown = members.some(m => {
                const md = nodeMap.get(m.id);
                return md ? (md.status !== 0 || hasDownInterPort(md)) : false;
            });
            const iconCandidate = (g.style_override && g.style_override.icon_url) || g.icon_url || '';
            const defaultIcon = anyDown ? (icons.group_bad || icons.group || icons.device_bad || 'icons/sigle-sw-bad.png') : (icons.group || icons.device || 'icons/sigle-sw.png');
            const img = resolveIconUrl(iconCandidate || defaultIcon);
            const savedGroup = savedPositions['group:' + g.id] || null;
            visNodes.push({
                id: 'group:' + g.id,
                label: (function(){
                    const a = ((window.__TOPO_CFG||DEFAULTS.topology||{}).aliases)||{};
                    return a['group:'+g.id] || a[g.id] || (g.style_override && g.style_override.alias) || g.alias || g.name || g.id;
                })(),
                shape: 'image',
                image: img,
                size: 44,
                x: savedGroup && typeof savedGroup.x === 'number' ? savedGroup.x : posX,
                y: savedGroup && typeof savedGroup.y === 'number' ? savedGroup.y : posY,
                fixed: { x: false, y: false },
                members: members,
                font: { color: '#ffffff', size: 14, bold: true, strokeWidth: 3, strokeColor: '#0a1120', vadjust: LABEL_VADJUST }
            });
        });

        // --- 渲染连线 ---
        // 仅保留双方端点都在可见集合中的连线
        const visibleSet = new Set(visNodes.map(n => n.id));
        const edgesFiltered = edges.filter(d => visibleSet.has(d.from) && visibleSet.has(d.to));
        const visEdges = edgesFiltered.map(d => ({
            id: `${d.from}-${d.to}`,
            from: d.from,
            to: d.to,
            width: 3,
            color: {
                color: getLinkColorWithInterPort(d, nodeMap),
                highlight: '#ffffff'
            },
            smooth: false,
            transmit: 0,
            receive: 0,
            status: 0
        }));

        // （已移除）专线虚线连接

        // 已移除：防火墙主/备的固定布局调整

        // --- 渲染拓扑 ---
        const container = document.getElementById('topo-canvas');
        networkData = {
            nodes: new vis.DataSet(visNodes),
            edges: new vis.DataSet(visEdges)
        };

        const topoCfg = window.__TOPO_CFG || DEFAULTS.topology || {};
        const options = {
            physics: { enabled: false },
            layout: { improvedLayout: false },
            interaction: { hover: true, selectConnectedEdges: false, dragNodes: true, dragView: false },
            nodes: {
                borderWidth: 0,
                borderWidthSelected: 0,
                chosen: false,
                color: {
                    border: 'rgba(0,0,0,0)',
                    background: 'rgba(0,0,0,0)',
                    highlight: { border: 'rgba(0,0,0,0)', background: 'rgba(0,0,0,0)' },
                    hover: { border: 'rgba(0,0,0,0)', background: 'rgba(0,0,0,0)' }
                }
            },
            edges: {
                smooth: false,
                chosen: { edge: false },
                selectionWidth: 14,
                hoverWidth: (topoCfg.edgeHover && topoCfg.edgeHover.enabled) ? (topoCfg.edgeHover.hoverWidth || 4) : 2
            }
        };

        network = new vis.Network(container, networkData, options);
        // 暴露到全局，便于调试或后续扩展使用
        window.network = network;
        window.networkData = networkData;
        // 记录初始视图（用于一键重置）
        initialView = {
            position: network.getViewPosition(),
            scale: network.getScale()
        };
        // 刷新后强制应用已保存位置（覆盖规划位置）
        try {
            let pr = await fetch('/api/config/positions').catch(()=>null);
            if (!(pr && pr.ok)) { pr = await fetch('/config/positions.json').catch(()=>null); }
            const pj = pr && pr.ok ? await pr.json() : null;
            const activeName = getActiveProfileName(window.__TOPO_CFG || DEFAULTS.topology);
            let map = {};
            if (activeName === 'main') {
              map = (pj && pj.nodes) || {};
            } else {
              const profNodes = (pj && pj.profiles && pj.profiles[activeName] && pj.profiles[activeName].nodes) || null;
              map = profNodes || ((pj && pj.nodes) || {});
            }
            // 本地缓存回退
            if (!map || Object.keys(map).length === 0) {
                try {
                    const ls = localStorage.getItem(`positions_local_cache_${activeName}`);
                    if (ls) {
                        const parsed = JSON.parse(ls);
                        const nodesMap = (parsed && parsed.nodes) || {};
                        if (nodesMap && Object.keys(nodesMap).length > 0) map = nodesMap;
                    }
                } catch (e) { /* ignore */ }
            }
            Object.keys(map).forEach(id => { const p = map[id]; if (p && typeof p.x === 'number' && typeof p.y === 'number') { try { network.moveNode(id, p.x, p.y); } catch(e){} } });
        } catch (e) { /* ignore */ }

        // 响应式处理：看全但不过度压缩；小屏缩放节点尺寸/字体并允许拖动画布
        try {
            const cfg = topoCfg.responsive || DEFAULTS.topology.responsive;
            const rect = container.getBoundingClientRect();
            const isSmall = rect && rect.width && (rect.width < (cfg.small_screen_threshold || 1280));
            if (isSmall && cfg.enable_dragView_on_small) {
                network.setOptions({ interaction: { dragView: true } });
            }
            if (isSmall) {
                const nodeScale = cfg.node_scale_small || 0.85;
                const fontScale = cfg.font_scale_small || 0.9;
                const updates = [];
                (networkData.nodes.get() || []).forEach(n => {
                    const newSize = typeof n.size === 'number' ? Math.max(10, Math.round(n.size * nodeScale)) : undefined;
                    const newFontSize = (n.font && typeof n.font.size === 'number') ? Math.max(10, Math.round(n.font.size * fontScale)) : undefined;
                    if (newSize || newFontSize) {
                        const upd = { id: n.id };
                        if (newSize) upd.size = newSize;
                        if (newFontSize) upd.font = Object.assign({}, n.font, { size: newFontSize });
                        updates.push(upd);
                    }
                });
                if (updates.length) networkData.nodes.update(updates);
            }
            if (cfg.auto_fit_on_load && cfg.mode === 'contain') {
                // 先尝试看全
                network.fit({ animation: { duration: 300, easing: 'easeInOutQuad' } });
                const sc = network.getScale();
                // 若过度缩小，则保留原布局视图
                if (typeof sc === 'number' && sc < (cfg.min_scale || 0.6)) {
                    network.moveTo({ position: initialView.position, scale: initialView.scale, animation: { duration: 200 } });
                }
            }
        } catch (e) { /* ignore */ }

        // LOD（按缩放比动态减负）
        try {
            const perf = (topoCfg.performance && topoCfg.performance.lod) || DEFAULTS.topology.performance.lod;
            const state = (window.__LOD_STATE = { labelsHidden: false, membersHidden: false, hoverDisabled: false, edgesThinned: false, blinkDisabled: false });
            const labelBackup = (window.__LABEL_BACKUP = new Map());
            const hiddenMembers = (window.__HIDDEN_MEMBER_IDS = new Set());
            window.__BLINK_ENABLED = true;

            // 始终隐藏组成员：一旦归组，成员在任何缩放下都不单独显示
            const ALWAYS_HIDE_GROUP_MEMBERS = true;
            function applyLOD(scale) {
                const hideLabelsTh = (typeof perf.hide_labels_below === 'number') ? perf.hide_labels_below : 0.7;
                const hideMembersTh = (typeof perf.hide_group_members_below === 'number') ? perf.hide_group_members_below : 0.7;
                const thinEdgesTh = (typeof perf.thin_edges_below === 'number') ? perf.thin_edges_below : 0.8;
                const disableHoverTh = (typeof perf.disable_hover_below === 'number') ? perf.disable_hover_below : 0.75;
                const disableBlinkTh = (typeof perf.disable_blink_below === 'number') ? perf.disable_blink_below : 0.65;

                // 1) 标签隐藏/恢复（非组节点）
                if (scale < hideLabelsTh && !state.labelsHidden) {
                    const upd = [];
                    (networkData.nodes.get() || []).forEach(n => {
                        if (!String(n.id).startsWith('group:') && n.label) {
                            labelBackup.set(n.id, n.label);
                            upd.push({ id: n.id, label: '' });
                        }
                    });
                    if (upd.length) networkData.nodes.update(upd);
                    state.labelsHidden = true;
                } else if (scale >= hideLabelsTh && state.labelsHidden) {
                    const upd = [];
                    labelBackup.forEach((label, id) => { upd.push({ id, label }); });
                    if (upd.length) networkData.nodes.update(upd);
                    labelBackup.clear();
                    state.labelsHidden = false;
                }

                // 2) 隐藏/恢复组成员及其相关边
                if ((ALWAYS_HIDE_GROUP_MEMBERS || scale < hideMembersTh) && !state.membersHidden) {
                    const toHide = new Set();
                    Object.entries(groupMembersById || {}).forEach(([gid, arr]) => {
                        (arr || []).forEach(m => {
                            // 仅对已存在于数据集的节点进行隐藏，避免无属性空节点被添加
                            const exists = networkData.nodes.get(m.id);
                            if (exists) { toHide.add(m.id); hiddenMembers.add(m.id); }
                        });
                    });
                    const nodeUpd = [];
                    toHide.forEach(id => nodeUpd.push({ id, hidden: true }));
                    if (nodeUpd.length) networkData.nodes.update(nodeUpd);
                    const edgeUpd = [];
                    (networkData.edges.get() || []).forEach(e => {
                        if (toHide.has(e.from) || toHide.has(e.to)) edgeUpd.push({ id: e.id || `${e.from}-${e.to}`, hidden: true });
                    });
                    if (edgeUpd.length) networkData.edges.update(edgeUpd);
                    state.membersHidden = true;
                } else if (!ALWAYS_HIDE_GROUP_MEMBERS && scale >= hideMembersTh && state.membersHidden) {
                    // 仅在允许恢复时恢复此前隐藏的成员
                    const nodeUpd = [];
                    hiddenMembers.forEach(id => nodeUpd.push({ id, hidden: false }));
                    if (nodeUpd.length) networkData.nodes.update(nodeUpd);
                    const edgeUpd = [];
                    (networkData.edges.get() || []).forEach(e => {
                        if (hiddenMembers.has(e.from) || hiddenMembers.has(e.to)) edgeUpd.push({ id: e.id || `${e.from}-${e.to}`, hidden: false });
                    });
                    if (edgeUpd.length) networkData.edges.update(edgeUpd);
                    hiddenMembers.clear();
                    state.membersHidden = false;
                }

                // 3) 边变细/恢复
                if (scale < thinEdgesTh && !state.edgesThinned) {
                    const upd = (networkData.edges.get() || []).map(e => ({ id: e.id || `${e.from}-${e.to}`, width: 1 }));
                    if (upd.length) networkData.edges.update(upd);
                    state.edgesThinned = true;
                } else if (scale >= thinEdgesTh && state.edgesThinned) {
                    const upd = (networkData.edges.get() || []).map(e => ({ id: e.id || `${e.from}-${e.to}`, width: 3 }));
                    if (upd.length) networkData.edges.update(upd);
                    state.edgesThinned = false;
                }

                // 4) hover 关闭/恢复
                if (scale < disableHoverTh && !state.hoverDisabled) {
                    network.setOptions({ interaction: { hover: false } });
                    state.hoverDisabled = true;
                } else if (scale >= disableHoverTh && state.hoverDisabled) {
                    network.setOptions({ interaction: { hover: true } });
                    state.hoverDisabled = false;
                }

                // 5) 闪烁暂停/恢复
                const wantDisableBlink = scale < disableBlinkTh;
                window.__BLINK_ENABLED = !wantDisableBlink;
                if (!window.__BLINK_ENABLED) {
                    // 立刻恢复到非闪烁状态
                    try {
                        const updates = [];
                        (networkData.nodes.get() || []).forEach(n => {
                            if (!String(n.id).startsWith('group:')) updates.push({ id: n.id, opacity: 1 });
                        });
                        if (updates.length) networkData.nodes.update(updates);
                        updateDownEffects();
                    } catch (e) { /* ignore */ }
                } else {
                    // 切回闪烁时立即应用一次更新
                    try { updateDownEffects(); } catch (e) { /* ignore */ }
                }
                state.blinkDisabled = wantDisableBlink;
            }

            let zoomTimer;
            network.on('zoom', function(params) {
                clearTimeout(zoomTimer);
                zoomTimer = setTimeout(() => applyLOD(params.scale), 120);
            });
            // 初始应用一次
            applyLOD(network.getScale());
        } catch (e) { /* ignore */ }

        // edgeHasDownInterPort 已提升为全局函数，供多处调用

        // 处理设备DOWN状态和连线闪烁效果（颜色浅深与透明度交替）
        function updateDownEffects() {
            if (!nodes || !networkData) return;
            // 更新连线闪烁效果：只要该边的任一互联端口为DOWN，则红色闪烁
            visEdges.forEach(edge => {
                const isSpecialGroupDown = edge.lineGroup && specialLineDownMap && specialLineDownMap[edge.lineGroup];
                const down = isSpecialGroupDown ? true : edgeHasDownInterPort(edge, nodeMap);
                if (down) {
                    edge.color = { color: blink ? '#ff0000' : '#ff6666', highlight: '#ffffff' };
                } else {
                    // 恢复正常颜色（含防火墙特殊逻辑与利用率着色）
                    const normalColor = edge.lineGroup ? '#00e5ff' : getLinkColorWithInterPort(edge, nodeMap);
                    edge.color = { color: normalColor, highlight: '#ffffff' };
                }
            });
            networkData.edges.update(visEdges);
        }

        // 暴露更新函数用于外部触发
        window.updateDownEffects = updateDownEffects;

        // 初始化与优化闪烁更新：仅对状态为 DOWN 的节点与变化的边更新
        let blink = true;
        let prevDownEdgeIds = new Set();
        let downNodeIds = new Set();
        function recomputeDownNodeIds() {
            try {
                downNodeIds = new Set((nodes || []).filter(n => (n.status !== 0) || hasDownInterPort(n)).map(n => n.id));
            } catch (e) {}
        }
        // 首次计算
        recomputeDownNodeIds();
        // 边闪烁仅更新发生状态变化的边
        function updateDownEffects() {
            if (!nodes || !networkData) return;
            const updates = [];
            const newDown = new Set();
            visEdges.forEach(edge => {
                const isSpecialGroupDown = edge.lineGroup && specialLineDownMap && specialLineDownMap[edge.lineGroup];
                const down = isSpecialGroupDown ? true : edgeHasDownInterPort(edge, nodeMap);
                if (down) newDown.add(edge.id || `${edge.from}-${edge.to}`);
                const edgeId = edge.id || `${edge.from}-${edge.to}`;
                const wasDown = prevDownEdgeIds.has(edgeId);
                if (down !== wasDown) {
                    const color = down ? (blink ? '#ff0000' : '#ff6666') : (edge.lineGroup ? '#00e5ff' : getLinkColorWithInterPort(edge, nodeMap));
                    updates.push({ id: edgeId, color: { color, highlight: '#ffffff' } });
                }
            });
            if (updates.length) networkData.edges.update(updates);
            prevDownEdgeIds = newDown;
        }
    // 边闪烁定时器（降频到 900ms）
    updateDownEffects();
    setInterval(() => { if (window.__BLINK_ENABLED !== false) { blink = !blink; updateDownEffects(); } }, 900);
        // 节点透明度闪烁（仅对 downNodeIds；降频到 1500ms）
    setInterval(() => {
        try {
            if (window.__BLINK_ENABLED !== false) {
                const updates = [];
                downNodeIds.forEach(id => {
                    const node = networkData.nodes.get(id);
                    if (node) updates.push({ id, opacity: blink ? 1 : 0.4 });
                });
                if (updates.length) networkData.nodes.update(updates);
            }
                // 组图标闪烁与变红（按成员状态与互联端口DOWN）：更新有限数量的组节点
                const allIds = networkData.nodes.getIds();
                const groupsToCheck = allIds.filter(id => String(id).startsWith('group:'));
                const cfg = window.__TOPO_CFG || DEFAULTS.topology || {};
                const icons = (cfg.default_icons || {});
                const groupUpdates = [];
                groupsToCheck.forEach(gidFull => {
                    const gid = String(gidFull).slice(6);
                    const members = (groupMembersById && groupMembersById[gid]) ? groupMembersById[gid] : [];
                    const anyDown = members.some(m => {
                        const md = nodeMap.get(m.id);
                        if (!md) return false;
                        const portDown = hasDownInterPort(md);
                        return (md.status !== 0) || portDown;
                    }) || visEdges.some(e => (e.from === gidFull || e.to === gidFull) && edgeHasDownInterPort(e, nodeMap));
                    const img = anyDown ? (icons.group_bad || icons.group || icons.device_bad || 'icons/sigle-sw-bad.png') : (icons.group || icons.device || 'icons/sigle-sw.png');
                    groupUpdates.push({ id: gidFull, image: resolveIconUrl(img), opacity: anyDown ? (blink ? 1 : 0.5) : 1 });
                });
                if (groupUpdates.length) networkData.nodes.update(groupUpdates);
            } catch (e) { /* ignore */ }
        }, 1500);

        // 统一点击优先级：空白→概览；编辑模式优先弹窗；否则组→成员列表，节点→设备信息与端口，专线→专线信息，普通链路→链路信息
        network.on('click', function(params) {
            const hasNode = params.nodes && params.nodes.length > 0;
            const hasEdge = params.edges && params.edges.length > 0;

            // 前台编辑模式：优先打开编辑弹窗（组/设备均可编辑）
            if (window.__EDIT_MODE && hasNode) {
                const nodeId = params.nodes[0];
                if (typeof window.openFrontEditor === 'function') {
                    window.openFrontEditor(nodeId);
                    return;
                }
            }

            // 空白区域：显示集群整体信息
            if (!hasNode && !hasEdge) {
                showOverview(nodes);
                return;
            }

            // 节点优先：显示设备整体信息与端口信息；若为组图标则显示成员
            if (hasNode) {
                const nodeId = params.nodes[0];
                if (String(nodeId).startsWith('group:')) {
                    const n = networkData.nodes.get(nodeId);
                    if (n) { showGroupInfo(n); return; }
                }
                // 专线设备为虚拟节点，点击时展示专线信息
                if (nodeId === 'special-line-acc02') {
                    showDeviceSpecialLines('NXBHZY_102_-7-B-09/10-30U_25Gnei_ACC02');
                    return;
                }
                // 优先使用原始节点数据（来自 topology.json）
                const rawNode = nodeMap ? nodeMap.get(nodeId) : null;
                if (rawNode) {
                    showDeviceInfo(rawNode);
                } else {
                    // 兜底使用可视节点数据
                    const visNode = networkData.nodes.get(nodeId);
                    if (visNode) {
                        showDeviceInfo(visNode);
                    } else {
                        showOverview(nodes);
                    }
                }
                return;
            }

            // 专线（低于设备图标优先级）：带有 dashes/lineGroup 的边显示专线信息
            if (hasEdge) {
                const edge = networkData.edges.get(params.edges[0]);
                if (edge && (edge.dashes || edge.lineGroup)) {
                    const lmCfg = getLineMonitorConfig();
                    if (edge.lineGroup === 'acc02' && lmCfg.enabled) {
                        showDeviceSpecialLines('NXBHZY_102_-7-B-09/10-30U_25Gnei_ACC02');
                    } else if (edge) {
                        // 非接入2的虚线已移除；其余按普通链路处理
                        showLinkInfo(edge);
                    }
                } else if (edge) {
                    // 普通链路（优先级最低）：显示链路信息
                    showLinkInfo(edge);
                } else {
                    showOverview(nodes);
                }
            }
        });
        showOverview(nodes);

        // 悬停边突出效果：按状态设置颜色；DOWN 时加粗红色，UP/正常用亮绿
        try {
            const cfgEH = (window.__TOPO_CFG && window.__TOPO_CFG.edgeHover) || DEFAULTS.topology.edgeHover;
            if (cfgEH && cfgEH.enabled) {
                const prevStyles = new Map(); // { id: { color, width } }
                network.on('hoverEdge', function(params) {
                    const id = params.edge;
                    const e = networkData.edges.get(id);
                    if (!e) return;
                    if (!prevStyles.has(id)) prevStyles.set(id, { color: e.color, width: e.width });
                    const isSpecialGroupDown = e.lineGroup && specialLineDownMap && specialLineDownMap[e.lineGroup];
                    const isDown = isSpecialGroupDown ? true : edgeHasDownInterPort(e, nodeMap);
                    if (isDown) {
                        const red = { color: '#ff0000', highlight: '#ffffff' };
                        const boldWidth = ((topoCfg.edgeHover && topoCfg.edgeHover.hoverWidth) ? topoCfg.edgeHover.hoverWidth : 4) + 2;
                        networkData.edges.update({ id, color: red, width: boldWidth });
                    } else {
                        const newColor = { color: cfgEH.hoverColor || '#00ff9d', highlight: '#ffffff' };
                        networkData.edges.update({ id, color: newColor });
                    }
                });
                network.on('blurEdge', function(params) {
                    const id = params.edge;
                    const prev = prevStyles.get(id);
                    if (prev) {
                        networkData.edges.update({ id, color: prev.color, width: prev.width });
                        prevStyles.delete(id);
                    } else {
                        const e = networkData.edges.get(id);
                        if (e) {
                            const raw = { from: e.from, to: e.to, status: e.status, transmit: e.transmit, receive: e.receive };
                            const color = getLinkColorWithInterPort(raw, nodeMap);
                            networkData.edges.update({ id, color: { color, highlight: '#ffffff' } });
                        }
                    }
                });
            }
        } catch (e) { /* ignore */ }

        console.log('拓扑加载完成：节点', visNodes.length, '边', visEdges.length);
    } catch (e) {
        console.error('加载拓扑失败:', e);
    }
}

// 简化版渲染：当存在 devices.json 时，直接将设备以可拖拽节点展示，不加载固定内容
async function renderDevicesFallback(devices) {
    // 确保加载 links.json，以便边点击时能显示链路详情
    try { await loadLinkInfo(); } catch (e) {}
    let posRes = await fetch('/api/config/positions').catch(()=>null);
    if (!(posRes && posRes.ok)) { posRes = await fetch('/config/positions.json').catch(()=>null); }
    const pos = posRes && posRes.ok ? await posRes.json() : {};
    const cfg = window.__TOPO_CFG || DEFAULTS.topology || {};
    // 按类型驱动图标：未配置类型默认“交换机”，使用 device / device_bad

    nodes = [];
    const list = Array.isArray(devices) ? devices : [];
    const activeName = getActiveProfileName(cfg);
    const positions = activeName === 'main'
      ? ((pos && pos.nodes) || {})
      : (((pos && pos.profiles && pos.profiles[activeName] && pos.profiles[activeName].nodes) || null) || ((pos && pos.nodes) || {}));
    list.forEach(d => {
        const id = d.id || d.device_id || d.name || String(d);
        const label = (d.name && String(d.name).trim()) ? d.name : (((cfg.aliases && cfg.aliases[id]) || id));
        const p = positions[id] || {};
        const status = (typeof d.status === 'number' ? d.status : 0);
        const img = getNodeIcon({ id, status });
        const node = {
            id,
            label,
            shape: 'image',
            image: img || resolveIconUrl((DEFAULTS.topology && DEFAULTS.topology.default_icons && DEFAULTS.topology.default_icons.device) || 'icons/sw.png'),
            size: 18,
            x: p.x,
            y: p.y,
            physics: false,
            fixed: { x: false, y: false },
            font: { size: 14 },
            // 设备信息字段（用于侧边栏展示）
            status,
            ip: d.ip || '',
            transmit: d.transmit || 0,
            receive: d.receive || 0,
            transmit_percent: d.transmit_percent || 0,
            receive_percent: d.receive_percent || 0,
            ports: Array.isArray(d.ports) ? d.ports : []
        };
        nodes.push(node);
    });

    const container = document.getElementById('topo-canvas');
    const data = { nodes: new vis.DataSet(nodes), edges: new vis.DataSet([]) };
    const topoCfg = window.__TOPO_CFG || DEFAULTS.topology || {};
    const options = {
        physics: { enabled: false },
        layout: { improvedLayout: false },
        interaction: { hover: true, dragNodes: true, dragView: false },
        nodes: {
            chosen: false,
            borderWidth: 0,
            borderWidthSelected: 0,
            color: {
                border: 'rgba(0,0,0,0)',
                background: 'rgba(0,0,0,0)',
                highlight: { border: 'rgba(0,0,0,0)', background: 'rgba(0,0,0,0)' },
                hover: { border: 'rgba(0,0,0,0)', background: 'rgba(0,0,0,0)' }
            }
        },
        edges: { selectionWidth: 14, hoverWidth: (topoCfg.edgeHover && topoCfg.edgeHover.enabled) ? (topoCfg.edgeHover.hoverWidth || 4) : 2 }
    };
    network = new vis.Network(container, data, options);
    window.network = network;
    initialView = { position: network.getViewPosition(), scale: network.getScale() };

    // 建立 nodeMap 与 networkData 以复用现有点击显示逻辑
    nodeMap = new Map(nodes.map(d => [d.id, d]));
    networkData = data;
    // 重建端口索引与故障节点集合
    try { buildPortIndex(nodes); } catch (e) {}
    if (typeof recomputeDownNodeIds === 'function') {
        try { recomputeDownNodeIds(); } catch (e) {}
    }

    // 点击事件：空白→概览；节点→设备/组信息；边→链路信息
    network.on('click', function(params) {
        const hasNode = params.nodes && params.nodes.length > 0;
        const hasEdge = params.edges && params.edges.length > 0;

        // 编辑模式优先节点弹窗
        if (window.__EDIT_MODE && hasNode) {
            const nodeId = params.nodes[0];
            if (typeof window.openFrontEditor === 'function') {
                window.openFrontEditor(nodeId);
                return;
            }
        }

        // 空白区域
        if (!hasNode && !hasEdge) {
            showOverview(nodes);
            return;
        }

        // 节点点击
        if (hasNode) {
            const nodeId = params.nodes[0];
            if (String(nodeId).startsWith('group:')) {
                const n = networkData.nodes.get(nodeId);
                if (n) { showGroupInfo(n); return; }
            }
            const node = networkData.nodes.get(nodeId);
            if (node) {
                showDeviceInfo(node);
            } else {
                showOverview(nodes);
            }
            return;
        }

        // 边点击（专线优先，其余按普通链路）
        if (hasEdge) {
            const edge = networkData.edges.get(params.edges[0]);
            if (edge && (edge.dashes || edge.lineGroup)) {
                try {
                    const lmCfg = (typeof getLineMonitorConfig === 'function') ? getLineMonitorConfig() : { enabled: false };
                    if (edge.lineGroup === 'acc02' && lmCfg.enabled) {
                        showDeviceSpecialLines('NXBHZY_102_-7-B-09/10-30U_25Gnei_ACC02');
                        return;
                    }
                } catch (e) {}
                if (edge) { showLinkInfo(edge); return; }
            }
            if (edge) {
                showLinkInfo(edge);
                return;
            }
            showOverview(nodes);
        }
    });

    // 初始显示概览
    showOverview(nodes);

    // 小屏响应式：允许拖动画布；节点与字体缩放
    try {
        const cfg = topoCfg.responsive || DEFAULTS.topology.responsive;
        const rect = container.getBoundingClientRect();
        const isSmall = rect && rect.width && (rect.width < (cfg.small_screen_threshold || 1280));
        if (isSmall && cfg.enable_dragView_on_small) {
            network.setOptions({ interaction: { dragView: true } });
        }
        if (isSmall) {
            const nodeScale = cfg.node_scale_small || 0.85;
            const fontScale = cfg.font_scale_small || 0.9;
            const updates = [];
            (networkData.nodes.get() || []).forEach(n => {
                const newSize = typeof n.size === 'number' ? Math.max(10, Math.round(n.size * nodeScale)) : undefined;
                const newFontSize = (n.font && typeof n.font.size === 'number') ? Math.max(10, Math.round(n.font.size * fontScale)) : undefined;
                if (newSize || newFontSize) {
                    const upd = { id: n.id };
                    if (newSize) upd.size = newSize;
                    if (newFontSize) upd.font = Object.assign({}, n.font, { size: newFontSize });
                    updates.push(upd);
                }
            });
            if (updates.length) networkData.nodes.update(updates);
        }
    } catch (e) { /* ignore */ }
}

// 定时任务：监控数据与拓扑数据每6分钟更新
setInterval(async () => {
    // 刷新告警列表
    if (nodes) await renderAlarmList(nodes);
}, 6 * 60 * 1000);

setInterval(() => {
    // 仅在出现故障节点时重建拓扑，否则只更新数据
    try {
        const hasFault = (nodes || []).some(n => (n.status !== 0) || hasDownInterPort(n));
        if (hasFault) {
            loadTopology();
        }
    } catch (e) { /* ignore */ }
}, 6 * 60 * 1000);

// 专线状态轮询（每5秒，按配置启用）：读取 prometheus.json，更新专线组闪烁与告警列表
setInterval(async () => {
    try {
        const lmCfg = getLineMonitorConfig();
        if (!lmCfg.enabled) return;
        await loadLocalPrometheusLines();
        const anyDown = filterLinesByConfig(localPromData.lines || []).some(l => {
            const s = l.status;
            const statusStr = typeof s === 'string' ? s.toLowerCase() : s;
            return statusStr === 'down' || statusStr === 1 || statusStr === '1';
        });
        specialLineDownMap['acc02'] = anyDown;
        if (window.updateDownEffects) {
            window.updateDownEffects();
        }
        // 若概览界面可见，刷新监控告警表
        const alarmList = document.getElementById('alarm-list');
        if (alarmList && nodes) {
            await renderAlarmList(nodes);
        }
    } catch (e) {
        console.warn('专线状态轮询失败:', e);
    }
}, 5000);

        // 每6分钟重新读取并更新数据
        setInterval(async () => {
            try {
                // 重新加载链路信息
                await loadLinkInfo();

                // 重新加载拓扑数据（后端数据为准）
                const res = await fetch('topology.json');
                const data = await res.json();
                if (!data || !data.nodes) {
                    console.error("Topology JSON 数据无效");
                    return;
                }

        // 更新节点数据
        const newNodes = (data.nodes || []).filter(d => d && d.id);
        const newNodeMap = new Map(newNodes.map(d => [d.id, d]));

        // 更新节点状态
        if (networkData && networkData.nodes) {
            newNodes.forEach(node => {
                const existingNode = networkData.nodes.get(node.id);
                if (existingNode) {
                    // 更新节点属性
                    networkData.nodes.update({
                        id: node.id,
                        status: node.status,
                        ip: node.ip || '',
                        transmit: node.transmit || 0,
                        receive: node.receive || 0,
                        transmit_percent: node.transmit_percent || 0,
                        receive_percent: node.receive_percent || 0,
                        ports: node.ports || [],
                        image: getNodeIconWithInterPort(node), // 使用新图标逻辑
                        font: {
                            color: (node.status === 0 && !hasDownInterPort(node)) ? '#ffffff' : '#ff4d4d',
                            size: 14,
                            bold: true,
                            vadjust: LABEL_VADJUST
                        }
                    });
                }
            });
        }

        // 更新边数据
        const newEdges = (data.edges || []).filter(d => d && d.source && d.target)
            .map(d => {
                const srcId = d.source.split(':')[0];
                const tgtId = d.target.split(':')[0];
                if (!newNodeMap.has(srcId) || !newNodeMap.has(tgtId)) return null;
                const sourceNode = newNodeMap.get(srcId);
                const targetNode = newNodeMap.get(tgtId);
                return {
                    from: srcId,
                    to: tgtId,
                    label: d.label,
                    transmit: d.transmit || 0,
                    receive: d.receive || 0,
                    status: sourceNode.status === 0 && targetNode.status === 0 ? 0 : 1,
                    transmit_percent: d.transmit_percent || 0,
                    receive_percent: d.receive_percent || 0
                };
            }).filter(d => d != null);

        // 追加：带外衍生链路（与初始构建逻辑保持一致：网络设备连到交换1和交换2）
        const oob1Id = 'NXBHZY_102_-7-B-10-36U_PCOOB_ACC2';
        const oob2Id = 'NXBHZY_103_1B-08_PCOOB_ACC3';
        const oobDevId = 'NXBHZY_102_-7-B-09-36U_SW00B_ACC1';

        if (newNodeMap.has(oobDevId) && newNodeMap.has(oob1Id)) {
            const dev = newNodeMap.get(oobDevId);
            const oob1 = newNodeMap.get(oob1Id);
            const maxTx = Math.max(dev.transmit || 0, oob1.transmit || 0);
            const maxRx = Math.max(dev.receive || 0, oob1.receive || 0);
            newEdges.push({
                from: oobDevId,
                to: oob1Id,
                label: '',
                transmit: maxTx,
                receive: maxRx,
                status: dev.status === 0 && oob1.status === 0 ? 0 : 1,
                transmit_percent: 0,
                receive_percent: 0
            });
        }

        if (newNodeMap.has(oobDevId) && newNodeMap.has(oob2Id)) {
            const dev = newNodeMap.get(oobDevId);
            const oob2 = newNodeMap.get(oob2Id);
            const maxTx = Math.max(dev.transmit || 0, oob2.transmit || 0);
            const maxRx = Math.max(dev.receive || 0, oob2.receive || 0);
            newEdges.push({
                from: oobDevId,
                to: oob2Id,
                label: '',
                transmit: maxTx,
                receive: maxRx,
                status: dev.status === 0 && oob2.status === 0 ? 0 : 1,
                transmit_percent: 0,
                receive_percent: 0
            });
        }

        // 更新边状态
        if (networkData && networkData.edges) {
            newEdges.forEach(edge => {
                const existingEdge = networkData.edges.get(`${edge.from}-${edge.to}`);
                if (existingEdge) {
                    networkData.edges.update({
                        id: `${edge.from}-${edge.to}`,
                        status: edge.status,
                        transmit: edge.transmit,
                        receive: edge.receive,
                        color: {
                            color: getLinkColorWithInterPort(edge, newNodeMap), // 使用新连线颜色逻辑
                            highlight: '#ffffff'
                        }
                    });
                }
            });
        }

        // 已移除：防火墙主/备的状态/连线刷新特例

        // 更新全局变量
        nodes = newNodes;
        nodeMap = newNodeMap;
        edges = newEdges;
        // 重建端口索引并重算故障节点集合
        try { buildPortIndex(nodes); } catch (e) {}
        try { recomputeDownNodeIds(); } catch (e) {}

        // 重新渲染告警列表
        await renderAlarmList(nodes);

        console.log('数据更新成功');
    } catch (e) {
        console.error('数据更新失败:', e);
        // 不影响当前数据展示
    }
}, 6 * 60 * 1000);

loadTopology();
</script>
<script>
// 管理员模式按钮点击兜底逻辑：若已登录1小时内，直接跳转配置页；否则跳转登录页
(function(){
  var btn = document.getElementById('admin-mode-toggle');
  if (btn) {
    btn.addEventListener('click', function(){
      try {
        var token = localStorage.getItem('token');
        var tStr = localStorage.getItem('token_time');
        var t = tStr ? Number(tStr) : 0;
        var withinOneHour = !!(token && t && (Date.now() - t < 60 * 60 * 1000));
        window.location.href = withinOneHour ? '/config.html' : '/login.html';
      } catch (e) {
        window.location.href = '/login.html';
      }
    });
  }
})();
</script>
