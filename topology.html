    function appendNodeIcon(group, node) {
      if (node.kind === 'monitor' || node.type === 'monitor') {
        appendMonitorIcon(group, node);
        return;
      }
      if (node.type === 'firewall') {
        appendFirewallIcon(group, node);
        return;
      }
      appendSwitchIcon(group, node);
    }

    function linkStrokeColor(link) {
      if (link && link.fixedColor && !link.down) return link.fixedColor;
      return colorBySpeed(Number(link && link.speed) || 0, !!(link && link.down));
    }

    function linkEndpoint(from, to) {
      const fx = from.iconCx || from.cx;
      const fy = from.iconCy || from.cy;
      const tx = to.iconCx || to.cx;
      const ty = to.iconCy || to.cy;
      const dx = tx - fx;
      const dy = ty - fy;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const iconRadius = 27;
      return {
        x: fx + dx / len * iconRadius,
        y: fy + dy / len * iconRadius
      };
    }

    function linePath(a, b) {
      const start = linkEndpoint(a, b);
      const end = linkEndpoint(b, a);
      const ax = start.x;
      const ay = start.y;
      const bx = end.x;
      const by = end.y;
      const dx = Math.abs(ax - bx);
      const dy = Math.abs(ay - by);
      if (dy < 90) {
        const midX = (ax + bx) / 2;
        return `M${ax},${ay} C${midX},${ay} ${midX},${by} ${bx},${by}`;
      }
      if (dx < 70) {
        const midY = (ay + by) / 2;
        return `M${ax},${ay} C${ax},${midY} ${bx},${midY} ${bx},${by}`;
      }
      const midY = (ay + by) / 2;
      return `M${ax},${ay} C${ax},${midY} ${bx},${midY} ${bx},${by}`;
    }

    function render(options = {}) {
      const rebuild = options.rebuild !== false;
      const animate = options.animate !== false;
      if (rebuild) buildDisplayModel();
      layoutNodes();
      svg.innerHTML = '';
      const width = Math.max(1174, svg.clientWidth || 1174);
      const contentHeight = Math.max(760, ...activeZones.map(zone => zone.y + zone.h + 36));
      const height = Math.max(contentHeight, svg.clientHeight || 760);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('height', String(height));
      svg.style.height = height + 'px';

      const zoneLayer = svgEl('g');
      const linkLayer = svgEl('g');
      const zoneTextLayer = svgEl('g', { class: 'zone-text-layer' });
      const nodeLayer = svgEl('g');
      focusLinkLayer = svgEl('g', { class: 'focus-link-layer' });
      svg.appendChild(zoneLayer);
      svg.appendChild(linkLayer);
      svg.appendChild(zoneTextLayer);
      svg.appendChild(nodeLayer);
      svg.appendChild(focusLinkLayer);

      activeZones.forEach(zone => {
        zoneLayer.appendChild(svgEl('rect', { class: 'zone-bg', x: zone.x, y: zone.y, width: zone.w, height: zone.h, rx: 8 }));
        const title = svgEl('text', { class: 'zone-label', x: zone.x + 18, y: zone.y + 26 });
        title.textContent = zone.title;
        zoneTextLayer.appendChild(title);
        const sub = svgEl('text', { class: 'zone-sub', x: zone.x + 18, y: zone.y + 44 });
        sub.textContent = zone.subtitle;
        zoneTextLayer.appendChild(sub);
        (zone.sections || []).forEach(section => {
          zoneLayer.appendChild(svgEl('rect', { class: 'cluster-bg', x: section.x, y: section.y, width: section.w, height: section.h, rx: 7 }));
          const label = svgEl('text', { class: `cluster-label ${section.id}`, x: section.x + 12, y: section.y + 17 });
          label.textContent = section.title;
          zoneTextLayer.appendChild(label);
        });
      });

      const nodeByDisplayId = new Map(state.displayNodes.map(node => [node.id, node]));
      state.displayLinks.forEach(link => {
        const a = nodeByDisplayId.get(link.from);
        const b = nodeByDisplayId.get(link.to);
        if (!a || !b) return;
        const path = svgEl('path', {
          class: 'link' + (link.down ? ' down' : ''),
          'data-link-id': link.id,
          d: linePath(a, b),
          stroke: linkStrokeColor(link),
          'stroke-width': Math.min(8, 1.4 + Math.log2(link.count + 1))
        });
        if (link.dashed) path.setAttribute('stroke-dasharray', '8 6');
        const underlay = svgEl('path', {
          class: 'link-underlay',
          'data-link-id': link.id,
          d: path.getAttribute('d'),
          'stroke-width': Math.min(12, 5.2 + Math.log2(link.count + 1))
        });
        path.addEventListener('click', ev => {
          ev.stopPropagation();
          showLinkDetail(link, a, b);
        });
        linkLayer.appendChild(underlay);
        linkLayer.appendChild(path);
      });

      state.displayNodes.forEach(node => {
        const group = svgEl('g', { class: `node-card ${node.kind}${node.down ? ' down' : ''}`, 'data-node-id': node.id, transform: `translate(${node.x},${node.y})` });
        group.addEventListener('click', ev => {
          ev.stopPropagation();
          showNodeDetail(node);
        });
        group.appendChild(svgEl('rect', { class: 'node-rect', width: node.w, height: node.h, rx: 7 }));
        appendNodeIcon(group, node);
        group.appendChild(svgEl('circle', { class: 'node-dot' + (node.down ? ' alarm' : ''), cx: node.w - 13, cy: 14, r: 5, fill: node.down ? '#ef4444' : '#22c55e' }));
        const title = svgEl('text', { class: 'node-title', x: node.w / 2, y: 66 });
        title.textContent = truncate(node.label, 14);
        group.appendChild(title);
        const meta = svgEl('text', { class: 'node-meta', x: node.w / 2, y: 87 });
        meta.textContent = node.kind === 'group'
          ? `${roleLabel(node.role, node.zone)} / ${node.count} 台`
          : (node.kind === 'monitor'
            ? `专线监控 / ${node.count} 条`
            : `${roleLabel(node.role, node.zone)} / ${node.down ? 'DOWN' : 'UP'}`);
        group.appendChild(meta);
        nodeLayer.appendChild(group);
      });

      updateMetrics();
      renderLineMonitorLegend();
      refreshActiveDetail();
      applySelectionHighlight();
      if (animate && window.anime && shouldAnimateRender()) {
        anime({ targets: '.node-card', opacity: [0, 1], delay: anime.stagger(12), duration: 420, easing: 'easeOutQuad' });
        anime({ targets: '.link', strokeDashoffset: [18, 0], duration: 600, easing: 'easeOutQuad' });
      }
    }

    function updateMetrics() {
      const rawNodes = state.metricNodes || [];
      const downNodeIds = (state.faultIndex && state.faultIndex.downNodeIds) || new Set();
      $('metric-devices').textContent = rawNodes.length;
      $('metric-links').textContent = state.displayLinks.length;
      $('metric-down').textContent = downNodeIds.size;
      $('metric-fault-links').textContent = state.displayFaultLinkCount || 0;
      $('metric-meth').textContent = state.showMeth ? 0 : state.hiddenMethLinks || 0;
      const loadedAt = state.dataUpdatedAt
        ? ` / 更新时间 ${formatDateTime(state.dataUpdatedAt)}`
        : '';
      const sourceStatus = state.dataSourceError ? ' / 数据源异常' : '';
      $('subtitle').textContent = `${state.displayNodes.length} 个展示节点 / ${(state.allLinks || state.links || []).length} 条链路${loadedAt}${sourceStatus}`;
    }

    function connectedSelection(id) {
      const links = state.displayLinks.filter(link => link.from === id || link.to === id);
      const nodes = new Set([id]);
      links.forEach(link => {
        nodes.add(link.from);
        nodes.add(link.to);
      });
      return { links, nodes };
    }

    function applySelectionHighlight() {
      if (!focusLinkLayer) return;
      focusLinkLayer.innerHTML = '';
      const selected = selectedDisplayNodeId;
      const selectedLink = selectedLinkId;
      const nodeEls = Array.from(svg.querySelectorAll('.node-card'));
      const linkEls = Array.from(svg.querySelectorAll('.link,.link-underlay'));
      nodeEls.forEach(el => el.classList.remove('selected', 'connected', 'dimmed'));
      linkEls.forEach(el => el.classList.remove('connected', 'dimmed'));
      if (selected && state.displayNodeById && state.displayNodeById.has(selected)) {
        const conn = connectedSelection(selected);
        nodeEls.forEach(el => {
          const id = el.getAttribute('data-node-id');
          if (id === selected) el.classList.add('selected');
          else if (conn.nodes.has(id)) el.classList.add('connected');
          else el.classList.add('dimmed');
        });
        linkEls.forEach(el => {
          const id = el.getAttribute('data-link-id');
          if (conn.links.some(link => link.id === id)) el.classList.add('connected');
          else el.classList.add('dimmed');
        });
        conn.links.forEach(link => {
          const a = state.displayNodeById.get(link.from);
          const b = state.displayNodeById.get(link.to);
          if (!a || !b) return;
          const focus = svgEl('path', {
            class: 'link-focus' + (link.down ? ' down' : ''),
            d: linePath(a, b),
            stroke: linkStrokeColor(link),
            'stroke-width': Math.min(10, 3.6 + Math.log2(link.count + 1)),
            'data-link-id': link.id
          });
          if (link.dashed) focus.setAttribute('stroke-dasharray', '8 6');
          focus.addEventListener('click', ev => {
            ev.stopPropagation();
            showLinkDetail(link, a, b);
          });
          focusLinkLayer.appendChild(focus);
        });
        return;
      }
      if (!selectedLink) return;
      const link = state.displayLinks.find(item => item.id === selectedLink);
      if (!link) return;
      const relatedNodes = new Set([link.from, link.to]);
      nodeEls.forEach(el => {
        const id = el.getAttribute('data-node-id');
        if (relatedNodes.has(id)) el.classList.add('connected');
        else el.classList.add('dimmed');
      });
      linkEls.forEach(el => {
        const id = el.getAttribute('data-link-id');
        if (id === selectedLink) el.classList.add('connected');
        else el.classList.add('dimmed');
      });
      const a = state.displayNodeById.get(link.from);
      const b = state.displayNodeById.get(link.to);
      if (!a || !b) return;
      const focus = svgEl('path', {
        class: 'link-focus' + (link.down ? ' down' : ''),
        d: linePath(a, b),
        stroke: linkStrokeColor(link),
        'stroke-width': Math.min(10, 3.6 + Math.log2(link.count + 1)),
        'data-link-id': link.id
      });
      if (link.dashed) focus.setAttribute('stroke-dasharray', '8 6');
      focus.addEventListener('click', ev => {
        ev.stopPropagation();
        showLinkDetail(link, a, b);
      });
      focusLinkLayer.appendChild(focus);
    }

    function setActiveMetric(name) {
      document.querySelectorAll('.metric').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.metric === name);
      });
    }

    function statusBadge(down) {
      return `<span class="badge ${down ? 'bad' : 'ok'}">${down ? 'DOWN' : 'UP'}</span>`;
    }

    function ensureDetailVisible() {
      if (state.sidebarCollapsed) {
        state.sidebarAutoOpened = true;
        toggleSidebar(false);
      }
    }

    function restoreAutoHiddenSidebar() {
      if (state.sidebarAutoOpened) {
        state.sidebarAutoOpened = false;
        toggleSidebar(true);
      }
    }

    function renderNodeList(title, nodes) {
      setActiveMetric(title.metric || '');
      selectedDisplayNodeId = '';
      selectedLinkId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: title.metric || '' };
      const rows = nodes.map(node => {
        const id = esc(node.id);
        const label = esc(node.label || node.id);
        const parts = [zoneTitle(node.zone), displayClusterTitle(node.cluster || 'default'), roleLabel(node.role, node.zone)].filter(Boolean);
        const meta = esc(`${parts.join(' / ')}${node.kind === 'group' ? ' / ' + node.count + ' 台' : ''}`);
        return `<div class="list-row" data-node-id="${id}"><div><strong>${label}</strong><small>${meta}</small></div>${statusBadge(node.down)}</div>`;
      }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>${esc(title.text)}</b><span class="badge">${nodes.length}</span></div>${detailActionsHtml()}<div class="list">${rows || '<div class="info-item">暂无数据</div>'}</div>`;
      bindDetailBackButton();
      $('detail').querySelectorAll('[data-node-id]').forEach(row => {
        row.addEventListener('click', () => {
          const node = state.displayNodeById.get(row.dataset.nodeId);
          if (node) showNodeDetail(node);
        });
      });
    }

    function rawNodeView(node) {
      const label = aliasFor(node.id) || node.label || node.id;
      const meta = node && node.__display_meta || {};
      return {
        id: node.id,
        label,
        zone: meta.zone || classifyZone(node.id, label),
        role: Number(meta.role) || roleRank(node.id, label),
        cluster: meta.cluster || clusterKey(node.id, label),
        down: deviceStatusIsDown(node)
      };
    }

    function renderRawDeviceList(title, rawNodes) {
      setActiveMetric(title.metric || '');
      selectedDisplayNodeId = '';
      selectedLinkId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: title.metric || '' };
      const views = rawNodes.map(rawNodeView).sort((a, b) => a.zone.localeCompare(b.zone) || a.role - b.role || a.label.localeCompare(b.label));
      const rows = views.map(node => {
        const metaParts = [zoneTitle(node.zone), displayClusterTitle(node.cluster || 'default'), roleLabel(node.role, node.zone), node.id].filter(Boolean);
        const meta = `${metaParts.join(' / ')}`;
        return `<div class="list-row" data-raw-node-id="${esc(node.id)}"><div><strong>${esc(node.label)}</strong><small>${esc(meta)}</small></div>${statusBadge(node.down)}</div>`;
      }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>${esc(title.text)}</b><span class="badge">${views.length}</span></div>${detailActionsHtml()}<div class="list">${rows || '<div class="info-item">暂无数据</div>'}</div>`;
      bindDetailBackButton();
      $('detail').querySelectorAll('[data-raw-node-id]').forEach(row => {
        row.addEventListener('click', () => showRawDeviceDetail(row.dataset.rawNodeId));
      });
    }

    function renderLinkList() {
      setActiveMetric('links');
      selectedDisplayNodeId = '';
      selectedLinkId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: 'links' };
      const rows = state.displayLinks
        .slice()
        .sort((a, b) => Number(b.down) - Number(a.down) || b.count - a.count)
        .map(link => {
          const from = state.displayNodeById.get(link.from);
          const to = state.displayNodeById.get(link.to);
          return `<div class="list-row" data-link-id="${esc(link.id)}"><div><strong>${esc((from && from.label) || link.from)} - ${esc((to && to.label) || link.to)}</strong><small>${link.count} 条 / 最大 ${link.speed || '-'}G</small></div>${statusBadge(link.down)}</div>`;
        }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>聚合链路</b><span class="badge">${state.displayLinks.length}</span></div>${detailActionsHtml()}<div class="list">${rows || '<div class="info-item">暂无数据</div>'}</div>`;
      bindDetailBackButton();
      $('detail').querySelectorAll('[data-link-id]').forEach(row => {
        row.addEventListener('click', () => {
          const link = state.displayLinks.find(item => item.id === row.dataset.linkId);
          if (!link) return;
          showLinkDetail(link, state.displayNodeById.get(link.from), state.displayNodeById.get(link.to));
        });
      });
    }

    function renderMethDetail() {
      setActiveMetric('meth');
      selectedDisplayNodeId = '';
      selectedLinkId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: 'meth' };
      const methLinks = state.showMeth ? [] : (state.links || []).filter(link => linkUsesMeth(link));
      const rows = methLinks.map(link => {
        return `<tr><td>${esc(link.source)}</td><td>${esc(link.sourcePort || '-')}</td><td>${esc(link.target)}</td><td>${esc(link.targetPort || '-')}</td></tr>`;
      }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>隐藏管理链路</b><span class="badge">${state.showMeth ? 0 : state.hiddenMethLinks || 0}</span></div>
        ${detailActionsHtml()}
        ${state.showMeth ? '<div class="info-item">当前已开启显示管理接口，暂无隐藏项。</div>' : ''}
        <div class="detail-table-wrap"><table class="port-table" style="min-width:620px"><thead><tr><th>本端设备</th><th>本端接口</th><th>对端设备</th><th>对端接口</th></tr></thead><tbody>${rows || '<tr><td colspan="4">暂无隐藏管理链路</td></tr>'}</tbody></table></div>`;
      bindDetailBackButton();
    }

    function renderLineMonitorLegend() {
      const section = $('line-monitor-section');
      const container = $('line-monitor-legend');
      if (!section || !container) return;
      const groups = state.lineMonitorGroups || [];
      if (!lineMonitorEnabled() || !groups.length) {
        section.style.display = 'none';
        container.innerHTML = '<div class="info-item">暂无监控项</div>';
        return;
      }
      section.style.display = '';
      $('line-monitor-title').textContent = lineMonitorConfig().title || '专线监控';
      const items = groups.flatMap(group => group.items.map(item => ({ group, item })));
      $('line-monitor-count').textContent = String(items.length);
      container.innerHTML = items.map(({ group, item }) => {
        const meta = `${item.deviceLabel} / ${item.ports.join('、') || '-'}`;
        return `<div class="list-row" data-line-monitor-group="${esc(group.id)}" data-line-monitor-item="${esc(item.id)}"><div><strong>${esc(item.label)}</strong><small>${esc(meta)}</small></div>${monitorBadgeHtml(item.effectiveText, item.effectiveBadge)}</div>`;
      }).join('') || '<div class="info-item">暂无监控项</div>';
      container.querySelectorAll('[data-line-monitor-item]').forEach(row => {
        row.addEventListener('click', () => {
          showLineMonitorItemDetail(row.dataset.lineMonitorGroup, row.dataset.lineMonitorItem);
        });
      });
    }

    function showLineMonitorGroupDetail(groupId, options) {
      const opts = { recordHistory: true, ...(options || {}) };
      ensureDetailVisible();
      setActiveMetric('');
      const group = lineMonitorGroupById(groupId);
      if (!group) {
        clearDetailPanel();
        return;
      }
      if (opts.recordHistory) rememberDetail({ type: 'line-monitor-group', id: group.id });
      activeDetail = { type: 'line-monitor-group', id: group.id };
      selectedDisplayNodeId = group.nodeId;
      selectedLinkId = '';
      applySelectionHighlight();
      const rows = group.items.map(item => {
        return `<tr data-line-monitor-item="${esc(item.id)}">
          <td>${esc(item.label)}</td>
          <td>${esc(item.deviceLabel)}</td>
          <td>${monitorPortsHtml(item.portDetails)}</td>
          <td>${monitorBadgeHtml(item.portSummary.text, item.portSummary.badge)}</td>
          <td>${monitorBadgeHtml(item.monitorText, item.monitorBadge)}</td>
          <td>${monitorBadgeHtml(item.effectiveText, item.effectiveBadge)}</td>
        </tr>`;
      }).join('');
      const updatedAt = parseDateValue((state.lineMonitorData || {}).last_updated) || state.monitorUpdatedAt;
      $('detail').innerHTML = `<div class="detail-title"><b>${esc(group.title)}</b>${statusBadge(group.down)}</div>
        <div class="info-grid">
          <div class="info-item"><span>监控项</span><b>${group.count}</b></div>
          <div class="info-item"><span>锚点设备</span><b>${esc(aliasFor(group.anchorDeviceId) || group.anchorDeviceId || '-')}</b></div>
          <div class="info-item"><span>异常项</span><b>${group.items.filter(item => item.effectiveDown).length}</b></div>
          <div class="info-item"><span>更新时间</span><b>${esc(formatDateTime(updatedAt) || '-')}</b></div>
        </div>
        ${detailActionsHtml()}
        <div class="detail-table-wrap"><table class="port-table" style="min-width:1040px"><thead><tr><th>专线名称</th><th>监控设备</th><th>监控端口</th><th>端口状态</th><th>监控状态</th><th>综合状态</th></tr></thead><tbody>${rows || '<tr><td colspan="6">暂无监控数据</td></tr>'}</tbody></table></div>`;
      bindDetailBackButton();
      $('detail').querySelectorAll('[data-line-monitor-item]').forEach(row => {
        row.addEventListener('click', () => showLineMonitorItemDetail(group.id, row.dataset.lineMonitorItem));
      });
    }

    function showLineMonitorItemDetail(groupId, itemId, options) {
      const opts = { recordHistory: true, ...(options || {}) };
      ensureDetailVisible();
      setActiveMetric('');
      const group = lineMonitorGroupById(groupId);
      const item = group && group.items.find(entry => entry.id === itemId);
      if (!group || !item) {
        clearDetailPanel();
        return;
      }
      if (opts.recordHistory) rememberDetail({ type: 'line-monitor-item', groupId: group.id, id: item.id });
      activeDetail = { type: 'line-monitor-item', groupId: group.id, id: item.id };
      selectedDisplayNodeId = group.nodeId;
      selectedLinkId = '';
      applySelectionHighlight();
      const portRows = item.portDetails.map(detail => {
        const port = detail.port;
        return `<tr>
          <td>${esc(detail.name)}</td>
          <td class="${detail.exists ? (detail.up ? 'port-up' : 'port-down') : 'port-muted'}">${detail.exists ? (detail.up ? 'UP' : 'DOWN') : '缺失'}</td>
          <td>${esc(port ? (port.speed_mbps || '-') : '-')}</td>
          <td>${esc(port ? formatBytes(port.transmit || 0) : '-')}</td>
          <td>${esc(port ? formatBytes(port.receive || 0) : '-')}</td>
          <td>${port ? Math.max(Number(port.transmit_percent) || 0, Number(port.receive_percent) || 0).toFixed(2) : '0.00'}%</td>
        </tr>`;
      }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>${esc(item.label)}</b>${monitorBadgeHtml(item.effectiveText, item.effectiveBadge)}</div>
        <div class="info-grid">
          <div class="info-item"><span>监控设备</span><b>${esc(item.deviceLabel)}</b></div>
          <div class="info-item"><span>设备 ID</span><b>${esc(item.deviceId || '-')}</b></div>
          <div class="info-item"><span>综合状态</span><b>${esc(item.effectiveText)}</b></div>
          <div class="info-item"><span>端口状态</span><b>${esc(item.portSummary.text)}</b></div>
          <div class="info-item"><span>监控状态</span><b>${esc(item.monitorText)}</b></div>
        </div>
        ${detailActionsHtml()}
        <div class="detail-table-wrap"><table class="port-table" style="min-width:860px"><thead><tr><th>监控端口</th><th>状态</th><th>速率(Gbps)</th><th>发送</th><th>接收</th><th>占用%</th></tr></thead><tbody>${portRows || '<tr><td colspan="6">暂无端口数据</td></tr>'}</tbody></table></div>`;
      bindDetailBackButton();
    }

    function showNodeDetail(node, options) {
      const opts = { recordHistory: true, ...(options || {}) };
      ensureDetailVisible();
      setActiveMetric('');
      if (node.kind === 'monitor') {
        showLineMonitorGroupDetail(node.monitorGroupId || node.id.replace(/^monitor:/, ''), options);
        return;
      }
      if (opts.recordHistory) {
        rememberDetail(node.kind === 'group' ? { type: 'node', id: node.id } : { type: 'raw-device', id: node.id });
      }
      selectedDisplayNodeId = node.id;
      selectedLinkId = '';
      applySelectionHighlight();
      if (node.kind === 'group') {
        activeDetail = { type: 'node', id: node.id };
        const memberRows = node.members.map(id => {
          const raw = state.nodeById.get(id);
          const down = raw ? deviceStatusIsDown(raw) : false;
          return `<div class="list-row" data-raw-node-id="${esc(id)}"><div><strong>${esc(aliasFor(id) || id)}</strong><small>${esc(id)}</small></div>${statusBadge(down)}</div>`;
        }).join('');
        $('detail').innerHTML = `<div class="detail-title"><b>${esc(node.label)}</b>${statusBadge(node.down)}</div>
          <div class="info-grid">
            <div class="info-item"><span>类型</span><b>设备组</b></div>
            <div class="info-item"><span>分区</span><b>${esc(zoneTitle(node.zone))}</b></div>
            <div class="info-item"><span>分组</span><b>${esc(displayClusterTitle(node.cluster || 'default') || '-')}</b></div>
            <div class="info-item"><span>角色</span><b>${esc(roleLabel(node.role, node.zone))}</b></div>
            <div class="info-item"><span>成员</span><b>${node.count} 台</b></div>
          </div>
          ${detailActionsHtml()}
          <div class="list">${memberRows || '<div class="info-item">暂无成员</div>'}</div>`;
        bindDetailBackButton();
        $('detail').querySelectorAll('[data-raw-node-id]').forEach(row => {
          row.addEventListener('click', () => showRawDeviceDetail(row.dataset.rawNodeId));
        });
        return;
      }
      showRawDeviceDetail(node.id, { recordHistory: false });
    }

    function showRawDeviceDetail(id, options) {
      const opts = { recordHistory: true, ...(options || {}) };
      ensureDetailVisible();
      setActiveMetric('');
      if (opts.recordHistory) rememberDetail({ type: 'raw-device', id });
      activeDetail = { type: 'raw-device', id };
      const raw = state.nodeById.get(id) || {};
      const label = aliasFor(id) || raw.label || id;
      const ports = effectivePorts(raw);
      const portRows = prepareDevicePortRows(id, ports);
      const downPorts = portRows.filter(row => row.fault);
      const hiddenMethPorts = Array.isArray(raw.ports) ? raw.ports.length - ports.length : 0;
      const tableRows = portRows.slice().sort((a, b) => comparePortNames(a.portName, b.portName));
      const sortedRows = portRows.slice().sort((a, b) => {
        return Number(b.peerCount > 0) - Number(a.peerCount > 0)
          || Number(b.fault) - Number(a.fault)
          || Number(b.up) - Number(a.up)
          || comparePortNames(a.portName, b.portName);
      });
      const tableHtml = buildDevicePortTable(tableRows);
      const sideTableHtml = buildDevicePortTable(sortedRows);
      const tableTitle = `设备端口 - ${label}`;
      const down = deviceStatusIsDown(raw);
      $('detail').innerHTML = `<div class="detail-title"><b>${esc(label)}</b>${statusBadge(down)}</div>
        <div class="info-grid">
          <div class="info-item"><span>ID</span><b>${esc(id)}</b></div>
          <div class="info-item"><span>IP</span><b>${esc(raw.ip || '-')}</b></div>
          <div class="info-item"><span>端口</span><b>${ports.length}</b></div>
          <div class="info-item"><span>异常端口</span><b>${downPorts.length}</b></div>
        </div>
        ${detailActionsHtml(`${hiddenMethPorts > 0 ? `<span class="badge warn">已隐藏管理接口 ${hiddenMethPorts}</span>` : ''}<button id="device-expand-toggle" class="detail-btn" type="button">展示全部列</button>`)}
        <div class="detail-table-wrap">${sideTableHtml}</div>`;
      bindDetailBackButton();
      const btn = $('device-expand-toggle');
      if (btn) btn.addEventListener('click', () => openDetailFullscreen(tableTitle, tableHtml));
    }

    function prepareDevicePortRows(nodeId, ports) {
      const node = state.nodeById.get(nodeId);
      return ports.map(port => {
        const portName = port.ifName || port.ifDescr || port.ifIndex || '';
        const current = portStatusSnapshot(nodeId, portName, '', port);
        const up = current.up;
        const fault = portHasLinkedFault(node, port);
        const peers = findPeerEntries(nodeId, port);
        const peerHtml = peers.length ? `<div class="peer-stack">${peers.map(peer => {
          const peerNode = state.nodeById.get(peer.nodeId);
          const peerPort = findPortByName(peer.nodeId, peer.portName);
          const peerState = portStatusSnapshot(peer.nodeId, peer.portName, nodeId, peerPort);
          const displayPeerState = peerState.exists ? peerState : inferPeerStatusFromLocalPort(port);
          const peerStatusHtml = displayPeerState.exists
            ? `<span class="${displayPeerState.up ? 'port-up' : 'port-down'}">${displayPeerState.text}</span>`
            : '';
          return `<div class="peer-chip"><span>${esc(peerNode ? (aliasFor(peer.nodeId) || peerNode.label || peerNode.id) : peer.nodeId)}</span><small>${esc(peer.portName || '-')}</small>${peerStatusHtml}</div>`;
        }).join('')}</div>` : '<span class="port-muted">-</span>';
        const statusClass = up ? 'port-up' : (fault ? 'port-down' : 'port-muted');
        return {
          portName,
          fault,
          up,
          peerCount: peers.length,
          html: `<tr class="${fault ? 'alarm-row' : ''}"><td>${esc(portName || '-')}</td><td class="${statusClass}">${current.text}</td><td>${esc(port.speed_mbps || '-')}</td><td>${esc(formatBytes(port.transmit || 0))}</td><td>${esc(formatBytes(port.receive || 0))}</td><td>${Math.max(Number(port.transmit_percent) || 0, Number(port.receive_percent) || 0).toFixed(2)}%</td><td>${peerHtml}</td></tr>`
        };
      });
    }

    function buildDevicePortTable(rows) {
      const portRows = rows.map(row => row.html).join('');
      return `<table class="port-table" style="min-width:980px"><thead><tr><th>接口</th><th>状态</th><th>速率(Gbps)</th><th>发送</th><th>接收</th><th>占用%</th><th>对端信息</th></tr></thead><tbody>${portRows || '<tr><td colspan="7">暂无端口数据</td></tr>'}</tbody></table>`;
    }

    function addLinkDetailEntry(entries, seen, source, sourcePort, target, targetPort) {
      if (!source || !target) return;
      const key = [
        source,
        portKey(sourcePort),
        target,
        portKey(targetPort)
      ].join('\x01');
      if (seen.has(key)) return;
      seen.add(key);
      entries.push({
        source,
        sourcePort: sourcePort || '',
        target,
        targetPort: targetPort || ''
      });
    }

    function collectInferredLinkEntries(sourceNodeId, targetNodeId, entries, seen) {
      const node = state.nodeById.get(sourceNodeId);
      if (!node || !targetNodeId) return;
      effectivePorts(node).forEach(port => {
        if (!port) return;
        const sourcePort = normalizePortName(port.ifName || port.ifDescr || port.ifIndex || '');
        if (!sourcePort) return;
        if (isAggregatePortName(sourcePort)) {
          const aggregatePeers = aggregateMemberPeerEntries(sourceNodeId, port)
            .filter(item => item.nodeId === targetNodeId);
          if (aggregatePeers.length) return;
        }
        directPeerEntries(sourceNodeId, port)
          .filter(item => item.nodeId === targetNodeId)
          .forEach(item => addLinkDetailEntry(entries, seen, sourceNodeId, sourcePort, targetNodeId, normalizePortName(item.portName || '')));
      });
    }

    function buildLinkDetailEntries(link) {
      const entries = [];
      const seen = new Set();
      const nodePairs = buildLinkNodePairs(link);
      (link.raw || []).forEach(item => {
        addLinkDetailEntry(
          entries,
          seen,
          item.source,
          normalizePortName(item.sourcePort || ''),
          item.target,
          normalizePortName(item.targetPort || '')
        );
      });
      nodePairs.forEach(pair => {
        collectAggregateAliasEntries(pair.source, pair.target, entries, seen);
        collectInferredLinkEntries(pair.source, pair.target, entries, seen);
        collectInferredLinkEntries(pair.target, pair.source, entries, seen);
      });
      const normalizedEntries = entries.map(item => {
        if (!item || !item.source || !item.target) return item;
        const hasSourcePort = !!item.sourcePort;
        const hasTargetPort = !!item.targetPort;
        if (hasSourcePort && !hasTargetPort) {
          const targetAgg = aggregatePortNamesPointingTo(item.target, item.source)[0] || '';
          return targetAgg ? { ...item, targetPort: targetAgg } : item;
        }
        if (!hasSourcePort && hasTargetPort) {
          const sourceAgg = aggregatePortNamesPointingTo(item.source, item.target)[0] || '';
          return sourceAgg ? { ...item, sourcePort: sourceAgg } : item;
        }
        return item;
      });
      const concretePairKeys = new Set(normalizedEntries
        .filter(item => item && item.source && item.target && item.sourcePort && item.targetPort)
        .map(item => [item.source, item.target].sort().join('\x01')));
      return normalizedEntries
        .filter(item => {
          if (!item || !item.source || !item.target) return false;
          const hasSourcePort = !!item.sourcePort;
          const hasTargetPort = !!item.targetPort;
          if (hasSourcePort === hasTargetPort) return true;
          const aggregatePort = hasSourcePort ? item.sourcePort : item.targetPort;
          if (!isAggregatePortName(aggregatePort)) return true;
          const pairKey = [item.source, item.target].sort().join('\x01');
          return !concretePairKeys.has(pairKey);
        })
        .sort((a, b) => {
            return PORT_NAME_COLLATOR.compare(normalizeName(a.source), normalizeName(b.source))
              || comparePortNames(a.sourcePort, b.sourcePort)
              || PORT_NAME_COLLATOR.compare(normalizeName(a.target), normalizeName(b.target))
              || comparePortNames(a.targetPort, b.targetPort);
        });
    }

    function buildLinkNodePairs(link) {
      const pairs = [];
      const seen = new Set();
      const pushPair = (source, target) => {
        if (!source || !target) return;
        const key = `${source}\x01${target}`;
        if (seen.has(key)) return;
        seen.add(key);
        pairs.push({ source, target });
      };
      (link.raw || []).forEach(item => pushPair(item.source, item.target));
      if (pairs.length) return pairs;
      const fromNode = state.displayNodeById && state.displayNodeById.get(link.from);
      const toNode = state.displayNodeById && state.displayNodeById.get(link.to);
      const fromMembers = (fromNode && Array.isArray(fromNode.members) && fromNode.members.length)
        ? fromNode.members
        : [link.from];
      const toMembers = (toNode && Array.isArray(toNode.members) && toNode.members.length)
        ? toNode.members
        : [link.to];
      fromMembers.forEach(source => {
        toMembers.forEach(target => pushPair(source, target));
      });
      return pairs;
    }

    function aggregatePortNamesPointingTo(nodeId, targetNodeId) {
      const node = state.nodeById.get(nodeId);
      if (!node || !targetNodeId) return [];
      return effectivePorts(node)
        .map(port => normalizePortName(port && (port.ifName || port.ifDescr || port.ifIndex || '')))
        .filter(name => isAggregatePortName(name))
        .filter(name => {
          const port = findPortByName(nodeId, name);
          return peerTargetNameFromPort(port) === targetNodeId;
        })
        .sort(comparePortNames);
    }

    function collectAggregateAliasEntries(fromNodeId, toNodeId, entries, seen) {
      const fromAggs = aggregatePortNamesPointingTo(fromNodeId, toNodeId);
      const toAggs = aggregatePortNamesPointingTo(toNodeId, fromNodeId);
      if (!fromAggs.length && !toAggs.length) return;
      if (fromAggs.length) {
        fromAggs.forEach((fromAgg, index) => {
          addLinkDetailEntry(entries, seen, fromNodeId, fromAgg, toNodeId, toAggs[index] || toAggs[0] || '');
        });
        return;
      }
      toAggs.forEach(toAgg => {
        addLinkDetailEntry(entries, seen, fromNodeId, '', toNodeId, toAgg);
      });
    }

    function buildLinkTable(link) {
      const rows = buildLinkDetailEntries(link).map(item => {
        const srcNode = state.nodeById.get(item.source);
        const tgtNode = state.nodeById.get(item.target);
        const srcPort = findPortByName(item.source, item.sourcePort);
        const tgtPort = findPortByName(item.target, item.targetPort);
        const srcState = portStatusSnapshot(item.source, item.sourcePort, item.target, srcPort);
        const tgtState = portStatusSnapshot(item.target, item.targetPort, item.source, tgtPort);
        const anyDown = !srcState.up || !tgtState.up;
        return `<tr class="${anyDown ? 'alarm-row' : ''}">
          <td>${esc(srcNode ? (aliasFor(srcNode.id) || srcNode.label || srcNode.id) : item.source)}</td>
          <td>${esc(item.sourcePort || '-')}</td>
          <td class="${srcState.up ? 'port-up' : 'port-down'}">${srcState.text}</td>
          <td>${esc(srcPort ? (srcPort.speed_mbps || 0) : '-')}</td>
          <td>${esc(srcPort ? formatBytes(srcPort.transmit || 0) : '-')}</td>
          <td>${esc(srcPort ? formatBytes(srcPort.receive || 0) : '-')}</td>
          <td>${srcPort ? Math.max(srcPort.transmit_percent || 0, srcPort.receive_percent || 0).toFixed(2) : '0.00'}%</td>
          <td>${esc(tgtNode ? (aliasFor(tgtNode.id) || tgtNode.label || tgtNode.id) : item.target)}</td>
          <td>${esc(item.targetPort || '-')}</td>
          <td class="${tgtState.up ? 'port-up' : 'port-down'}">${tgtState.text}</td>
          <td>${esc(tgtPort ? (tgtPort.speed_mbps || 0) : '-')}</td>
          <td>${esc(tgtPort ? formatBytes(tgtPort.transmit || 0) : '-')}</td>
          <td>${esc(tgtPort ? formatBytes(tgtPort.receive || 0) : '-')}</td>
          <td>${tgtPort ? Math.max(tgtPort.transmit_percent || 0, tgtPort.receive_percent || 0).toFixed(2) : '0.00'}%</td>
        </tr>`;
      }).join('');
      return `<table class="port-table">
        <thead><tr>
          <th>本端设备</th><th>本端接口</th><th>本端接口状态</th><th>速率(Gbps)</th><th>发送</th><th>接收</th><th>占用%</th>
          <th>对端设备</th><th>对端接口</th><th>对端接口状态</th><th>速率(Gbps)</th><th>发送</th><th>接收</th><th>占用%</th>
        </tr></thead>
        <tbody>${rows || '<tr><td colspan="14">无互联端口信息</td></tr>'}</tbody>
      </table>`;
    }

    function showLinkDetail(link, fromNode, toNode, options) {
      const opts = { recordHistory: true, ...(options || {}) };
      ensureDetailVisible();
      setActiveMetric('');
      if (link.kind === 'monitor' && link.monitorGroupId) {
        showLineMonitorGroupDetail(link.monitorGroupId, options);
        return;
      }
      if (opts.recordHistory) rememberDetail({ type: 'link', id: link.id });
      activeDetail = { type: 'link', id: link.id };
      selectedDisplayNodeId = '';
      selectedLinkId = link.id;
      applySelectionHighlight();
      const tableHtml = buildLinkTable(link);
      $('detail').innerHTML = `<div class="detail-title"><b>${esc((fromNode && fromNode.label) || link.from)} - ${esc((toNode && toNode.label) || link.to)}</b>${statusBadge(link.down)}</div>
        <div class="info-grid">
          <div class="info-item"><span>聚合链路</span><b>${link.count}</b></div>
          <div class="info-item"><span>最大速率</span><b>${link.speed || '-'}G</b></div>
          <div class="info-item"><span>本端</span><b>${esc((fromNode && fromNode.label) || link.from)}</b></div>
          <div class="info-item"><span>对端</span><b>${esc((toNode && toNode.label) || link.to)}</b></div>
        </div>
        ${detailActionsHtml('<button id="link-expand-toggle" class="detail-btn" type="button">展示全部列</button>')}
        <div class="detail-table-wrap">${tableHtml}</div>`;
      bindDetailBackButton();
      const btn = $('link-expand-toggle');
      if (btn) btn.addEventListener('click', () => openLinkFullscreen(tableHtml));
    }

    function openLinkFullscreen(contentHtml) {
      openDetailFullscreen('链路信息', contentHtml);
    }

    function openDetailFullscreen(title, contentHtml) {
      let fs = $('link-fs');
      if (!fs) {
        fs = document.createElement('div');
        fs.id = 'link-fs';
        fs.className = 'link-fs';
        document.body.appendChild(fs);
      }
      fs.innerHTML = `<div class="detail-actions"><button id="link-fs-toggle" class="detail-btn">最小化</button></div>
        <div class="detail-title"><b>${esc(title)}</b></div>
        <div class="detail-table-wrap">${contentHtml}</div>`;
      fs.style.display = 'block';
      const btn = $('link-fs-toggle');
      if (btn) btn.addEventListener('click', closeLinkFullscreen);
    }

    function closeLinkFullscreen() {
      const fs = $('link-fs');
      if (fs) fs.style.display = 'none';
    }

    function rawLinkDown(link) {
      if (!link) return false;
      if (!state.showMeth && linkUsesMeth(link)) return false;
      if (state.faultIndex && state.faultIndex.rawDown) return state.faultIndex.rawDown.has(rawLinkKey(link));
      const srcPort = findPortByName(link.source, link.sourcePort);
      const tgtPort = findPortByName(link.target, link.targetPort);
      const srcState = portStatusSnapshot(link.source, link.sourcePort, link.target, srcPort);
      const tgtState = portStatusSnapshot(link.target, link.targetPort, link.source, tgtPort);
      return !srcState.up || !tgtState.up;
    }

    function renderFaultDetail() {
      setActiveMetric('faults');
      selectedDisplayNodeId = '';
      selectedLinkId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: 'faults' };
      const downNodeIds = (state.faultIndex && state.faultIndex.downNodeIds) || new Set();
      const metricNodes = state.metricNodes || [];
      const downDevices = metricNodes.filter(node => downNodeIds.has(node.id));
      const downLinks = state.displayLinks.filter(link => link.down);
      const downPortRows = [];
      metricNodes.forEach(node => {
        effectivePorts(node).forEach(port => {
          if (portHasLinkedFault(node, port)) {
            downPortRows.push(`<tr class="alarm-row"><td>${esc(aliasFor(node.id) || node.label || node.id)}</td><td>${esc(node.id)}</td><td>${esc(port.ifName || port.ifDescr || port.ifIndex || '-')}</td><td class="port-down">${esc(portStatusSnapshot(node.id, port.ifName || port.ifDescr || port.ifIndex || '', '', port).text)}</td><td>${esc(port.speed_mbps || '-')}</td><td>${esc(formatBytes(port.transmit || 0))}</td><td>${esc(formatBytes(port.receive || 0))}</td><td>${Math.max(Number(port.transmit_percent) || 0, Number(port.receive_percent) || 0).toFixed(2)}%</td></tr>`);
          }
        });
      });
      const deviceRows = downDevices.map(node => {
        const view = rawNodeView(node);
        return `<div class="list-row" data-raw-node-id="${esc(node.id)}"><div><strong>${esc(view.label)}</strong><small>${esc(`${zoneTitle(view.zone)} / ${roleLabel(view.role, view.zone)} / ${node.id}`)}</small></div>${statusBadge(true)}</div>`;
      }).join('');
      const linkRows = downLinks.map(link => {
        const from = state.displayNodeById.get(link.from);
        const to = state.displayNodeById.get(link.to);
        return `<div class="list-row" data-link-id="${esc(link.id)}"><div><strong>${esc((from && from.label) || link.from)} - ${esc((to && to.label) || link.to)}</strong><small>${link.count} 条 / 最大 ${link.speed || '-'}G</small></div>${statusBadge(true)}</div>`;
      }).join('');
      const fullTable = `<table class="port-table" style="min-width:980px"><thead><tr><th>设备</th><th>ID</th><th>接口</th><th>状态</th><th>速率(Gbps)</th><th>发送</th><th>接收</th><th>占用%</th></tr></thead><tbody>${downPortRows.join('') || '<tr><td colspan="8">暂无 DOWN 端口</td></tr>'}</tbody></table>`;
      $('detail').innerHTML = `<div class="detail-title"><b>故障详情</b><span class="badge bad">${downLinks.length} 条链路</span></div>
        <div class="info-grid">
          <div class="info-item"><span>故障设备</span><b>${downDevices.length}</b></div>
          <div class="info-item"><span>故障聚合链路</span><b>${downLinks.length}</b></div>
          <div class="info-item"><span>DOWN 端口</span><b>${downPortRows.length}</b></div>
          <div class="info-item"><span>隐藏管理链路</span><b>${state.showMeth ? 0 : state.hiddenMethLinks || 0}</b></div>
        </div>
        ${detailActionsHtml('<button id="fault-expand-toggle" class="detail-btn" type="button">展示全部列</button>')}
        <div class="section"><h2>故障设备</h2><div class="list">${deviceRows || '<div class="info-item">暂无故障设备</div>'}</div></div>
        <div class="section"><h2>故障链路</h2><div class="list">${linkRows || '<div class="info-item">暂无故障链路</div>'}</div></div>
        <div class="section"><h2>DOWN 端口</h2><div class="detail-table-wrap">${fullTable}</div></div>`;
      bindDetailBackButton();
      const btn = $('fault-expand-toggle');
      if (btn) btn.addEventListener('click', () => openDetailFullscreen('故障端口详情', fullTable));
      $('detail').querySelectorAll('[data-raw-node-id]').forEach(row => {
        row.addEventListener('click', () => showRawDeviceDetail(row.dataset.rawNodeId));
      });
      $('detail').querySelectorAll('[data-link-id]').forEach(row => {
        row.addEventListener('click', () => {
          const link = state.displayLinks.find(item => item.id === row.dataset.linkId);
          if (link) showLinkDetail(link, state.displayNodeById.get(link.from), state.displayNodeById.get(link.to));
        });
      });
    }

    function refreshActiveDetail() {
      if (!activeDetail || activeDetail.type === 'overview') return;
      renderDetailState(activeDetail);
    }

    function showMetric(metric, options) {
      const opts = { recordHistory: true, ...(options || {}) };
      if (opts.recordHistory) rememberDetail({ type: 'metric', metric });
      const metricNodes = state.metricNodes || [];
      if (metric === 'devices') {
        renderRawDeviceList({ text: '设备', metric }, metricNodes);
      } else if (metric === 'links') {
        renderLinkList();
      } else if (metric === 'down') {
        renderRawDeviceList({ text: '故障设备', metric }, metricNodes.filter(node => deviceStatusIsDown(node)));
      } else if (metric === 'faults') {
        renderFaultDetail();
      } else if (metric === 'meth') {
        renderMethDetail();
      }
    }

    async function loadAll() {
      if (state.loadAllInFlight) return state.loadAllInFlight;
      state.loadAllInFlight = (async () => {
        loading.style.display = 'grid';
        const cfgRaw = await fetchJSON('/topology/api/config/topology_config', null)
          || await fetchJSON('config/topology_config.json', {});
        state.baseConfig = cfgRaw || {};
        state.config = mergeProfile(cfgRaw || {});
        state.groupRules = await fetchJSON('/topology/api/config/group_rules', null)
          || await fetchJSON('config/group_rules.json', { groups: [] });
        const archRaw = await fetchJSON('/topology/api/config/architecture', null)
          || await fetchJSON('config/architecture_config.json', DEFAULT_ARCHITECTURE_CONFIG);
        state.architectureConfig = normalizeArchitectureConfig(archRaw);
        zoneDefinitions = state.architectureConfig.zones;
        applyRuntimeStatus(await fetchJSON('/topology/api/runtime/status', { datasets: {}, checked_at: null }));
        const topologyResult = await fetchJSONWithMeta('topology.json', { nodes: [] });
        const linksResult = await fetchJSONWithMeta('links.json', []);
        const effectiveLinksResult = resolveEffectiveLinks(linksResult.data, topologyResult.data, state.runtimeStatus);
        const monitorResult = lineMonitorEnabled()
          ? await fetchJSONWithMeta('prometheus.json', { lines: [], last_updated: null })
          : { data: { lines: [], last_updated: null }, updatedAt: null };
        state.topology = topologyResult.data;
        state.links = effectiveLinksResult.links;
        state.lineMonitorData = monitorResult.data || { lines: [], last_updated: null };
        state.lastLoadedAt = new Date();
        state.topologyUpdatedAt = topologyResult.updatedAt;
        state.linksUpdatedAt = effectiveLinksResult.usedFallback
          ? topologyResult.updatedAt
          : linksResult.updatedAt;
        state.monitorUpdatedAt = monitorResult.updatedAt || parseDateValue(state.lineMonitorData.last_updated);
        state.dataUpdatedAt = latestDate(state.topologyUpdatedAt, state.linksUpdatedAt, state.monitorUpdatedAt) || state.lastLoadedAt;
        state.dataSourceError = computeLoadedDataSourceError(state.runtimeStatus, {
          topologyUpdatedAt: state.topologyUpdatedAt,
          linksUpdatedAt: state.linksUpdatedAt,
          monitorUpdatedAt: state.monitorUpdatedAt,
          linksSatisfied: effectiveLinksResult.usedFallback || state.links.length > 0
        });
        state.showMeth = methToggle.checked || ((state.config.display || {}).showMethInterfaces === true);
        methToggle.checked = state.showMeth;
        const adminLink = $('admin-link');
        if (adminLink) adminLink.href = withClusterContext('/topology/config.html');
        state.sidebarCollapsed = !!(state.architectureConfig && state.architectureConfig.sidebar && state.architectureConfig.sidebar.default_collapsed);
        $('page-title').textContent = (state.config.title || '集群网络拓扑') + ' - 架构视图';
        document.title = $('page-title').textContent;
        updateSidebarVisibility();
        render();
        scheduleAutoRefresh();
        scheduleLineMonitorRefresh();
        loading.style.display = 'none';
      })();
      try {
        return await state.loadAllInFlight;
      } finally {
        state.loadAllInFlight = null;
      }
    }

    function scheduleAutoRefresh() {
      window.clearInterval(window.__modernRefreshTimer);
      const intervalMs = Math.max(60000, Number(state.architectureConfig && state.architectureConfig.refresh_ms) || 360000);
      window.__modernRefreshTimer = window.setInterval(() => {
        if (document.hidden) return;
        loadAll();
      }, intervalMs);
    }

    async function refreshLineMonitorData() {
      if (state.lineMonitorRefreshInFlight) return state.lineMonitorRefreshInFlight;
      state.lineMonitorRefreshInFlight = (async () => {
        if (!lineMonitorEnabled()) {
          window.clearInterval(window.__lineMonitorRefreshTimer);
          state.lineMonitorData = { lines: [], last_updated: null };
          state.monitorUpdatedAt = null;
          applyRuntimeStatus(await fetchJSON('/topology/api/runtime/status', { datasets: {}, checked_at: null }));
          render({ rebuild: true, animate: false });
          return;
        }
        applyRuntimeStatus(await fetchJSON('/topology/api/runtime/status', { datasets: {}, checked_at: null }));
        const result = await fetchJSONWithMeta('prometheus.json', { lines: [], last_updated: null });
        state.lineMonitorData = result.data || { lines: [], last_updated: null };
        state.monitorUpdatedAt = result.updatedAt || parseDateValue(state.lineMonitorData.last_updated);
        state.dataUpdatedAt = latestDate(state.topologyUpdatedAt, state.linksUpdatedAt, state.monitorUpdatedAt) || state.lastLoadedAt || new Date();
        render({ rebuild: true, animate: false });
      })();
      try {
        return await state.lineMonitorRefreshInFlight;
      } finally {
        state.lineMonitorRefreshInFlight = null;
      }
    }

    function scheduleLineMonitorRefresh() {
      window.clearInterval(window.__lineMonitorRefreshTimer);
      if (!lineMonitorEnabled()) return;
      const intervalMs = Math.max(3000, Number(lineMonitorConfig().refresh_ms) || 5000);
      window.__lineMonitorRefreshTimer = window.setInterval(() => {
        if (document.hidden) return;
        refreshLineMonitorData();
      }, intervalMs);
    }

    methToggle.addEventListener('change', () => {
      state.showMeth = methToggle.checked;
      render();
    });

    function updateSidebarVisibility() {
      const sidebarEnabled = !state.architectureConfig || !state.architectureConfig.sidebar || state.architectureConfig.sidebar.enabled !== false;
      shell.classList.toggle('sidebar-collapsed', !!state.sidebarCollapsed || !sidebarEnabled);
      const btn = $('side-toggle');
      if (btn) btn.textContent = state.sidebarCollapsed ? '展开' : '隐藏';
      const fab = $('info-toggle');
      if (fab) {
        fab.style.display = sidebarEnabled ? 'inline-flex' : 'none';
        fab.setAttribute('aria-label', state.sidebarCollapsed ? '显示集群信息' : '隐藏集群信息');
      }
    }

    function toggleSidebar(force) {
      state.sidebarCollapsed = typeof force === 'boolean' ? force : !state.sidebarCollapsed;
      updateSidebarVisibility();
      window.requestAnimationFrame(() => render({ rebuild: false, animate: false }));
    }

    $('info-toggle').addEventListener('click', () => {
      state.sidebarAutoOpened = false;
      toggleSidebar();
    });
    $('side-toggle').addEventListener('click', () => {
      state.sidebarAutoOpened = false;
      toggleSidebar();
    });
    $('reload').addEventListener('click', loadAll);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadAll();
    });
    document.querySelectorAll('.metric').forEach(btn => {
      btn.addEventListener('click', () => showMetric(btn.dataset.metric));
    });
    svg.addEventListener('click', () => {
      state.detailHistory = [];
      clearDetailPanel();
    });
    window.addEventListener('resize', () => {
      window.clearTimeout(window.__modernResize);
      window.__modernResize = window.setTimeout(() => render({ rebuild: false, animate: false }), 120);
    });
    loadAll();
  </script>
</body>
</html>
