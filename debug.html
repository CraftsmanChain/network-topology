<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>智元集群拓扑监控</title>
<!-- 引入 vis.js -->
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #0d1421;
    color: #fff;
}
#title {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    padding: 10px;
    color: #00e5ff;
    width: calc(100vw - 350px);
    box-sizing: border-box;
}
#topo {
    width: calc(100vw - 350px);
    height: calc(100vh - 50px);
    float: left;
    position: relative;
    background: radial-gradient(circle at center, #0d1b2a 0%, #0a1120 100%);
}
/* 独立的画布容器，避免清空 legend */
.topo-canvas {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
}
.sidebar {
    position: absolute;
    top: 50px;
    right: 0;
    width: 350px;
    height: calc(100% - 50px);
    background-color: #1a1f2e;
    border-left: 1px solid #2a3244;
    padding: 10px;
    overflow-y: auto;
}
.sidebar h2 {
    margin-top: 0;
    font-size: 18px;
    color: #00e5ff;
}
.port-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 10px;
}
.port-table th, .port-table td {
    border: 1px solid #2a3244;
    padding: 4px;
    font-size: 12px;
    text-align: center;
}
.port-up { color: #00ff9d; }
.port-down { color: #ff4d4d; }
.legend {
    position: absolute;
    left: 20px;
    bottom: 20px;
    background: rgba(26, 31, 46, 0.85);
    padding: 8px;
    border-radius: 5px;
    z-index: 1000;
    font-size: 12px;
}
.legend-item {
    display: flex;
    align-items: center;
    margin: 4px 0;
}
/* 新增样式 */
.status-up {
    color: #00ff9d;
    font-weight: bold;
}
.status-down {
    color: #ff4d4d;
    font-weight: bold;
}
/* 集群信息数字颜色 */
.total-count { color: #ffffff; }   /* 白色 */
.down-count { color: #ff4d4d; }     /* 红色 */
.online-count { color: #00ff9d; }  /* 绿色 */

/* 集群信息区域样式 */
.overview-box {
    background: #1f2637;
    border: 1px solid #2a3244;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.overview-box p {
    margin: 6px 0;
    font-size: 14px;
}

/* 设备详情区域样式 */
.device-info-box {
    background: #1f2637;
    border: 1px solid #2a3244;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.device-info-box p {
    margin: 6px 0;
    font-size: 14px;
}
.device-info-box b {
    font-size: 16px;
    color: #00e5ff;
}

/* 告警列表样式 */
.alarm-box {
    background: #1f2637;
    border: 1px solid #2a3244;
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.alarm-box h3 {
    margin: 0 0 8px 0;
    font-size: 16px;
    color: #00e5ff;
}
.alarm-list {
    list-style: none;
    padding: 0;
    margin: 0;
}
.alarm-list li {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
    font-size: 13px;
}
.alarm-list li span {
    flex: 1;
}
.alarm-list li.alarm {
    color: #ff4d4d;
    animation: blink 1.2s infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

/* 整行告警标红 */
.alarm-row {
    background-color: #3c1e1e !important;
    color: #ff4d4d !important;
}

/* 故障节点原图标闪烁 */
@keyframes node-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}
/* 节点标签颜色：正常节点白色，故障节点红色 */
.vis-network .vis-label {
    color: #ffffff !important;
}
.vis-network .vis-label.status-down {
    color: #ff4d4d !important;
}

/* 专线样式：虚线蓝色，故障红色闪烁 */
@keyframes dash-blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
}
.dash-line {
    stroke-dasharray: 8,4;
    stroke: #00e5ff;
    stroke-width: 2;
    fill: none;
    animation: dash-blink 1s infinite;
}
.dash-line.down {
    stroke: #ff4d4d;
}

/* 图例中专线样式 */
.legend-item span.dash-legend {
    display: inline-block;
    width: 30px;
    height: 0;
    border-top: 2px dashed #00e5ff;
    margin-right: 10px;
}
/* 拓扑重置按钮样式（右下角） */
.reset-btn {
    position: absolute;
    right: 20px;
    bottom: 20px;
    z-index: 1100;
    background: #243049;
    color: #00e5ff;
    border: 1px solid #2a3244;
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(0,0,0,.25);
}
.reset-btn:hover {
    background: #2a3751;
}
</style>
</head>
<body>
<div id="title">智元集群拓扑监控</div>
<div id="topo">
    <div class="legend" id="legend">
        <div class="legend-item">
            <span style="display:inline-block;width:30px;height:0;border-top:2px solid #00ff9d;margin-right:10px;"></span>正常链路
        </div>
        <div class="legend-item">
            <span style="display:inline-block;width:30px;height:0;border-top:2px solid #ffd166;margin-right:10px;"></span>中等负载
        </div>
        <div class="legend-item">
            <span style="display:inline-block;width:30px;height:0;border-top:2px solid #ff4444;margin-right:10px;"></span>故障链路
        </div>
        <div class="legend-item">
            <span class="dash-legend"></span>专线
        </div>
    </div>
    <div id="topo-canvas" class="topo-canvas"></div>
    <button id="reset-topo" class="reset-btn">重置拓扑</button>
</div>
<div class="sidebar">
    <h2 id="sidebar-title">集群信息</h2>
    <div id="device-info"></div>
</div>

<script>
// Prometheus 地址


// 链路互联信息缓存
let linkMap = new Map();

// 防火墙常量
const FIREWALL_ID = 'NXBHZY_102_-7-B-09-33U_FW01';
const FIREWALL_ALIAS = '防火墙-主';
const FIREWALL_IP = '172.16.201.1';

// 防火墙-备常量
const FIREWALL_BACKUP_ID = 'NXBHZY_Backup_FW_02_102_7B-10';
const FIREWALL_BACKUP_ALIAS = '防火墙-备';

// 监控项定义（含专线）
// 已移除 monitors，专线元信息改由本地 prometheus.json 的 lines 驱动
// 固定专线端口映射与设备名
const SPECIAL_LINE_PORTS = {
    '上海专线': 'Eth-Trunk44',
    '宁夏专线': '25GE1/0/44|25GE2/0/44',
    '金山专线': '25GE2/0/37',
    '火山专线': '25GE1/0/37',
    '周浦-宁夏专线': '25GE1/0/44|25GE2/0/44',
    '周浦-张江专线': '25GE1/0/43|25GE2/0/43'
};
function getLinePort(name) {
    return SPECIAL_LINE_PORTS[name] || '-';
}
const SPECIAL_LINE_DEVICE = 'ACC02';



// 本地 Prometheus 行数据（专线状态）
let localPromData = { lines: [], last_updated: null };
async function loadLocalPrometheusLines() {
    try {
        const res = await fetch('prometheus.json');
        const data = await res.json();
        localPromData = data || { lines: [], last_updated: null };
    } catch (e) {
        console.error('加载 prometheus.json 失败:', e);
        localPromData = { lines: [], last_updated: null };
    }
    return localPromData;
}
function getLineStatusByName(name) {
    const lines = localPromData && Array.isArray(localPromData.lines) ? localPromData.lines : [];
    const item = lines.find(l => (l.display_name === name) || (l.name === name));
    if (!item) return null;
    return item.status;
}
function isLineTriggered(name) {
    const status = getLineStatusByName(name);
    if (status == null) return false;
    if (typeof status === 'number') return status !== 0;
    const s = String(status).toLowerCase();
    return s === 'down' || s === '1' || s === 'true';
}



// 字节单位转换
function formatBytes(bytes) {
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
}

// 计算流量占用百分比
function calcUtil(tx, rx, upPorts) {
    const maxVal = Math.max(tx||0, rx||0);
    const totalGb = 400 * 1000 * 1000 * 1000 * upPorts;
    return totalGb ? (maxVal/totalGb*100) : 0;
}

// 节点显示名称处理：优先别名，否则取最后一段
function formatName(name, alias) {
    if (alias) return alias;
    const parts = name.split('_');
    return parts[parts.length - 1];
}

// 获取节点图标
function getNodeIcon(d) {
    if (d.id.includes('25Gnei_AGG01') || d.id.includes('25Gnei_AGG02')) {
        if (d.status !== 0) {
            return 'web/core-bad.png';
        }
        return 'web/core.png';
    }
    if (d.status !== 0) {
        return 'web/sw-bad.png';
    }
    return 'web/sw.png';
}

// 获取连线颜色：任一设备总体或端口超阈值即按阈值着色
function getLinkColor(d, nodeMap) {
    if (d.status !== 0) return '#ff4d4d';
    const srcNode = nodeMap.get(d.from);
    const tgtNode = nodeMap.get(d.to);
    const srcUtil = srcNode ? calcUtil(srcNode.transmit||0, srcNode.receive||0,
        (srcNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
    const tgtUtil = tgtNode ? calcUtil(tgtNode.transmit||0, tgtNode.receive||0,
        (tgtNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
    const maxUtil = Math.max(srcUtil, tgtUtil);
    if (maxUtil < 20) return '#00ff9d';
    if (maxUtil <= 70) return '#ffd166';
    return '#ff9e44';
}

// 显示整体信息
function showOverview(nodes) {
    const sidebar = document.getElementById('device-info');
    const sidebarTitle = document.getElementById('sidebar-title');
    if (!sidebar || !sidebarTitle) {
        console.warn('侧边栏元素未找到，跳过渲染');
        return;
    }
    sidebarTitle.textContent = '集群信息';
    const total = nodes.length;
    const down = nodes.filter(d => d.status !== 0).length;
    let html = `<div class="overview-box">`;
    html += `<p>总设备数: <span class="total-count">${total}</span></p>`;
    html += `<p>故障设备数: <span class="down-count">${down}</span></p>`;
    html += `<p>在线设备数: <span class="online-count">${total - down}</span></p>`;
    html += `</div>`;

    // 监控告警列表（含状态列）
    html += `<div class="alarm-box">`;
    html += `<h3>监控告警</h3>`;
    html += `<table class="port-table"><thead><tr><th>监控项</th><th>监控端口</th><th>监控设备</th><th>是否触发告警</th><th>状态</th></tr></thead><tbody id="alarm-list"></tbody></table>`;
    html += `</div>`;

    // 设备状态列表
    html += `<div class="alarm-box">`;
    html += `<h3>设备状态</h3>`;
    html += `<table class="port-table"><thead><tr><th>告警设备</th><th>设备状态</th></tr></thead><tbody id="device-status-list"></tbody></table>`;
    html += `</div>`;

    sidebar.innerHTML = html;
    renderAlarmList(nodes);
}

// 渲染告警列表（含状态列）
async function renderAlarmList(nodes) {
    const alarmList = document.getElementById('alarm-list');
    if (!alarmList) return;

        await loadLocalPrometheusLines();
    const results = (localPromData.lines || []).map(l => {
        const name = l.display_name || l.name || '未命名专线';
         const s = l.status;
         const triggered = (typeof s === 'string' ? s.toLowerCase() === 'down' : (Number(s) !== 0));
         return {
             name,
             port: getLinePort(name),
             device: SPECIAL_LINE_DEVICE,
             type: '专线',
             triggered
         };
    });

    let html = '';
    results.forEach(m => {
        const status = m.triggered ? 'DOWN' : 'UP';
        const statusClass = m.triggered ? 'port-down' : 'port-up';
        html += `<tr class="${m.triggered ? 'alarm alarm-row' : ''}">`;
        html += `<td>${m.name}</td>`;
        html += `<td>${m.port}</td>`;
        html += `<td>${formatName(m.device)}</td>`;
        html += `<td>${m.triggered ? '是' : '否'}</td>`;
        html += `<td class="${statusClass}">${status}</td>`;
        html += `</tr>`;
    });

    alarmList.innerHTML = html;

    // 同步专线组告警状态以驱动闪烁（当前仅 acc02 组）
    try {
        const anyDown = results.some(r => r.triggered);
        specialLineDownMap['acc02'] = anyDown;
        updateDownEffects();
    } catch (e) {
        console.warn('专线组告警状态同步失败:', e);
    }

    // 渲染设备状态列表
    const deviceStatusList = document.getElementById('device-status-list');
    if (!deviceStatusList) return;

    const downDevices = nodes.filter(n => n.status !== 0);
    let statusHtml = '';

    if (downDevices.length > 0) {
        downDevices.forEach(d => {
            statusHtml += `<tr class="alarm alarm-row">`;
            statusHtml += `<td>${d.label}</td>`;
            statusHtml += `<td>DOWN</td>`;
            statusHtml += `</tr>`;
        });
    } else {
        statusHtml += `<tr><td>无告警</td><td>-</td></tr>`;
    }

    deviceStatusList.innerHTML = statusHtml;
}

// 显示设备详情
function showDeviceInfo(d) {
    const sidebar = document.getElementById('device-info');
    const sidebarTitle = document.getElementById('sidebar-title');
    sidebarTitle.textContent = '设备信息';
    // 防火墙设备：只显示IP、设备名与状态
    if (d.id === FIREWALL_ID || d.id === FIREWALL_BACKUP_ID) {
        let html = `<div class="device-info-box">`;
        const isBackup = d.id === FIREWALL_BACKUP_ID;
        html += `<p><b>${isBackup ? FIREWALL_BACKUP_ALIAS : FIREWALL_ALIAS}</b></p>`;
        html += `<p>设备IP: ${isBackup ? (d.ip || '172.16.202.2') : (d.ip || FIREWALL_IP)}</p>`;
        html += `<p>状态: <span class="${d.status === 0 ? 'status-up' : 'status-down'}">${d.status === 0 ? 'UP' : 'DOWN'}</span></p>`;
        html += `</div>`;
        sidebar.innerHTML = html;
        return;
    }

    const upPorts = d.ports ? d.ports.filter(p => p.status === 1 || (p.transmit > 0 || p.receive > 0)).length : 0;
    const deviceUtil = Math.max(d.transmit_percent || 0, d.receive_percent || 0);

    let html = `<div class="device-info-box">`;
    html += `<p><b>${d.id}</b></p>`;
    html += `<p>设备IP: ${d.ip || 'N/A'}</p>`;
    html += `<p>状态: <span class="${d.status === 0 ? 'status-up' : 'status-down'}">${d.status === 0 ? 'UP' : 'DOWN'}</span></p>`;
    html += `<p>流量占用: ${deviceUtil.toFixed(2)}%</p>`;
    html += `<p>发送流量: ${formatBytes(d.transmit || 0)}</p>`;
    html += `<p>接收流量: ${formatBytes(d.receive || 0)}</p>`;
    html += `</div>`;

    if (d.ports && d.ports.length > 0) {
        html += `<table class="port-table"><tr><th>端口</th><th>状态</th><th>速率(Gbps)</th><th>发送</th><th>接收</th><th>占用%</th></tr>`;
        d.ports.forEach(p => {
            const portUp = p.status === 1 || (p.transmit > 0 || p.receive > 0);
            const portUtil = Math.max(p.transmit_percent || 0, p.receive_percent || 0);
            html += `<tr>
                <td>${p.ifDescr || p.ifIndex}</td>
                <td class="${portUp ? 'port-up' : 'port-down'}">${portUp ? 'UP' : 'DOWN'}</td>
                <td>${p.speed_mbps || 0}</td>
                <td>${formatBytes(p.transmit || 0)}</td>
                <td>${formatBytes(p.receive || 0)}</td>
                <td>${portUtil.toFixed(2)}%</td>
            </tr>`;
        });
        html += `</table>`;
    } else {
        html += `<p>无端口信息</p>`;
    }
    sidebar.innerHTML = html;
}

// 显示链路详情
function showLinkInfo(edgeData) {
    const sidebar = document.getElementById('device-info');
    const sidebarTitle = document.getElementById('sidebar-title');
    sidebarTitle.textContent = '链路信息';
    const fromNode = nodeMap.get(edgeData.from);
    const toNode = nodeMap.get(edgeData.to);
    const key = makeUndirectedKey(edgeData.from, edgeData.to);
    const rawLinks = linkMap.get(key) || [];
    // 规整方向为本端(from)→对端(to)，并按“无向端口对”去重
    const seen = new Set();
    const links = [];
    rawLinks.forEach(rec => {
        const oriented = (rec.source === edgeData.from && rec.target === edgeData.to)
            ? rec
            : {
                source: rec.target,
                sourcePort: rec.targetPort,
                target: rec.source,
                targetPort: rec.sourcePort
            };
        const a = `${oriented.source}|${oriented.sourcePort}`;
        const b = `${oriented.target}|${oriented.targetPort}`;
        const undirectedPairId = a < b ? `${a}__${b}` : `${b}__${a}`;
        if (seen.has(undirectedPairId)) return;
        seen.add(undirectedPairId);
        links.push(oriented);
    });
    let html = `<div class="device-info-box">`;
    html += `<p><b>链路详情</b></p>`;
    html += `<p>源设备: ${fromNode ? fromNode.id : edgeData.from}</p>`;
    html += `<p>目标设备: ${toNode ? toNode.id : edgeData.to}</p>`;
    html += `<p>状态: <span class="${edgeData.status === 0 ? 'status-up' : 'status-down'}">${edgeData.status === 0 ? 'UP' : 'DOWN'}</span></p>`;
    html += `</div>`;
    if (links.length > 0) {
        html += `<table class="port-table">
            <thead>
                <tr>
                    <th>本端设备</th>
                    <th>本端接口</th>
                    <th>本端接口状态</th>
                    <th>速率(Gbps)</th>
                    <th>发送</th>
                    <th>接收</th>
                    <th>占用%</th>
                    <th>对端设备</th>
                    <th>对端接口</th>
                    <th>对端接口状态</th>
                    <th>速率(Gbps)</th>
                    <th>发送</th>
                    <th>接收</th>
                    <th>占用%</th>
                </tr>
            </thead>
            <tbody>`;
        links.forEach(link => {
            const srcPort = findPortByName(fromNode, link.sourcePort);
            const tgtPort = findPortByName(toNode, link.targetPort);
            let srcUp = srcPort ? (srcPort.status === 1 || (srcPort.transmit > 0 || srcPort.receive > 0)) : false;
            let tgtUp = tgtPort ? (tgtPort.status === 1 || (tgtPort.transmit > 0 || tgtPort.receive > 0)) : false;
            // 防火墙-备特例：链路信息面板中本机端口固定显示为UP（不受设备/端口状态影响）
            if (edgeData.from === FIREWALL_BACKUP_ID) {
                srcUp = true;
            } else if (fromNode && fromNode.id === FIREWALL_ID) {
                // 防火墙-主：端口状态与设备状态一致
                srcUp = (fromNode.status === 0);
            }
            if (edgeData.to === FIREWALL_BACKUP_ID) {
                tgtUp = true;
            } else if (toNode && toNode.id === FIREWALL_ID) {
                // 防火墙-主：端口状态与设备状态一致
                tgtUp = (toNode.status === 0);
            }
            const anyDown = !srcUp || !tgtUp;
            html += `<tr class="${anyDown ? 'alarm alarm-row' : ''}">`;
            html += `<td>${fromNode ? fromNode.id : link.source}</td>`;
            html += `<td>${link.sourcePort}</td>`;
            html += `<td class="${srcUp ? 'port-up' : 'port-down'}">${srcUp ? 'UP' : 'DOWN'}</td>`;
            html += `<td>${srcPort ? (srcPort.speed_mbps || 0) : '-'}</td>`;
            html += `<td>${srcPort ? formatBytes(srcPort.transmit || 0) : '-'}</td>`;
            html += `<td>${srcPort ? formatBytes(srcPort.receive || 0) : '-'}</td>`;
            html += `<td>${srcPort ? Math.max(srcPort.transmit_percent || 0, srcPort.receive_percent || 0).toFixed(2) : '0.00'}%</td>`;
            html += `<td>${toNode ? toNode.id : link.target}</td>`;
            html += `<td>${link.targetPort}</td>`;
            html += `<td class="${tgtUp ? 'port-up' : 'port-down'}">${tgtUp ? 'UP' : 'DOWN'}</td>`;
            html += `<td>${tgtPort ? (tgtPort.speed_mbps || 0) : '-'}</td>`;
            html += `<td>${tgtPort ? formatBytes(tgtPort.transmit || 0) : '-'}</td>`;

// 根据端口名称查找端口
function findPortByName(node, portName) {
    if (!node || !node.ports) return null;
    return node.ports.find(p => (p.ifDescr || p.ifIndex) === portName);
}

// 无向边键：将 A-B 与 B-A 合并到同一键，避免重复
function makeUndirectedKey(a, b) {
    return a < b ? `${a}-${b}` : `${b}-${a}`;
}

async function loadLinkInfo() {
    try {
        const res = await fetch('links.json');
        const data = await res.json();
        if (!Array.isArray(data)) return;
        linkMap.clear();
        data.forEach(link => {
            const key = makeUndirectedKey(link.source, link.target);
            if (!linkMap.has(key)) linkMap.set(key, []);
            // 仅存原始条目，点击时按 from/to 方向规整并在展示层去重
            linkMap.get(key).push(link);
        });
    } catch (e) {
        console.error('加载 links.json 失败:', e);
    }
}

// 获取连线颜色
function getLinkColorWithInterPort(d, nodeMap) {
    const srcNode = nodeMap.get(d.from);
    const tgtNode = nodeMap.get(d.to);
    const key = makeUndirectedKey(d.from, d.to);
    const rawLinks = linkMap.get(key) || [];
    // 特例：防火墙-备的连线仅按设备状态与利用率着色，不依据端口DOWN
    if (d.from === FIREWALL_BACKUP_ID || d.to === FIREWALL_BACKUP_ID) {
        const downByDevice = (!!srcNode && srcNode.status !== 0) || (!!tgtNode && tgtNode.status !== 0);
        if (downByDevice) return '#ff4d4d';
        const srcUtil = srcNode ? calcUtil(srcNode.transmit||0, srcNode.receive||0,
            (srcNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
        const tgtUtil = tgtNode ? calcUtil(tgtNode.transmit||0, tgtNode.receive||0,
            (tgtNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
        const maxUtil = Math.max(srcUtil, tgtUtil);
        return (maxUtil > 20) ? '#ffd166' : '#00ff9d';
    }
    let down = false;
    if (rawLinks.length === 0) {
        // 无端口信息时，仅以设备状态为准
        down = (!!srcNode && srcNode.status !== 0) || (!!tgtNode && tgtNode.status !== 0);
    } else {
        const seen = new Set();
        for (const rec of rawLinks) {
            const oriented = (rec.source === d.from && rec.target === d.to)
                ? rec
                : { source: rec.target, sourcePort: rec.targetPort, target: rec.source, targetPort: rec.sourcePort };
            const a = `${oriented.source}|${oriented.sourcePort}`;
            const b = `${oriented.target}|${oriented.targetPort}`;
            const undirectedPairId = a < b ? `${a}__${b}` : `${b}__${a}`;
            if (seen.has(undirectedPairId)) continue;
            seen.add(undirectedPairId);
            const srcPort = findPortByName(srcNode, oriented.sourcePort);
            const tgtPort = findPortByName(tgtNode, oriented.targetPort);
            let srcUp = srcPort ? (srcPort.status === 1 || (srcPort.transmit > 0 || srcPort.receive > 0)) : false;
            let tgtUp = tgtPort ? (tgtPort.status === 1 || (tgtPort.transmit > 0 || tgtPort.receive > 0)) : false;
            // 防火墙主/备：端口状态与设备状态一致
            if (srcNode && (srcNode.id === FIREWALL_ID || srcNode.id === FIREWALL_BACKUP_ID)) srcUp = (srcNode.status === 0);
            if (tgtNode && (tgtNode.id === FIREWALL_ID || tgtNode.id === FIREWALL_BACKUP_ID)) tgtUp = (tgtNode.status === 0);
            if (!srcUp || !tgtUp) { down = true; break; }
        }
    }
    if (down) return '#ff4d4d';
    // 未DOWN时按利用率着色
    const srcUtil = srcNode ? calcUtil(srcNode.transmit||0, srcNode.receive||0,
        (srcNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
    const tgtUtil = tgtNode ? calcUtil(tgtNode.transmit||0, tgtNode.receive||0,
        (tgtNode.ports||[]).filter(p=>p.status===1||(p.transmit>0||p.receive>0)).length||1) : 0;
    const maxUtil = Math.max(srcUtil, tgtUtil);
    return (maxUtil > 20) ? '#ffd166' : '#00ff9d';
}

async function loadTopology() {
    try {
        await loadLinkInfo();

        const res = await fetch('topology-debug.json');
        const data = await res.json();
        if (!data || !data.nodes) {
            console.error("Topology JSON 数据无效");
            return;
        }

        nodes = (data.nodes || []).filter(d => d && d.id);
        nodeMap = new Map(nodes.map(d => [d.id, d]));
        edges = (data.edges || []).filter(d => d && d.source && d.target)
            .map(d => {
                const srcId = d.source.split(':')[0];
                const tgtId = d.target.split(':')[0];
                if (!nodeMap.has(srcId) || !nodeMap.has(tgtId)) return null;
                const sourceNode = nodeMap.get(srcId);
                const targetNode = nodeMap.get(tgtId);
                return {
                    from: srcId,
                    to: tgtId,
                    label: d.label,
                    transmit: d.transmit || 0,
                    receive: d.receive || 0,
                    status: sourceNode.status === 0 && targetNode.status === 0 ? 0 : 1,
                    transmit_percent: d.transmit_percent || 0,
                    receive_percent: d.receive_percent || 0
                };
            }).filter(d => d != null);

        // 手动添加核心交换1与核心交换2之间的链路
        const core1Id = 'NXBHZY_102_7-B-05-46U_25Gnei_AGG01';
        const core2Id = 'NXBHZY_102_-7-B-07-46U_25Gnei_AGG02';
        if (nodeMap.has(core1Id) && nodeMap.has(core2Id)) {
            const core1 = nodeMap.get(core1Id);
            const core2 = nodeMap.get(core2Id);
            const maxTx = Math.max(core1.transmit || 0, core2.transmit || 0);
            const maxRx = Math.max(core1.receive || 0, core2.receive || 0);
            const util = calcUtil(maxTx, maxRx, 1);
            edges.push({
                from: core1Id,
                to: core2Id,
                label: '',
                transmit: maxTx,
                receive: maxRx,
                status: core1.status === 0 && core2.status === 0 ? 0 : 1,
                transmit_percent: util,
                receive_percent: util
            });
        }

        // 每台接入交换机分别双上联到两台核心交换机
        const accessIds = [
            'NXBHZY_102_-7-B-09/10-42U_25Gnei_ACC01',
            'NXBHZY_102_-7-B-09/10-30U_25Gnei_ACC02',
            'NXBHZY_103_1B-09/10-34U_25Gnei_ACC03'
        ];

        accessIds.forEach(accId => {
            if (!nodeMap.has(accId)) return;
            const accNode = nodeMap.get(accId);
            [core1Id, core2Id].forEach(coreId => {
                if (!nodeMap.has(coreId)) return;
                    const coreNode = nodeMap.get(coreId);
                    const maxTx = Math.max(accNode.transmit || 0, coreNode.transmit || 0);
                    const maxRx = Math.max(accNode.receive || 0, coreNode.receive || 0);
                    const util = calcUtil(maxTx, maxRx, 1);
                    edges.push({
                        from: accId,
                        to: coreId,
                        label: '',
                        transmit: maxTx,
                        receive: maxRx,
                        status: accNode.status === 0 && coreNode.status === 0 ? 0 : 1,
                        transmit_percent: util,
                        receive_percent: util
                    });
            });
        });

        // === 新增：带外-网络设备分别与 带外-交换1、带外-交换2 互联 ===
        const oob1Id = 'NXBHZY_102_-7-B-10-36U_PCOOB_ACC2'; // 带外-交换1

            const maxTx = Math.max(dev.transmit || 0, oob1.transmit || 0);
            const maxRx = Math.max(dev.receive || 0, oob1.receive || 0);
            const util = calcUtil(maxTx, maxRx, 1);
            edges.push({
                from: oobDevId,
                to: oob1Id,
                label: '',

                receive: maxRx,
                status: dev.status === 0 && oob1.status === 0 ? 0 : 1,

        // 带外-网络设备 ↔ 带外-交换2

            const dev = nodeMap.get(oobDevId);

        // === 新增：防火墙-主（顶层独立，状态来自 topology-debug.json） ===

            nodeMap.set(FIREWALL_ID, firewallNode);
        }

    // 防火墙连线：仅与 带外-交换1、带外-网络设备、核心聚合 互联
    const firewallPeers = [
        'NXBHZY_102_-7-B-09-36U_SW00B_ACC1', // 带外-网络设备
        'NXBHZY_102_-7-B-10-36U_PCOOB_ACC2', // 带外-交换1

    firewallPeers.forEach(peerId => {
        if (!nodeMap.has(peerId)) return;
        const peer = nodeMap.get(peerId);
        const maxTx = Math.max(firewallNode.transmit || 0, peer.transmit || 0);
        const maxRx = Math.max(firewallNode.receive || 0, peer.receive || 0);

            const rawLinks = linkMap.get(key) || [];
            // 特例：防火墙-备的边不依据端口DOWN，仅当设备自身DOWN时判定

            }
            const srcNode = nodeMap.get(edge.from);
            const tgtNode = nodeMap.get(edge.to);
            const seen = new Set();
            for (const rec of rawLinks) {
                // 规整方向为 from→to
                const oriented = (rec.source === edge.from && rec.target === edge.to)
                    ? rec
                    : { source: rec.target, sourcePort: rec.targetPort, target: rec.source, targetPort: rec.sourcePort };
                const a = `${oriented.source}|${oriented.sourcePort}`;
                const b = `${oriented.target}|${oriented.targetPort}`;
                const undirectedPairId = a < b ? `${a}__${b}` : `${b}__${a}`;
                if (seen.has(undirectedPairId)) continue;
                seen.add(undirectedPairId);
                const srcPort = findPortByName(srcNode, oriented.sourcePort);
                const tgtPort = findPortByName(tgtNode, oriented.targetPort);
                let srcUp = srcPort ? (srcPort.status === 1 || (srcPort.transmit > 0 || srcPort.receive > 0)) : false;
                let tgtUp = tgtPort ? (tgtPort.status === 1 || (tgtPort.transmit > 0 || tgtPort.receive > 0)) : false;
                // 防火墙主/备：端口状态与设备状态一致

                if (tgtNode && (tgtNode.id === FIREWALL_ID || tgtNode.id === FIREWALL_BACKUP_ID)) tgtUp = (tgtNode.status === 0);
                if (!srcUp || !tgtUp) return true;
            }
            return false;
        }

                    to: peerId,
                    transmit: Math.max(firewallNodeNew.transmit || 0, peer.transmit || 0),
                    receive: Math.max(firewallNodeNew.receive || 0, peer.receive || 0),
                    status: peer.status === 0 ? 0 : 1,
                    transmit_percent: 0,
                    receive_percent: 0
                };
                networkData.edges.update({
                    id: edgeId,
                    status: edgeObj.status,
                    transmit: edgeObj.transmit,
                    receive: edgeObj.receive,
                    color: {
                        color: getLinkColorWithInterPort(edgeObj, newNodeMap),
                        highlight: '#ffffff'
                    }
                });
            }
        });

        // 更新全局变量
        nodes = newNodes;
        nodeMap = newNodeMap;
        edges = newEdges;

        // 重新渲染告警列表
        await renderAlarmList(nodes);

        console.log('数据更新成功');
    } catch (e) {
        console.error('数据更新失败:', e);
        // 不影响当前数据展示
    }
}, 3 * 60 * 1000);

loadTopology();
</script>
