<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>配置中心</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; background:#f7f7f9; margin:0; color:#1f2328; }
      header { background:#1f2328; color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
      header .title { font-weight:600; }
      header .actions a { color:#fff; text-decoration:none; margin-left:12px; }
      .container { max-width:1200px; margin:20px auto; padding:0 16px; }
      .section { background:#fff; border:1px solid #eee; border-radius:8px; margin-bottom:18px; overflow:hidden; }
      .section h3 { margin:0; padding:12px 16px; background:#fafbfc; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
      .section .body { padding:16px; }
      .grid { display:grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap:12px; }
      .field { display:flex; flex-direction:column; }
      .field label { font-size:13px; color:#333; margin-bottom:6px; }
      .field input, .field select { padding:8px; border:1px solid #ddd; border-radius:6px; }
      .btn { display:inline-block; padding:8px 12px; background:#2b6ef3; color:#fff; border:none; border-radius:6px; cursor:pointer; }
      .btn.secondary { background:#6a737d; }
      .muted { color:#666; font-size:13px; }
      .msg { margin-top:8px; min-height:20px; color:#b00; }
      .ok { color:#0a7; }
      .list { margin-top:8px; }
      .list-item { display:flex; align-items:center; justify-content:space-between; padding:8px 0; border-bottom:1px solid #f0f0f0; gap:12px; }
      .list-main { display:flex; align-items:center; gap:8px; min-width:0; }
      .list-title { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      textarea.config-json { width:100%; min-height:360px; padding:10px; border:1px solid #ddd; border-radius:6px; font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:12px; line-height:1.45; box-sizing:border-box; }
      .modal-mask { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35); align-items:center; justify-content:center; }
      .modal-card { background:#fff; border-radius:8px; padding:16px; width:640px; max-width:90%; }
    </style>
  </head>
  <body>
    <header>
      <div class="title">配置中心</div>
      <div class="actions">
        <a href="/topology/">架构视图</a>
        <a href="/topology/" id="logout-link">退出登录</a>
      </div>
    </header>

    <div class="container">
      <p class="muted">这里仅保留架构视图正在使用的配置：拓扑标题、组配置、架构配置。</p>
      <div id="globalMsg" class="msg"></div>

      <div class="section" id="sec-global">
        <h3>
          <span>全局配置（topology_config）</span>
          <span>
            <button class="btn" id="save-global-config">保存</button>
            <button class="btn secondary" id="backup-global-config">备份</button>
            <button class="btn secondary" id="toggle-hist-global">历史配置</button>
            <button class="btn secondary" id="refresh-global-config">刷新</button>
          </span>
        </h3>
        <div class="body">
          <div class="grid">
            <div class="field">
              <label>拓扑标题</label>
              <input id="topo-title" placeholder="例如：智谱集群拓扑监控" />
            </div>
            <div class="field">
              <label>显示管理接口（MEth/Mgmt）</label>
              <input type="checkbox" id="display-show-meth" />
            </div>
          </div>
          <div class="muted" style="margin-top:10px;">“拓扑标题”会直接作用到架构视图页标题和浏览器标题。</div>
          <div class="list" id="hist-global" style="display:none;"></div>
          <div class="msg" id="msg-global"></div>
        </div>
      </div>

      <div class="section" id="sec-groups">
        <h3>
          <span>组配置（group_rules.json）</span>
          <span>
            <button class="btn" id="new-group">新建组</button>
            <button class="btn secondary" id="delete-groups">批量删除</button>
            <button class="btn" id="save-groups">保存</button>
            <button class="btn secondary" id="backup-groups">备份</button>
            <button class="btn secondary" id="toggle-hist-groups">历史配置</button>
            <button class="btn secondary" id="refresh-groups">刷新</button>
          </span>
        </h3>
        <div class="body">
          <div id="groups-list" class="list"></div>
          <div class="list" id="hist-groups" style="display:none;"></div>
          <div class="msg" id="msg-groups"></div>
        </div>
      </div>

      <div class="section" id="sec-architecture">
        <h3>
          <span>架构视图配置（architecture_config.json）</span>
          <span>
            <button class="btn" id="save-architecture">保存</button>
            <button class="btn secondary" id="backup-architecture">备份</button>
            <button class="btn secondary" id="toggle-hist-architecture">历史配置</button>
            <button class="btn secondary" id="refresh-architecture">刷新</button>
          </span>
        </h3>
        <div class="body">
          <p class="muted">用于配置架构视图的分区、集群、角色、刷新周期与布局。include/exclude 支持 ID 列表与正则。</p>
          <div class="grid" style="margin-bottom:12px;">
            <div class="field">
              <label for="architecture-sidebar-open">默认打开集群信息面板</label>
              <input type="checkbox" id="architecture-sidebar-open" />
            </div>
          </div>
          <textarea id="architecture-json" class="config-json"></textarea>
          <div class="list" id="hist-architecture" style="display:none;"></div>
          <div class="msg" id="msg-architecture"></div>
        </div>
      </div>
    </div>

    <div id="group-modal" class="modal-mask">
      <div class="modal-card">
        <h3 style="margin:0 0 10px 0;">编辑组属性</h3>
        <div class="grid">
          <div class="field"><label>组 ID</label><input id="gm-id" placeholder="唯一 ID" /></div>
          <div class="field"><label>组名称</label><input id="gm-name" placeholder="显示名称" /></div>
          <div class="field"><label>组图标 URL</label><input id="gm-icon" placeholder="例如：icons/sigle-sw.png" /></div>
          <div class="field"><label>颜色（十六进制）</label><input id="gm-color" placeholder="#3478f6" /></div>
        </div>
        <div class="grid" style="margin-top:8px;">
          <div class="field"><label>包含 ID（逗号分隔）</label><input id="gm-include-ids" placeholder="id1,id2" /></div>
          <div class="field"><label>包含正则（逗号分隔）</label><input id="gm-include-re" placeholder="^CORE\\d+-\\d+$,pod5" /></div>
          <div class="field"><label>排除 ID（逗号分隔）</label><input id="gm-exclude-ids" placeholder="idA,idB" /></div>
          <div class="field"><label>排除正则（逗号分隔）</label><input id="gm-exclude-re" placeholder="leaf1|leaf2" /></div>
        </div>
        <div class="grid" style="margin-top:8px;">
          <div class="field">
            <label>强制状态（可空）</label>
            <select id="gm-forced">
              <option value="">(空)</option>
              <option value="UP">UP</option>
              <option value="DOWN">DOWN</option>
            </select>
          </div>
          <div class="field"><label>覆盖图标 URL（可空）</label><input id="gm-override-icon" placeholder="留空使用组图标" /></div>
        </div>
        <div style="margin-top:12px; display:flex; gap:8px; justify-content:flex-end;">
          <button class="btn secondary" id="gm-cancel">取消</button>
          <button class="btn" id="gm-save">保存</button>
        </div>
        <div class="msg" id="gm-msg"></div>
      </div>
    </div>

    <script>
      let token = localStorage.getItem('token');
      const apiBase = '/topology/api';

      function getAuthHeaders() {
        return token ? { Authorization: 'Bearer ' + token } : {};
      }

      function clearAuth() {
        token = null;
        try {
          localStorage.removeItem('token');
          localStorage.removeItem('token_time');
          localStorage.removeItem('edit_mode');
        } catch (_) {}
      }

      function redirectToLogin() {
        const next = encodeURIComponent('/topology/config.html');
        window.location.href = `/topology/login.html?next=${next}`;
      }

      async function ensureAuthenticated() {
        if (!token) {
          redirectToLogin();
          return false;
        }
        const resp = await fetch(`${apiBase}/auth/check`, { headers: { ...getAuthHeaders() } }).catch(() => null);
        if (!resp || !resp.ok) {
          clearAuth();
          redirectToLogin();
          return false;
        }
        return true;
      }

      async function fetchJSON(url) {
        const resp = await fetch(url, { headers: { ...getAuthHeaders() } });
        if (resp.status === 404) return {};
        const data = await resp.text();
        try { return JSON.parse(data); } catch { return {}; }
      }

      async function putConfig(name, obj) {
        const resp = await fetch(`${apiBase}/config/${name}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
          body: JSON.stringify(obj)
        });
        const data = await resp.json().catch(() => ({}));
        if (resp.status === 401) {
          clearAuth();
          redirectToLogin();
          throw new Error('未登录或登录已过期');
        }
        if (!resp.ok) throw new Error(data.error || '保存失败');
        return data;
      }

      async function loadHistory(name, container) {
        container.innerHTML = '';
        const resp = await fetch(`${apiBase}/history/${name}`, { headers: { ...getAuthHeaders() } });
        if (resp.status === 401) {
          clearAuth();
          redirectToLogin();
          return;
        }
        if (!resp.ok) { container.textContent = '无法加载历史'; return; }
        const data = await resp.json().catch(() => ({}));
        const entries = data.entries || [];
        if (!entries.length) { container.textContent = '暂无历史'; return; }
        for (const entry of entries) {
          const div = document.createElement('div');
          div.className = 'list-item';
          const left = document.createElement('div');
          left.textContent = `${entry.timestamp} (${entry.size} 字节)`;
          const btn = document.createElement('button');
          btn.className = 'btn secondary';
          btn.textContent = '回滚';
          btn.addEventListener('click', async () => {
            const ok = confirm(`回滚到 ${entry.timestamp} ？`);
            if (!ok) return;
            const r = await fetch(`${apiBase}/history/${name}/rollback`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', ...getAuthHeaders() },
              body: JSON.stringify({ timestamp: entry.timestamp })
            });
            if (r.status === 401) {
              clearAuth();
              redirectToLogin();
              return;
            }
            if (!r.ok) return;
            if (name === 'topology_config') await refreshGlobalConfig();
            if (name === 'group_rules') await refreshGroupsUI();
            if (name === 'architecture') await refreshArchitectureConfig();
          });
          div.appendChild(left);
          div.appendChild(btn);
          container.appendChild(div);
        }
      }

      async function backupConfig(name, msgId, histId) {
        const msg = document.getElementById(msgId);
        msg.textContent = '';
        msg.className = 'msg';
        try {
          const resp = await fetch(`${apiBase}/history/${name}/backup`, { method: 'POST', headers: { ...getAuthHeaders() } });
          const data = await resp.json().catch(() => ({}));
          if (resp.status === 401) {
            clearAuth();
            redirectToLogin();
            return;
          }
          if (!resp.ok) throw new Error(data.error || '备份失败');
          msg.textContent = '备份成功';
          msg.className = 'msg ok';
          await loadHistory(name, document.getElementById(histId));
        } catch (e) {
          msg.textContent = e && e.message ? e.message : '备份失败';
        }
      }

      async function toggleHistory(name, containerId) {
        const el = document.getElementById(containerId);
        if (!el) return;
        const isHidden = el.style.display === 'none' || el.style.display === '';
        if (isHidden) {
          el.style.display = 'block';
          await loadHistory(name, el);
        } else {
          el.style.display = 'none';
        }
      }

      async function refreshGlobalConfig() {
        const msg = document.getElementById('msg-global');
        msg.textContent = '';
        msg.className = 'msg';
        try {
          const resp = await fetch('/topology/api/config/topology_config', { headers: { ...getAuthHeaders() } });
          if (!resp.ok) {
            msg.textContent = resp.status === 401 ? '未登录或令牌失效，无法加载全局配置' : ('无法加载全局配置（HTTP ' + resp.status + '）');
            return;
          }
          const cfg = await resp.json().catch(() => ({}));
          document.getElementById('topo-title').value = typeof cfg.title === 'string' ? cfg.title : '';
          const display = (cfg && cfg.display) || {};
          document.getElementById('display-show-meth').checked = display.showMethInterfaces === true;
        } catch (e) {
          msg.textContent = '加载全局配置失败：' + (e && e.message ? e.message : String(e));
        }
      }

      async function saveGlobalConfig() {
        const msg = document.getElementById('msg-global');
        msg.textContent = '';
        msg.className = 'msg';
        try {
          const cfg = await fetchJSON('/topology/api/config/topology_config');
          cfg.title = document.getElementById('topo-title').value.trim();
          cfg.display = cfg.display || {};
          cfg.display.showMethInterfaces = !!document.getElementById('display-show-meth').checked;
          await putConfig('topology_config', cfg);
          msg.textContent = '保存成功';
          msg.className = 'msg ok';
          localStorage.setItem('topo_config_updated', String(Date.now()));
        } catch (e) {
          msg.textContent = e && e.message ? e.message : '保存失败';
        }
      }

      let groupRules = { version: 1, updatedAt: '', groups: [] };
      let selectedGroupIds = new Set();

      function renderGroupsList() {
        const container = document.getElementById('groups-list');
        container.innerHTML = '';
        const groups = groupRules.groups || [];
        if (!groups.length) {
          container.textContent = '暂无组配置';
          return;
        }
        for (const group of groups) {
          const li = document.createElement('div');
          li.className = 'list-item';
          const main = document.createElement('div');
          main.className = 'list-main';
          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.checked = selectedGroupIds.has(group.id);
          chk.addEventListener('change', () => {
            if (chk.checked) selectedGroupIds.add(group.id);
            else selectedGroupIds.delete(group.id);
          });
          const title = document.createElement('div');
          title.className = 'list-title';
          const includeCount = (group.include_ids?.length || 0) + (group.include_regex?.length || 0);
          title.textContent = `${group.name || group.id} · ID:${group.id} · 匹配项:${includeCount}`;
          main.appendChild(chk);
          main.appendChild(title);

          const actions = document.createElement('div');
          const btnEdit = document.createElement('button');
          btnEdit.className = 'btn';
          btnEdit.textContent = '编辑';
          btnEdit.addEventListener('click', () => openGroupModal(group));
          const btnDel = document.createElement('button');
          btnDel.className = 'btn secondary';
          btnDel.textContent = '删除';
          btnDel.style.marginLeft = '8px';
          btnDel.addEventListener('click', () => {
            const ok = confirm(`删除组 ${group.name || group.id} ？`);
            if (!ok) return;
            groupRules.groups = groups.filter(item => item.id !== group.id);
            selectedGroupIds.delete(group.id);
            renderGroupsList();
          });
          actions.appendChild(btnEdit);
          actions.appendChild(btnDel);

          li.appendChild(main);
          li.appendChild(actions);
          container.appendChild(li);
        }
      }

      function batchDeleteGroups() {
        const msg = document.getElementById('msg-groups');
        msg.textContent = '';
        msg.className = 'msg';
        const ids = Array.from(selectedGroupIds);
        if (!ids.length) {
          msg.textContent = '请先勾选要删除的组';
          return;
        }
        const ok = confirm(`确认批量删除 ${ids.length} 个组？`);
        if (!ok) return;
        groupRules.groups = (groupRules.groups || []).filter(group => !selectedGroupIds.has(group.id));
        selectedGroupIds = new Set();
        renderGroupsList();
        msg.textContent = `已删除 ${ids.length} 个组，请点击“保存”写入服务器`;
        msg.className = 'msg ok';
      }

      function openGroupModal(group) {
        document.getElementById('gm-msg').textContent = '';
        const isNew = !group;
        const modal = document.getElementById('group-modal');
        modal.style.display = 'flex';
        document.getElementById('gm-id').value = group?.id || '';
        document.getElementById('gm-name').value = group?.name || '';
        document.getElementById('gm-icon').value = group?.icon_url || '';
        document.getElementById('gm-color').value = group?.style_override?.color || '';
        document.getElementById('gm-include-ids').value = (group?.include_ids || []).join(',');
        document.getElementById('gm-include-re').value = (group?.include_regex || []).join(',');
        document.getElementById('gm-exclude-ids').value = (group?.exclude_ids || []).join(',');
        document.getElementById('gm-exclude-re').value = (group?.exclude_regex || []).join(',');
        document.getElementById('gm-forced').value = group?.style_override?.forcedStatus || '';
        document.getElementById('gm-override-icon').value = group?.style_override?.icon_url || '';
        document.getElementById('gm-save').onclick = () => saveGroupFromModal(isNew ? null : group.id);
      }

      function saveGroupFromModal(editId) {
        const msgEl = document.getElementById('gm-msg');
        msgEl.textContent = '';
        const id = document.getElementById('gm-id').value.trim();
        const name = document.getElementById('gm-name').value.trim();
        if (!id || !name) {
          msgEl.textContent = 'ID 与 名称不能为空';
          return;
        }
        const toArr = (value) => value ? value.split(',').map(item => item.trim()).filter(Boolean) : [];
        const groupObj = {
          id,
          name,
          icon_url: document.getElementById('gm-icon').value.trim(),
          include_ids: toArr(document.getElementById('gm-include-ids').value.trim()),
          include_regex: toArr(document.getElementById('gm-include-re').value.trim()),
          exclude_ids: toArr(document.getElementById('gm-exclude-ids').value.trim()),
          exclude_regex: toArr(document.getElementById('gm-exclude-re').value.trim()),
          style_override: {
            forcedStatus: document.getElementById('gm-forced').value.trim() || null,
            color: document.getElementById('gm-color').value.trim() || null,
            icon_url: document.getElementById('gm-override-icon').value.trim() || null
          }
        };
        const exists = (groupRules.groups || []).find(item => item.id === id);
        if (!editId && exists) {
          msgEl.textContent = '该 ID 已存在';
          return;
        }
        const current = groupRules.groups || [];
        if (editId && editId !== id) {
          groupRules.groups = [...current.filter(item => item.id !== editId), groupObj];
        } else if (editId || exists) {
          groupRules.groups = current.map(item => item.id === (editId || id) ? groupObj : item);
        } else {
          groupRules.groups = [...current, groupObj];
        }
        document.getElementById('group-modal').style.display = 'none';
        renderGroupsList();
      }

      async function refreshGroupsUI() {
        const msg = document.getElementById('msg-groups');
        msg.textContent = '';
        msg.className = 'msg';
        try {
          const resp = await fetch('/topology/api/config/group_rules', { headers: { ...getAuthHeaders() } });
          if (!resp.ok) {
            msg.textContent = resp.status === 401 ? '未登录或令牌失效，无法加载组配置' : ('无法加载组配置（HTTP ' + resp.status + '）');
            return;
          }
          const data = await resp.json().catch(() => ({}));
          groupRules = data && data.groups ? data : { version: 1, updatedAt: '', groups: [] };
          selectedGroupIds = new Set(Array.from(selectedGroupIds).filter(id => (groupRules.groups || []).some(group => group.id === id)));
          renderGroupsList();
        } catch (e) {
          msg.textContent = '加载组配置失败：' + (e && e.message ? e.message : String(e));
        }
      }

      async function saveGroupsToJSON() {
        const msg = document.getElementById('msg-groups');
        msg.textContent = '';
        msg.className = 'msg';
        const obj = { ...groupRules, version: groupRules.version || 1, updatedAt: new Date().toISOString() };
        try {
          await putConfig('group_rules', obj);
          msg.textContent = '保存成功';
          msg.className = 'msg ok';
          await refreshGroupsUI();
        } catch (e) {
          msg.textContent = e && e.message ? e.message : '保存失败';
        }
      }

      async function refreshArchitectureConfig() {
        const msg = document.getElementById('msg-architecture');
        const ta = document.getElementById('architecture-json');
        msg.textContent = '';
        msg.className = 'msg';
        try {
          const resp = await fetch('/topology/api/config/architecture', { headers: { ...getAuthHeaders() } });
          if (!resp.ok) {
            msg.textContent = resp.status === 401 ? '未登录或令牌失效，无法加载架构配置' : ('无法加载架构配置（HTTP ' + resp.status + '）');
            return;
          }
          const obj = await resp.json().catch(() => ({}));
          ta.value = JSON.stringify(obj, null, 2);
          syncArchitectureSidebarControls(obj);
        } catch (e) {
          msg.textContent = '加载架构配置失败：' + (e && e.message ? e.message : String(e));
        }
      }

      function syncArchitectureSidebarControls(obj) {
        const sidebar = (obj && obj.sidebar) || {};
        document.getElementById('architecture-sidebar-open').checked = sidebar.enabled !== false && sidebar.default_collapsed !== true;
      }

      function applyArchitectureSidebarControls(obj) {
        obj.sidebar = obj.sidebar || {};
        obj.sidebar.enabled = true;
        obj.sidebar.default_collapsed = !document.getElementById('architecture-sidebar-open').checked;
        return obj;
      }

      async function saveArchitectureConfig() {
        const msg = document.getElementById('msg-architecture');
        const ta = document.getElementById('architecture-json');
        msg.textContent = '';
        msg.className = 'msg';
        let obj;
        try {
          obj = JSON.parse(ta.value);
        } catch (e) {
          msg.textContent = 'JSON 格式错误：' + e.message;
          return;
        }
        obj = applyArchitectureSidebarControls(obj);
        obj.version = obj.version || 1;
        obj.updatedAt = new Date().toISOString();
        try {
          await putConfig('architecture', obj);
          msg.textContent = '保存成功';
          msg.className = 'msg ok';
          await refreshArchitectureConfig();
        } catch (e) {
          msg.textContent = e && e.message ? e.message : '保存失败';
        }
      }

      document.getElementById('architecture-sidebar-open').addEventListener('change', () => {
        const ta = document.getElementById('architecture-json');
        try {
          const obj = JSON.parse(ta.value || '{}');
          ta.value = JSON.stringify(applyArchitectureSidebarControls(obj), null, 2);
        } catch (_) {}
      });

      document.getElementById('save-global-config').addEventListener('click', saveGlobalConfig);
      document.getElementById('backup-global-config').addEventListener('click', () => backupConfig('topology_config', 'msg-global', 'hist-global'));
      document.getElementById('toggle-hist-global').addEventListener('click', () => toggleHistory('topology_config', 'hist-global'));
      document.getElementById('refresh-global-config').addEventListener('click', refreshGlobalConfig);

      document.getElementById('save-groups').addEventListener('click', saveGroupsToJSON);
      document.getElementById('delete-groups').addEventListener('click', batchDeleteGroups);
      document.getElementById('backup-groups').addEventListener('click', () => backupConfig('group_rules', 'msg-groups', 'hist-groups'));
      document.getElementById('toggle-hist-groups').addEventListener('click', () => toggleHistory('group_rules', 'hist-groups'));
      document.getElementById('refresh-groups').addEventListener('click', refreshGroupsUI);
      document.getElementById('new-group').addEventListener('click', () => openGroupModal(null));

      document.getElementById('save-architecture').addEventListener('click', saveArchitectureConfig);
      document.getElementById('backup-architecture').addEventListener('click', () => backupConfig('architecture', 'msg-architecture', 'hist-architecture'));
      document.getElementById('toggle-hist-architecture').addEventListener('click', () => toggleHistory('architecture', 'hist-architecture'));
      document.getElementById('refresh-architecture').addEventListener('click', refreshArchitectureConfig);

      document.getElementById('gm-cancel').addEventListener('click', () => {
        document.getElementById('group-modal').style.display = 'none';
      });

      document.getElementById('logout-link').addEventListener('click', (e) => {
        e.preventDefault();
        clearAuth();
        redirectToLogin();
      });

      (async function init() {
        if (!(await ensureAuthenticated())) return;
        await refreshGlobalConfig();
        await refreshGroupsUI();
        await refreshArchitectureConfig();
      })();
    </script>
  </body>
</html>
