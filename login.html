<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Arial, sans-serif; padding: 24px; background:#f7f7f9; }
      .card { max-width: 420px; margin: 64px auto; background:#fff; border:1px solid #eee; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
      .card h2 { margin:0; padding: 16px 20px; border-bottom:1px solid #eee; }
      .card .body { padding: 20px; }
      label { display:block; margin: 12px 0 6px; color:#333; }
      input { width:100%; padding:10px 12px; border:1px solid #ccc; border-radius:6px; }
      button { width:100%; margin-top: 16px; padding:10px 12px; background:#2b6ef3; color:#fff; border:none; border-radius:6px; cursor:pointer; }
      button:disabled{ opacity:.6; cursor:not-allowed; }
      .msg { margin-top:12px; color:#b00; min-height:20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>登录</h2>
      <div class="body">
        <label for="username">用户名</label>
        <input id="username" type="text" autocomplete="username" />
        <label for="password">密码</label>
        <input id="password" type="password" autocomplete="current-password" />
        <button id="loginBtn">登录</button>
        <div class="msg" id="msg"></div>
      </div>
    </div>

    <script>
      const btn = document.getElementById('loginBtn');
      const msg = document.getElementById('msg');
      btn.addEventListener('click', async () => {
        msg.textContent = '';
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!username || !password) { msg.textContent = '请输入用户名和密码'; return; }
        btn.disabled = true;
        try {
          const resp = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          const data = await resp.json();
          if (!resp.ok) { throw new Error(data.error || '登录失败'); }
          localStorage.setItem('token', data.token);
          // 记录登录时间，用于免登录窗口
          try { localStorage.setItem('token_time', String(Date.now())); } catch (e) { /* ignore */ }
          location.href = '/config.html';
        } catch (e) {
          msg.textContent = e.message || String(e);
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
  </html>
