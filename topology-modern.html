<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>集群网络拓扑 - 架构视图</title>
  <script src="https://unpkg.com/animejs@3.2.2/lib/anime.min.js"></script>
  <style>
    :root {
      --bg: #08111f;
      --surface: #0f172a;
      --panel: #111827;
      --panel-2: #172033;
      --line: #263245;
      --line-strong: #39516f;
      --text: #e5edf7;
      --muted: #91a0b6;
      --accent: #22d3ee;
      --ok: #22c55e;
      --bad: #ef4444;
      --warn: #f59e0b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      grid-template-rows: 56px minmax(0, 1fr);
      height: 100vh;
    }
    .shell.sidebar-collapsed {
      grid-template-columns: minmax(0, 1fr) 0;
    }
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #0f172a;
    }
    .title {
      display: flex;
      align-items: baseline;
      gap: 14px;
      min-width: 0;
    }
    .title h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: #67e8f9;
      letter-spacing: 0;
    }
    .title span {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      white-space: nowrap;
    }
    .actions a,
    .actions button {
      color: var(--text);
      background: #1f2937;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 7px 10px;
      text-decoration: none;
      cursor: pointer;
    }
    .actions a:hover,
    .actions button:hover {
      border-color: var(--accent);
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      -webkit-user-select: none;
      user-select: none;
    }
    .toggle input { margin: 0; }
    .stage {
      position: relative;
      overflow: auto;
      background: #08111f;
    }
    .info-fab {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #e0f2fe;
      background: rgba(8, 17, 31, .92);
      border: 1px solid rgba(34, 211, 238, .45);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
    }
    .info-fab:hover {
      border-color: var(--accent);
      background: rgba(15, 32, 51, .96);
    }
    .info-fab svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }
    .shell:not(.sidebar-collapsed) .info-fab {
      padding: 8px 12px;
      background: rgba(15, 23, 42, .82);
    }
    .shell:not(.sidebar-collapsed) .info-fab span:last-child {
      display: none;
    }
    .canvas-wrap {
      position: relative;
      min-width: 1180px;
      min-height: 760px;
      width: 100%;
      height: 100%;
    }
    svg#topology-svg {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 760px;
    }
    .side {
      border-left: 1px solid var(--line);
      background: #0f172a;
      overflow: auto;
      padding: 14px;
    }
    .shell.sidebar-collapsed .side {
      display: none;
    }
    .side-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .side-head h2 {
      margin: 0;
      color: #67e8f9;
      font-size: 15px;
    }
    .side-toggle {
      color: #67e8f9;
      background: #172033;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .side-toggle:hover { border-color: var(--accent); }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .metric {
      appearance: none;
      text-align: left;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
    }
    .metric:hover,
    .metric.active {
      border-color: var(--accent);
      background: #132033;
    }
    .metric b {
      display: block;
      font-size: 18px;
      color: #f8fafc;
    }
    .metric span {
      color: var(--muted);
      font-size: 12px;
    }
    .section {
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .section h2 {
      margin: 0 0 10px;
      color: #67e8f9;
      font-size: 15px;
    }
    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 7px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .legend-line {
      width: 72px;
      height: 3px;
      border-radius: 99px;
      background: var(--line);
    }
    .detail {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
      word-break: break-word;
    }
    .detail-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .detail-title b {
      color: #f8fafc;
      font-size: 14px;
    }
    .detail-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .detail-btn {
      color: #67e8f9;
      background: #172033;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      cursor: pointer;
    }
    .detail-btn:hover { border-color: var(--accent); }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 8px 0;
    }
    .info-item {
      background: rgba(17, 24, 39, .72);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
    }
    .info-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
    }
    .info-item b {
      color: #f8fafc;
      font-size: 13px;
      font-weight: 600;
    }
    .list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }
    .list-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: rgba(17, 24, 39, .55);
      cursor: pointer;
    }
    .list-row:hover { border-color: var(--accent); }
    .list-row strong {
      color: #f8fafc;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .list-row small {
      display: block;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      height: 22px;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 11px;
      color: #dbeafe;
      background: #1e293b;
      border: 1px solid #334155;
    }
    .badge.ok { color: #bbf7d0; border-color: rgba(34,197,94,.45); background: rgba(22,101,52,.25); }
    .badge.bad { color: #fecaca; border-color: rgba(239,68,68,.45); background: rgba(127,29,29,.25); }
    .badge.warn { color: #fde68a; border-color: rgba(245,158,11,.45); background: rgba(120,53,15,.25); }
    .detail-table-wrap {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-top: 8px;
    }
    .port-table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      color: #dbeafe;
      background: rgba(15, 23, 42, .72);
    }
    .port-table th,
    .port-table td {
      border-bottom: 1px solid var(--line);
      padding: 6px 7px;
      text-align: left;
      font-size: 12px;
      white-space: nowrap;
    }
    .port-table th {
      color: #93c5fd;
      font-weight: 600;
      background: #111827;
    }
    .port-table tr:last-child td { border-bottom: 0; }
    .port-up { color: var(--ok); }
    .port-down { color: var(--bad); }
    .port-muted { color: var(--muted); }
    .alarm-row { background: rgba(127, 29, 29, .22); }
    .peer-stack {
      display: grid;
      gap: 4px;
    }
    .peer-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #dbeafe;
      background: rgba(15, 23, 42, .55);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 6px;
    }
    .peer-chip small {
      color: var(--muted);
    }
    .zone-label {
      fill: #f8fafc;
      font-size: 15px;
      font-weight: 700;
    }
    .zone-sub {
      fill: #94a3b8;
      font-size: 11px;
    }
    .zone-bg {
      fill: #0f1a2d;
      stroke: #263245;
      stroke-width: 1;
      rx: 8;
    }
    .cluster-bg {
      fill: rgba(15, 23, 42, .36);
      stroke: rgba(100, 116, 139, .3);
      stroke-width: 1;
      stroke-dasharray: 5 5;
    }
    .cluster-label {
      fill: #93c5fd;
      font-size: 11px;
      font-weight: 700;
    }
    .cluster-label.shared { fill: #cbd5e1; }
    .cluster-label.ali { fill: #67e8f9; }
    .cluster-label.zp { fill: #c4b5fd; }
    .node-card {
      cursor: pointer;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.25));
      opacity: .96;
      transition: opacity .18s ease;
    }
    .node-card.dimmed {
      opacity: .28;
    }
    .node-card.connected .node-rect,
    .node-card.selected .node-rect {
      stroke: #67e8f9;
      stroke-width: 2;
    }
    .node-card.selected {
      filter: drop-shadow(0 0 12px rgba(34, 211, 238, .5));
    }
    .node-rect {
      fill: #172033;
      stroke: #38506d;
      stroke-width: 1.2;
      rx: 7;
    }
    .node-card.down .node-rect {
      fill: #2a1218;
      stroke: #ef4444;
    }
    .node-card.group .node-rect {
      fill: #102a3a;
      stroke: #0ea5e9;
    }
    .node-card.device .node-rect {
      fill: #161d2d;
      stroke: #7c93b6;
    }
    .node-title {
      fill: #f8fafc;
      font-size: 12px;
      font-weight: 700;
      pointer-events: none;
      text-anchor: middle;
    }
    .node-meta {
      fill: #94a3b8;
      font-size: 10px;
      pointer-events: none;
      text-anchor: middle;
    }
    .node-dot {
      stroke: rgba(255,255,255,.35);
      stroke-width: 1;
    }
    .node-dot.alarm {
      fill: var(--bad);
      animation: alarmPulse 1.8s ease-in-out infinite;
    }
    .switch-icon-body {
      stroke: rgba(224, 242, 254, .62);
      stroke-width: 1.2;
    }
    .switch-icon-mark {
      fill: none;
      stroke: #e0f2fe;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .node-card.down .switch-icon-body {
      stroke: rgba(254, 202, 202, .8);
    }
    .link {
      fill: none;
      stroke-linecap: round;
      opacity: .62;
      cursor: pointer;
      pointer-events: stroke;
      vector-effect: non-scaling-stroke;
    }
    .link-underlay {
      fill: none;
      stroke: rgba(8, 17, 31, .9);
      stroke-linecap: round;
      opacity: .82;
      pointer-events: none;
      vector-effect: non-scaling-stroke;
    }
    .link:hover {
      opacity: 1;
      filter: drop-shadow(0 0 6px rgba(34,211,238,.6));
    }
    .link.down {
      opacity: .92;
      stroke-dasharray: 8 6;
      animation: linkAlarm 1.8s ease-in-out infinite;
    }
    .link.dimmed,
    .link-underlay.dimmed {
      opacity: .12;
    }
    .link.connected {
      opacity: .95;
    }
    .link-focus {
      fill: none;
      stroke-linecap: round;
      pointer-events: stroke;
      filter: drop-shadow(0 0 8px rgba(34, 211, 238, .55));
      vector-effect: non-scaling-stroke;
    }
    .link-focus.down {
      stroke-dasharray: 8 6;
      animation: linkAlarm 1.8s ease-in-out infinite;
    }
    @keyframes alarmPulse {
      0%, 100% { opacity: .45; }
      50% { opacity: 1; }
    }
    @keyframes linkAlarm {
      0%, 100% { opacity: .55; }
      50% { opacity: 1; }
    }
    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: rgba(8,17,31,.7);
      z-index: 3;
    }
    .link-fs {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      overflow: auto;
      padding: 16px;
      color: var(--text);
      background: #0f172a;
    }
    .link-fs .port-table {
      min-width: 1180px;
    }
    @media (max-width: 768px) {
      .shell {
        grid-template-columns: 1fr;
        grid-template-rows: 56px minmax(0, 1fr) 280px;
      }
      .side {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
      .canvas-wrap {
        min-width: 980px;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title">
        <h1 id="page-title">集群网络拓扑 - 架构视图</h1>
        <span id="subtitle">分区聚合视图</span>
      </div>
      <div class="actions">
        <label class="toggle"><input type="checkbox" id="toggle-meth" />显示管理接口</label>
        <button id="reload">刷新</button>
        <a href="/topology/config.html">管理后台</a>
      </div>
    </header>
    <main class="stage">
      <div class="canvas-wrap">
        <svg id="topology-svg" role="img" aria-label="架构拓扑图"></svg>
        <div id="loading" class="loading">正在加载拓扑数据...</div>
        <button id="info-toggle" class="info-fab" type="button" aria-label="切换集群信息">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 3a9 9 0 1 1 0 18a9 9 0 0 1 0-18Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M12 10.2v5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="7.4" r="1.1" fill="currentColor"/>
          </svg>
          <span>集群信息</span>
        </button>
      </div>
    </main>
    <aside class="side">
      <div class="side-head">
        <h2>集群信息</h2>
        <button id="side-toggle" class="side-toggle" type="button">隐藏</button>
      </div>
      <div class="metric-grid">
        <button class="metric" data-metric="devices"><b id="metric-devices">-</b><span>设备</span></button>
        <button class="metric" data-metric="links"><b id="metric-links">-</b><span>聚合链路</span></button>
        <button class="metric" data-metric="down"><b id="metric-down">-</b><span>故障设备</span></button>
        <button class="metric" data-metric="faults"><b id="metric-fault-links">-</b><span>故障链路</span></button>
        <button class="metric" data-metric="meth"><b id="metric-meth">-</b><span>隐藏管理</span></button>
      </div>
      <div class="section">
        <h2>链路图例</h2>
        <div class="legend-row"><span>400G</span><i class="legend-line" style="background:#06b6d4"></i></div>
        <div class="legend-row"><span>200G</span><i class="legend-line" style="background:#22c55e"></i></div>
        <div class="legend-row"><span>100G</span><i class="legend-line" style="background:#fb923c"></i></div>
        <div class="legend-row"><span>25G</span><i class="legend-line" style="background:#8b5cf6"></i></div>
        <div class="legend-row"><span>10G</span><i class="legend-line" style="background:#64748b"></i></div>
        <div class="legend-row"><span>DOWN</span><i class="legend-line" style="background:#ef4444;border-top:0"></i></div>
      </div>
      <div class="section">
        <h2>详情</h2>
        <div id="detail" class="detail">点击节点、链路或上方统计查看详情。</div>
      </div>
    </aside>
  </div>

  <script>
    const svg = document.getElementById('topology-svg');
    const loading = document.getElementById('loading');
    const methToggle = document.getElementById('toggle-meth');
    const stage = document.querySelector('.stage');
    const shell = document.querySelector('.shell');
    const state = {
      config: {},
      groupRules: { groups: [] },
      architectureConfig: null,
      baseConfig: {},
      topology: { nodes: [] },
      links: [],
      faultIndex: { rawDown: new Set(), nodeFaultLinks: new Set(), portFaults: new Map(), downNodeIds: new Set() },
      showMeth: false,
      displayNodes: [],
      displayLinks: [],
      peerIndex: new Map(),
      hiddenMethLinks: 0,
      lastLoadedAt: null,
      dataUpdatedAt: null,
      sidebarCollapsed: false,
      sidebarAutoOpened: false,
      detailHistory: []
    };
    const SYNTHETIC_GROUPS = {
      mgmt: '__fallback-mgmt-devices__',
      compute: '__fallback-compute-devices__',
      mgmtAccess: '__mgmt-access-devices__',
      oobAgg: '__oob-aggregate-devices__',
      oobAccess: '__oob-access-devices__',
      storage: '__storage-devices__'
    };
    const SPECIAL_OOB_AGG_IDS = new Set([
      'NXDX01201F06--E02-03-25GYW-AGG2',
      'NXDX01201F06-E02-01-25GYW-AGG1',
      'NXDX01201F06-E02-09-100GPubic-AGG1',
      'NXDXA01FO2-FO2-03-25-ALIzhuanxian',
      'NXDXA01FO2-FO2-03-25-huoshanzhuanxian'
    ]);

    const DEFAULT_ARCHITECTURE_CONFIG = {
      version: 1,
      refresh_ms: 360000,
      sidebar: { enabled: true, default_collapsed: false },
      layout: { rows: [['default']] },
      zones: [{ id: 'default', title: '默认分区', subtitle: '', column: 'left', minH: 260, default: true, role_titles: {}, layout_template: 'stack', section_rules: [] }],
      clusters: [{ id: 'default', title: '集群', order: 1, default: true }],
      roles: [{ id: 'access', title: '接入', order: 1, default: true }]
    };
    let zoneDefinitions = DEFAULT_ARCHITECTURE_CONFIG.zones.slice();
    let activeZones = [];
    let activeDetail = { type: 'overview' };
    let selectedDisplayNodeId = '';
    let focusLinkLayer = null;

    function $(id) { return document.getElementById(id); }
    function esc(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    async function fetchJSON(path, fallback) {
      try {
        const sep = path.includes('?') ? '&' : '?';
        const res = await fetch(path + sep + 't=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return fallback;
        return await res.json();
      } catch (e) {
        return fallback;
      }
    }

    async function fetchJSONWithMeta(path, fallback) {
      try {
        const sep = path.includes('?') ? '&' : '?';
        const res = await fetch(path + sep + 't=' + Date.now(), { cache: 'no-store' });
        if (!res.ok) return { data: fallback, updatedAt: null };
        const lastModified = res.headers.get('Last-Modified');
        const updatedAt = lastModified ? new Date(lastModified) : null;
        return { data: await res.json(), updatedAt: updatedAt && !Number.isNaN(updatedAt.getTime()) ? updatedAt : null };
      } catch (e) {
        return { data: fallback, updatedAt: null };
      }
    }

    function formatDateTime(date) {
      if (!date) return '';
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}`;
    }

    function latestDate(...dates) {
      return dates.filter(Boolean).sort((a, b) => b.getTime() - a.getTime())[0] || null;
    }

    function mergeProfile(base) {
      const params = new URLSearchParams(location.search);
      const profile = params.get('profile') || base.home_topology || 'main';
      const prof = base.profiles && base.profiles[profile] ? base.profiles[profile] : null;
      if (!prof) return base;
      const out = JSON.parse(JSON.stringify(base));
      ['title'].forEach(k => { if (typeof prof[k] !== 'undefined') out[k] = prof[k]; });
      ['default_icons', 'types', 'aliases', 'display', 'visibility'].forEach(k => {
        if (prof[k] && typeof prof[k] === 'object') out[k] = { ...(out[k] || {}), ...(prof[k] || {}) };
      });
      return out;
    }

    function normalizeName(value) {
      return String(value || '').trim();
    }

    function detailStateKey(detail) {
      const current = detail || { type: 'overview' };
      return [current.type || 'overview', current.id || '', current.metric || ''].join('::');
    }

    function cloneDetail(detail) {
      return detail ? { ...detail } : { type: 'overview' };
    }

    function rememberDetail(nextDetail) {
      const next = cloneDetail(nextDetail);
      const current = cloneDetail(activeDetail);
      if (detailStateKey(current) === detailStateKey(next)) return;
      state.detailHistory.push(current);
      if (state.detailHistory.length > 50) state.detailHistory.shift();
    }

    function detailBackButtonHtml() {
      if (!state.detailHistory.length) return '';
      return '<button id="detail-back" class="detail-btn" type="button">返回上一页</button>';
    }

    function detailActionsHtml(extraHtml) {
      const items = [detailBackButtonHtml(), extraHtml || ''].filter(Boolean);
      return items.length ? `<div class="detail-actions">${items.join('')}</div>` : '';
    }

    function bindDetailBackButton() {
      const btn = $('detail-back');
      if (!btn) return;
      btn.addEventListener('click', event => {
        event.stopPropagation();
        goBackDetail();
      });
    }

    function clearDetailPanel() {
      activeDetail = { type: 'overview' };
      selectedDisplayNodeId = '';
      applySelectionHighlight();
      setActiveMetric('');
      $('detail').textContent = '点击节点、链路或上方统计查看详情。';
      restoreAutoHiddenSidebar();
    }

    function goBackDetail() {
      const previous = state.detailHistory.pop();
      if (!previous || previous.type === 'overview') {
        clearDetailPanel();
        return;
      }
      renderDetailState(previous);
    }

    function renderDetailState(detail) {
      if (!detail || detail.type === 'overview') {
        clearDetailPanel();
        return;
      }
      if (detail.type === 'node') {
        const node = state.displayNodeById && state.displayNodeById.get(detail.id);
        if (node) showNodeDetail(node, { recordHistory: false });
        else clearDetailPanel();
        return;
      }
      if (detail.type === 'raw-device') {
        showRawDeviceDetail(detail.id, { recordHistory: false });
        return;
      }
      if (detail.type === 'link') {
        const link = state.displayLinks.find(item => item.id === detail.id);
        if (link) showLinkDetail(link, state.displayNodeById.get(link.from), state.displayNodeById.get(link.to), { recordHistory: false });
        else clearDetailPanel();
        return;
      }
      if (detail.type === 'metric') {
        showMetric(detail.metric, { recordHistory: false });
        return;
      }
      clearDetailPanel();
    }

    function isSpecialOobAggregate(id, label) {
      return SPECIAL_OOB_AGG_IDS.has(String(id || '')) || SPECIAL_OOB_AGG_IDS.has(String(label || ''));
    }

    function isManagementPortName(value) {
      const name = normalizeName(value);
      if (!name) return false;
      return /^meth/i.test(name)
        || /^mgmt [0-9]+$/i.test(name)
        || /^eth0$/i.test(name)
        || /^ethernet0$/i.test(name)
        || /^management port$/i.test(name)
        || /(loopback|null|tunnel|vlan)/i.test(name);
    }

    function isMethPortName(value) {
      return isManagementPortName(value);
    }

    function isMgmtNumberPortName(value) {
      return isManagementPortName(value);
    }

    function isHiddenManagementPortName(value) {
      return isManagementPortName(value);
    }

    function linkUsesMeth(link) {
      return isHiddenManagementPortName(link.sourcePort) || isHiddenManagementPortName(link.targetPort);
    }

    function portKey(name) {
      return normalizeName(name).toLowerCase().replace(/\s+/g, '');
    }

    function portIsUp(port) {
      return !!port && (Number(port.status) === 0 || Number(port.transmit) > 0 || Number(port.receive) > 0);
    }

    function portAffectsFaultState(port) {
      if (!port) return false;
      return !(isHiddenManagementPortName(port.ifName) || isHiddenManagementPortName(port.ifDescr) || isHiddenManagementPortName(port.ifAlias) || isHiddenManagementPortName(port.ifIndex));
    }

    function portHasFault(port) {
      return portAffectsFaultState(port) && !portIsUp(port);
    }

    function rawLinkKey(link) {
      if (!link) return '';
      return [
        link.source || '',
        portKey(link.sourcePort),
        link.target || '',
        portKey(link.targetPort)
      ].join('\x01');
    }

    function markFaultPort(portFaults, nodeId, portName) {
      const key = portKey(portName);
      if (!nodeId || !key) return;
      if (!portFaults.has(nodeId)) portFaults.set(nodeId, new Set());
      portFaults.get(nodeId).add(key);
    }

    function buildFaultIndex(nodes, links, portIndex) {
      const rawDown = new Set();
      const nodeFaultLinks = new Set();
      const portFaults = new Map();
      (links || []).forEach(link => {
        if (!link || !link.source || !link.target) return;
        if (!state.showMeth && linkUsesMeth(link)) return;
        const srcPort = findPortByNameFromIndex(portIndex, link.source, link.sourcePort);
        const tgtPort = findPortByNameFromIndex(portIndex, link.target, link.targetPort);
        const srcUp = portIsUp(srcPort);
        const tgtUp = portIsUp(tgtPort);
        if (srcUp && tgtUp) return;
        rawDown.add(rawLinkKey(link));
        nodeFaultLinks.add(link.source);
        nodeFaultLinks.add(link.target);
        markFaultPort(portFaults, link.source, link.sourcePort);
        markFaultPort(portFaults, link.target, link.targetPort);
      });
      const downNodeIds = new Set((nodes || [])
        .filter(node => Number(node.status) !== 0)
        .map(node => node.id));
      return { rawDown, nodeFaultLinks, portFaults, downNodeIds };
    }

    function portHasLinkedFault(node, port) {
      if (!node || !port || !state.faultIndex) return false;
      const faultPorts = state.faultIndex.portFaults.get(node.id);
      if (!faultPorts) return false;
      const keys = [port.ifName, port.ifDescr, port.ifAlias, port.ifIndex].map(portKey).filter(Boolean);
      return keys.some(key => faultPorts.has(key));
    }

    function formatBytes(value) {
      const n = Number(value) || 0;
      if (n >= 1024 ** 4) return (n / 1024 ** 4).toFixed(2) + ' TB';
      if (n >= 1024 ** 3) return (n / 1024 ** 3).toFixed(2) + ' GB';
      if (n >= 1024 ** 2) return (n / 1024 ** 2).toFixed(2) + ' MB';
      if (n >= 1024) return (n / 1024).toFixed(2) + ' KB';
      return n.toFixed(0) + ' B';
    }

    function normalizeDisplayLabel(value) {
      return String(value || '')
        .replace(/^group:/i, '')
        .replace(/\bGoup(\d+)/g, 'Group$1')
        .replace(/\bCORE(\d+)\b/g, 'Core$1')
        .replace(/\bCore-(\d+)\b/g, 'Core$1');
    }

    function aliasFor(id) {
      const aliases = state.config.aliases || {};
      return normalizeDisplayLabel(aliases[id] || aliases['group:' + id] || id);
    }

    function compileRules() {
      return (state.groupRules.groups || []).map(group => {
        const includeRegex = (group.include_regex || []).map(rx => {
          try { return new RegExp(rx); } catch (e) { return null; }
        }).filter(Boolean);
        const excludeRegex = (group.exclude_regex || []).map(rx => {
          try { return new RegExp(rx); } catch (e) { return null; }
        }).filter(Boolean);
        return { ...group, includeRegex, excludeRegex };
      });
    }

    function matchesGroup(group, node) {
      const id = node.id;
      const name = node.label || node.name || id;
      const inIds = (group.include_ids || []).includes(id);
      const inRegex = group.includeRegex.some(rx => rx.test(id) || rx.test(name));
      const exIds = (group.exclude_ids || []).includes(id);
      const exRegex = group.excludeRegex.some(rx => rx.test(id) || rx.test(name));
      return (inIds || inRegex) && !(exIds || exRegex);
    }

    function toArray(value) {
      return Array.isArray(value) ? value : [];
    }

    function compileRegexList(patterns) {
      return toArray(patterns).map(pattern => {
        try { return new RegExp(pattern, 'i'); } catch (e) { return null; }
      }).filter(Boolean);
    }

    function normalizeArchitectureConfig(raw) {
      const cfg = raw && Array.isArray(raw.zones) && raw.zones.length ? raw : DEFAULT_ARCHITECTURE_CONFIG;
      const zones = toArray(cfg.zones).map((zone, idx) => ({
        id: String(zone.id || `zone-${idx + 1}`),
        title: zone.title || zone.name || zone.id || `分区 ${idx + 1}`,
        subtitle: zone.subtitle || '',
        column: zone.column || (idx % 2 === 0 ? 'left' : 'right'),
        minH: Number(zone.minH) || 240,
        default: zone.default === true,
        layout_template: String(zone.layout_template || 'stack'),
        fallback_section_title: zone.fallback_section_title || '其它设备',
        role_titles: zone.role_titles && typeof zone.role_titles === 'object' ? { ...zone.role_titles } : {},
        section_rules: toArray(zone.section_rules).map((section, sectionIdx) => ({
          id: String(section.id || `section-${sectionIdx + 1}`),
          title: section.title || section.name || section.id || `分组 ${sectionIdx + 1}`,
          order: Number(section.order) || sectionIdx + 1,
          include_ids: toArray(section.include_ids),
          exclude_ids: toArray(section.exclude_ids),
          includeRegex: compileRegexList(section.include_regex),
          excludeRegex: compileRegexList(section.exclude_regex)
        })).sort((a, b) => a.order - b.order),
        include_ids: toArray(zone.include_ids),
        exclude_ids: toArray(zone.exclude_ids),
        includeRegex: compileRegexList(zone.include_regex),
        excludeRegex: compileRegexList(zone.exclude_regex)
      }));
      const clusters = (toArray(cfg.clusters).length ? toArray(cfg.clusters) : DEFAULT_ARCHITECTURE_CONFIG.clusters).map((cluster, idx) => ({
        id: String(cluster.id || `cluster-${idx + 1}`),
        title: cluster.title || cluster.name || cluster.id || `集群 ${idx + 1}`,
        order: Number(cluster.order) || idx + 1,
        default: cluster.default === true,
        include_ids: toArray(cluster.include_ids),
        exclude_ids: toArray(cluster.exclude_ids),
        includeRegex: compileRegexList(cluster.include_regex),
        excludeRegex: compileRegexList(cluster.exclude_regex)
      })).sort((a, b) => a.order - b.order);
      const roles = (toArray(cfg.roles).length ? toArray(cfg.roles) : DEFAULT_ARCHITECTURE_CONFIG.roles).map((role, idx) => ({
        id: String(role.id || `role-${idx + 1}`),
        title: role.title || role.name || role.id || `角色 ${idx + 1}`,
        order: Number(role.order) || idx + 1,
        default: role.default === true,
        include_ids: toArray(role.include_ids),
        exclude_ids: toArray(role.exclude_ids),
        includeRegex: compileRegexList(role.include_regex),
        excludeRegex: compileRegexList(role.exclude_regex)
      })).sort((a, b) => a.order - b.order);
      const configuredRows = toArray(cfg.layout && cfg.layout.rows)
        .map(row => toArray(row).map(String).filter(Boolean))
        .filter(row => row.length);
      const rows = configuredRows.length ? configuredRows : [zones.map(zone => zone.id)];
      return {
        ...cfg,
        refresh_ms: Number(cfg.refresh_ms) || 360000,
        sidebar: {
          ...(DEFAULT_ARCHITECTURE_CONFIG.sidebar || {}),
          ...((cfg && cfg.sidebar) || {})
        },
        layout: { ...(cfg.layout || {}), rows },
        zones,
        clusters,
        roles
      };
    }

    function matchesRule(rule, id, label) {
      const text = `${id || ''} ${label || ''}`;
      const inIds = toArray(rule.include_ids).includes(id);
      const inRegex = (rule.includeRegex || []).some(rx => rx.test(text));
      const exIds = toArray(rule.exclude_ids).includes(id);
      const exRegex = (rule.excludeRegex || []).some(rx => rx.test(text));
      const hasInclude = toArray(rule.include_ids).length > 0 || (rule.includeRegex || []).length > 0;
      return (!hasInclude || inIds || inRegex) && !(exIds || exRegex);
    }

    function defaultRule(list) {
      return list.find(item => item.default) || list[0] || null;
    }

    function matchedZoneRule(id, label) {
      const zones = (state.architectureConfig && state.architectureConfig.zones) || DEFAULT_ARCHITECTURE_CONFIG.zones;
      if (isSpecialOobAggregate(id, label)) {
        return zones.find(zone => zone.id === 'oob') || null;
      }
      return zones.find(zone => matchesRule(zone, id, label)) || null;
    }

    function classifyZone(id, label) {
      const zones = (state.architectureConfig && state.architectureConfig.zones) || DEFAULT_ARCHITECTURE_CONFIG.zones;
      const matched = matchedZoneRule(id, label);
      const fallback = defaultRule(zones);
      return (matched || fallback || {}).id || 'default';
    }

    function classifyDisplayZone(node, id, label) {
      if (node && node.kind === 'group' && Array.isArray(node.raw)) {
        const matched = node.raw
          .map(item => matchedZoneRule(item.id, item.label || item.name || item.id))
          .find(Boolean);
        if (matched) return matched.id;
      }
      return classifyZone(id, label);
    }

    function roleRank(id, label) {
      const roles = (state.architectureConfig && state.architectureConfig.roles) || DEFAULT_ARCHITECTURE_CONFIG.roles;
      if (isSpecialOobAggregate(id, label)) {
        const aggregateRole = roles.find(role => role.id === 'aggregate');
        return Number((aggregateRole || defaultRule(roles) || {}).order) || 1;
      }
      const matched = roles.find(role => !role.default && matchesRule(role, id, label));
      const fallback = defaultRule(roles);
      return Number((matched || fallback || {}).order) || 1;
    }

    function roleLabel(role, zoneId) {
      const roles = (state.architectureConfig && state.architectureConfig.roles) || DEFAULT_ARCHITECTURE_CONFIG.roles;
      const roleDef = roles.find(item => Number(item.order) === Number(role)) || {};
      const zone = zoneId ? zoneDefinitions.find(item => item.id === zoneId) : null;
      const roleTitles = zone && zone.role_titles && typeof zone.role_titles === 'object' ? zone.role_titles : null;
      if (roleTitles) {
        if (roleDef.id && roleTitles[roleDef.id]) return roleTitles[roleDef.id];
        if (roleTitles[String(role)]) return roleTitles[String(role)];
      }
      return roleDef.title || '接入';
    }

    function zoneTitle(zoneId) {
      return (zoneDefinitions.find(zone => zone.id === zoneId) || {}).title || zoneId;
    }

    function clusterKey(id, label) {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      const matched = clusters.find(cluster => !cluster.default && matchesRule(cluster, id, label));
      const fallback = defaultRule(clusters);
      return (matched || fallback || {}).id || 'default';
    }

    function clusterTitle(cluster) {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      return (clusters.find(item => item.id === cluster) || {}).title || cluster;
    }

    function hasMultipleClusters() {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      return clusters.length > 1;
    }

    function useLegacyClusterSections(zoneId) {
      if (!hasMultipleClusters()) return false;
      return zoneSectionRules(zoneId).length === 0;
    }

    function displayClusterTitle(cluster) {
      const clusters = (state.architectureConfig && state.architectureConfig.clusters) || DEFAULT_ARCHITECTURE_CONFIG.clusters;
      const fallback = defaultRule(clusters);
      if (!hasMultipleClusters() && fallback && cluster === fallback.id) return '';
      return clusterTitle(cluster);
    }

    function currentProfileName() {
      const params = new URLSearchParams(location.search);
      return params.get('profile') || ((state.config && state.config.home_topology) ? state.config.home_topology : 'main') || 'main';
    }

    function baseConfigVisibility() {
      return (state.baseConfig && state.baseConfig.visibility) || { devices: {}, groups: {} };
    }

    function profileConfig(name) {
      const base = state.baseConfig || {};
      return (base.profiles && base.profiles[name]) || null;
    }

    function profileVisibility(name) {
      const prof = profileConfig(name);
      return (prof && prof.visibility) || { devices: {}, groups: {} };
    }

    function explicitVisibleInProfile(id, profileName) {
      const vis = profileVisibility(profileName);
      const devices = vis.devices || {};
      const groups = vis.groups || {};
      if (Object.prototype.hasOwnProperty.call(devices, id)) return devices[id] !== false;
      if (Object.prototype.hasOwnProperty.call(groups, id)) return groups[id] !== false;
      return true;
    }

    function ethernetVisibilityNode(node) {
      const id = node.id;
      const mainVisible = explicitVisibleInProfile(id, 'main');
      const ethernetVisible = explicitVisibleInProfile(id, 'ethernet');
      const baseVisible = baseConfigVisibility();
      const baseDevices = baseVisible.devices || {};
      const baseGroups = baseVisible.groups || {};
      const hiddenInBase = (Object.prototype.hasOwnProperty.call(baseDevices, id) && baseDevices[id] === false)
        || (Object.prototype.hasOwnProperty.call(baseGroups, id) && baseGroups[id] === false);
      return (ethernetVisible && !mainVisible) || hiddenInBase;
    }

    function isExcludedMetricNodeId(id) {
      const value = String(id || '');
      if (!value) return true;
      if (value.startsWith('group:')) return true;
      return value === 'special-line-acc02';
    }

    function zoneSectionRules(zoneId) {
      const zone = zoneDefinitions.find(item => item.id === zoneId);
      return zone ? toArray(zone.section_rules) : [];
    }

    function architectureSectionMeta(node) {
      const candidateId = node.kind === 'group' && node.groupId ? node.groupId : node.id;
      const candidateLabel = node.kind === 'group' && node.groupId ? (aliasFor(node.groupId) || node.label || node.groupId) : (node.label || candidateId);
      if (candidateId === SYNTHETIC_GROUPS.mgmt) {
        return {
          id: `section:mgmt:unmatched-mgmt-devices`,
          title: '带内设备',
          order: 3,
          visual: 'group'
        };
      }
      if (candidateId === SYNTHETIC_GROUPS.compute) {
        return {
          id: `section:compute:compute-devices`,
          title: '智算设备',
          order: 999,
          visual: 'group'
        };
      }
      const sectionRule = zoneSectionRules(node.zone).find(rule => matchesRule(rule, candidateId, candidateLabel));
      if (sectionRule) {
        return {
          id: `section:${node.zone}:${sectionRule.id}`,
          title: sectionRule.title,
          order: Number(sectionRule.order) || 1,
          visual: node.kind === 'device' ? 'device' : 'group'
        };
      }
      if (useLegacyClusterSections(node.zone)) {
        return {
          id: String(node.cluster || 'default'),
          title: clusterTitle(node.cluster || 'default'),
          order: 1000,
          visual: node.kind === 'device' ? 'device' : 'group'
        };
      }
      if (node.zone === 'compute') {
        const zone = zoneDefinitions.find(item => item.id === node.zone) || {};
        return {
          id: `section:${node.zone}:others`,
          title: zone.fallback_section_title || '其它设备',
          order: 999,
          visual: 'device'
        };
      }
      return {
        id: String(node.cluster || 'default'),
        title: node.zone === 'compute' ? clusterTitle(node.cluster || 'default') : roleLabel(node.role, node.zone),
        order: 1000,
        visual: node.kind === 'device' ? 'device' : 'group'
      };
    }

    function deviceHasDownPort(node) {
      return !!(node && state.faultIndex && state.faultIndex.nodeFaultLinks.has(node.id));
    }

    function buildPortIndex(nodes) {
      const index = new Map();
      nodes.forEach(node => {
        const map = new Map();
        (node.ports || []).forEach(port => {
          [port.ifName, port.ifDescr, port.ifAlias, port.ifIndex].forEach(name => {
            const key = portKey(name);
            if (key) map.set(key, port);
          });
        });
        index.set(node.id, map);
      });
      return index;
    }

    function findPortByName(nodeId, name) {
      return state.portIndex && state.portIndex.get(nodeId) ? state.portIndex.get(nodeId).get(portKey(name)) : null;
    }

    function addPeerIndexEntry(index, nodeId, portName, peerNodeId, peerPortName) {
      const key = portKey(portName);
      if (!nodeId || !key || !peerNodeId) return;
      if (!index.has(nodeId)) index.set(nodeId, new Map());
      const nodeMap = index.get(nodeId);
      if (!nodeMap.has(key)) nodeMap.set(key, []);
      const list = nodeMap.get(key);
      const dedupeKey = `${peerNodeId}::${portKey(peerPortName)}`;
      if (!list.some(item => item.key === dedupeKey)) {
        list.push({
          key: dedupeKey,
          nodeId: peerNodeId,
          portName: peerPortName || ''
        });
      }
    }

    function buildPeerIndex(links) {
      const index = new Map();
      (links || []).forEach(link => {
        if (!link || !link.source || !link.target) return;
        addPeerIndexEntry(index, link.source, link.sourcePort, link.target, link.targetPort);
        addPeerIndexEntry(index, link.target, link.targetPort, link.source, link.sourcePort);
      });
      return index;
    }

    function findPeerEntries(nodeId, port) {
      if (!state.peerIndex || !nodeId || !port) return [];
      const nodeMap = state.peerIndex.get(nodeId);
      if (!nodeMap) return [];
      const candidates = [port.ifName, port.ifDescr, port.ifAlias, port.ifIndex]
        .map(portKey)
        .filter(Boolean);
      const seen = new Set();
      const result = [];
      candidates.forEach(key => {
        (nodeMap.get(key) || []).forEach(item => {
          if (seen.has(item.key)) return;
          seen.add(item.key);
          result.push(item);
        });
      });
      return result;
    }

    function effectivePorts(node) {
      const ports = Array.isArray(node && node.ports) ? node.ports : [];
      if (state.showMeth) return ports;
      return ports.filter(p => !(isHiddenManagementPortName(p.ifName) || isHiddenManagementPortName(p.ifDescr) || isHiddenManagementPortName(p.ifAlias) || isHiddenManagementPortName(p.ifIndex)));
    }

    function hasHighSpeedPort(node, thresholdGbps) {
      return effectivePorts(node).some(port => (Number(port && port.speed_mbps) || 0) >= thresholdGbps);
    }

    function explicitSyntheticBucket(zoneId, role) {
      if (zoneId === 'oob' && Number(role) === 2) {
        return {
          id: SYNTHETIC_GROUPS.oobAgg,
          label: '带外汇聚',
          zone: 'oob',
          cluster: 'default',
          role: 2
        };
      }
      if (zoneId === 'mgmt' && Number(role) === 3) {
        return {
          id: SYNTHETIC_GROUPS.mgmtAccess,
          label: '带内接入',
          zone: 'mgmt',
          cluster: 'default',
          role: 3
        };
      }
      if (zoneId === 'oob' && Number(role) === 3) {
        return {
          id: SYNTHETIC_GROUPS.oobAccess,
          label: '带外接入',
          zone: 'oob',
          cluster: 'default',
          role: 3
        };
      }
      if (zoneId === 'storage') {
        return {
          id: SYNTHETIC_GROUPS.storage,
          label: '存储区',
          zone: 'storage',
          cluster: 'default',
          role: 3
        };
      }
      return null;
    }

    function detectSyntheticArchitectureGroupMeta(id, label) {
      const text = `${id || ''} ${label || ''}`;
      let match = text.match(/(?:^|[\s:_-])CORE\s*([0-9]+)(?:$|[\s:_-])/i);
      if (match) {
        const num = match[1];
        return {
          id: `NXDXA-CORE${num}`,
          include_regex: [`^.*[_-]CORE${num}-\\d+$`, `^CORE${num}-\\d+$`]
        };
      }
      match = text.match(/Group\s*([0-9]+)[-_ ]Spine\s*([0-9]+)/i);
      if (match) {
        return {
          id: `Group${match[1]}-Spine${match[2]}`,
          include_regex: [`^.*Group${match[1]}[-_ ]Spine${match[2]}-\\d+$`]
        };
      }
      match = text.match(/Group\s*([0-9]+)[-_ ]pod\s*([0-9]+)-leaf\s*[0-9]*/i);
      if (match) {
        return {
          id: `Group${match[1]}-pod${match[2]}-Leaf`,
          include_regex: [`^.*Group${match[1]}[_-]pod${match[2]}-leaf\\d+$`]
        };
      }
      match = text.match(/(?:^|[\s:_-])pod\s*([13])[-_ ]leaf\s*[0-9]+(?:$|[\s:_-])/i);
      if (match) {
        return {
          id: `Group2-pod${match[1]}-Leaf`,
          include_regex: [`^pod${match[1]}-leaf\\d+$`]
        };
      }
      return null;
    }

    function buildEffectiveArchitectureGroups(baseGroups, rawNodes) {
      const groups = Array.isArray(baseGroups) ? baseGroups.map(group => ({ ...group })) : [];
      const existing = new Set(groups.map(group => String(group.id || '')));
      (rawNodes || []).forEach(node => {
        const meta = detectSyntheticArchitectureGroupMeta(node && node.id, (node && (node.label || node.name)) || '');
        if (!meta || existing.has(meta.id)) return;
        groups.push({
          id: meta.id,
          include_ids: [],
          exclude_ids: [],
          includeRegex: compileRegexList(meta.include_regex),
          excludeRegex: []
        });
        existing.add(meta.id);
      });
      return groups;
    }

    function buildDisplayModel() {
      const cfg = state.config || {};
      const visibility = cfg.visibility || {};
      const groupVisibility = visibility.groups || {};
      const metricNodes = (state.topology.nodes || []).filter(n => n && n.id && !isExcludedMetricNodeId(n.id));
      // 架构视图需要把未匹配规则的设备收口到 fallback 组里，因此这里不再
      // 先按 device visibility 过滤，避免设备在进入“带内设备/智算设备”前被吞掉。
      const rawNodes = metricNodes;
      const rules = buildEffectiveArchitectureGroups(compileRules(), rawNodes);
      const nodeById = new Map(metricNodes.map(n => [n.id, n]));
      const portIndex = buildPortIndex(metricNodes);
      state.faultIndex = buildFaultIndex(metricNodes, state.links || [], portIndex);
      state.metricNodes = metricNodes;
      const groups = new Map();
      const memberToDisplay = new Map();
      const standalone = [];
      const fallbackBuckets = new Map([
        [SYNTHETIC_GROUPS.mgmt, []],
        [SYNTHETIC_GROUPS.compute, []]
      ]);
      const explicitBuckets = new Map();

      rawNodes.forEach(node => {
        const rule = rules.find(g => matchesGroup(g, node));
        if (rule && groupVisibility[rule.id] !== false) {
          if (!groups.has(rule.id)) groups.set(rule.id, { id: 'group:' + rule.id, groupId: rule.id, label: aliasFor(rule.id), members: [], raw: [] });
          const group = groups.get(rule.id);
          group.members.push(node.id);
          group.raw.push(node);
          memberToDisplay.set(node.id, group.id);
        } else {
          standalone.push(node);
        }
      });

      const displayNodes = [];
      groups.forEach(group => {
        const down = group.raw.some(node => Number(node.status) !== 0);
        const label = aliasFor(group.id) || aliasFor(group.groupId);
        displayNodes.push({
          id: group.id,
          label,
          zone: classifyDisplayZone(group, group.groupId, label),
          cluster: clusterKey(group.groupId, label),
          role: roleRank(group.groupId, label),
          count: group.members.length,
          down,
          kind: 'group',
          groupId: group.groupId,
          members: group.members
        });
      });

      standalone.forEach(node => {
        const label = aliasFor(node.id) || node.label || node.name || node.id;
        const matchedZone = matchedZoneRule(node.id, label);
        if (matchedZone) {
          const role = roleRank(node.id, label);
          const explicitBucket = explicitSyntheticBucket(matchedZone.id, role);
          if (explicitBucket) {
            if (!explicitBuckets.has(explicitBucket.id)) {
              explicitBuckets.set(explicitBucket.id, { ...explicitBucket, nodes: [] });
            }
            explicitBuckets.get(explicitBucket.id).nodes.push(node);
            memberToDisplay.set(node.id, 'group:' + explicitBucket.id);
            return;
          }
          displayNodes.push({
            id: node.id,
            label,
            zone: matchedZone.id,
            cluster: clusterKey(node.id, label),
            role,
            count: 1,
            down: Number(node.status) !== 0,
            kind: 'device',
            members: [node.id]
          });
          memberToDisplay.set(node.id, node.id);
          return;
        }
        const syntheticId = hasHighSpeedPort(node, 200) ? SYNTHETIC_GROUPS.compute : SYNTHETIC_GROUPS.mgmt;
        fallbackBuckets.get(syntheticId).push(node);
        memberToDisplay.set(node.id, 'group:' + syntheticId);
      });

      explicitBuckets.forEach(bucket => {
        if (!bucket.nodes.length) return;
        displayNodes.push({
          id: 'group:' + bucket.id,
          label: bucket.label,
          zone: bucket.zone,
          cluster: bucket.cluster,
          role: bucket.role,
          count: bucket.nodes.length,
          down: bucket.nodes.some(node => Number(node.status) !== 0),
          kind: 'group',
          groupId: bucket.id,
          members: bucket.nodes.map(node => node.id)
        });
      });

      fallbackBuckets.forEach((bucket, syntheticId) => {
        if (!bucket.length) return;
        const computeBucket = syntheticId === SYNTHETIC_GROUPS.compute;
        displayNodes.push({
          id: 'group:' + syntheticId,
          label: computeBucket ? '智算设备' : '带内设备',
          zone: computeBucket ? 'compute' : 'mgmt',
          cluster: computeBucket ? clusterKey(syntheticId, '智算设备') : 'default',
          role: 3,
          count: bucket.length,
          down: bucket.some(node => Number(node.status) !== 0),
          kind: 'group',
          groupId: syntheticId,
          members: bucket.map(node => node.id)
        });
      });

      const linkMap = new Map();
      let hiddenMeth = 0;
      (state.links || []).forEach(link => {
        if (!link || !link.source || !link.target) return;
        if (!state.showMeth && linkUsesMeth(link)) {
          hiddenMeth++;
          return;
        }
        const from = memberToDisplay.get(link.source) || link.source;
        const to = memberToDisplay.get(link.target) || link.target;
        if (!from || !to || from === to) return;
        const key = from < to ? from + '---' + to : to + '---' + from;
        if (!linkMap.has(key)) linkMap.set(key, { id: key, from: from < to ? from : to, to: from < to ? to : from, count: 0, down: false, speed: 0, raw: [] });
        const rec = linkMap.get(key);
        rec.count++;
        rec.raw.push(link);
        if (rawLinkDown(link)) rec.down = true;
        const srcPort = findPortByNameFromIndex(portIndex, link.source, link.sourcePort);
        const tgtPort = findPortByNameFromIndex(portIndex, link.target, link.targetPort);
        rec.speed = Math.max(rec.speed, Number(srcPort && srcPort.speed_mbps) || 0, Number(tgtPort && tgtPort.speed_mbps) || 0);
      });

      const nodeIds = new Set(displayNodes.map(n => n.id));
      const displayLinks = Array.from(linkMap.values()).filter(link => nodeIds.has(link.from) && nodeIds.has(link.to));
      const displayNodeMap = new Map(displayNodes.map(node => [node.id, node]));
      const displayFaultLinkCount = displayLinks.reduce((count, link) => count + (link.down ? 1 : 0), 0);
      state.displayNodes = displayNodes;
      state.displayLinks = displayLinks;
      state.displayFaultLinkCount = displayFaultLinkCount;
      state.hiddenMethLinks = hiddenMeth;
      state.nodeById = nodeById;
      state.portIndex = portIndex;
      state.peerIndex = buildPeerIndex(state.links || []);
      state.displayNodeById = displayNodeMap;
    }

    function shouldAnimateRender() {
      const nodeCount = state.displayNodes.length;
      const linkCount = state.displayLinks.length;
      return nodeCount <= 80 && linkCount <= 120 && (nodeCount + linkCount) <= 180;
    }

    function findPortByNameFromIndex(index, nodeId, name) {
      return index && index.get(nodeId) ? index.get(nodeId).get(portKey(name)) : null;
    }

    function layoutNodes() {
      const byZone = new Map(zoneDefinitions.map(zone => [zone.id, []]));
      state.displayNodes.forEach(node => {
        const targetZone = byZone.has(node.zone) ? node.zone : 'compute';
        byZone.get(targetZone).push(node);
      });

      const layoutCfg = {
        cardW: 142,
        cardH: 106,
        padX: 24,
        headerH: 58,
        padBottom: 24,
        colGap: 18,
        rowGap: 18,
        roleGap: 30,
        clusterGap: 18,
        clusterLabelH: 26,
        clusterPadX: 14,
        clusterPadBottom: 14
      };
      const roleOrder = ((state.architectureConfig && state.architectureConfig.roles) || DEFAULT_ARCHITECTURE_CONFIG.roles).map(role => Number(role.order) || 1);

      function columnsFor(width) {
        const usable = Math.max(layoutCfg.cardW, width - layoutCfg.padX * 2);
        return Math.max(1, Math.floor((usable + layoutCfg.colGap) / (layoutCfg.cardW + layoutCfg.colGap)));
      }

      function roleRows(count, width) {
        return Math.max(1, Math.ceil(count / columnsFor(width)));
      }

      function roleBlockHeight(count, width) {
        const rows = roleRows(count, width);
        return rows * layoutCfg.cardH + Math.max(0, rows - 1) * layoutCfg.rowGap;
      }

      function clusterSections(list) {
        const map = new Map();
        list.forEach(node => {
          const meta = architectureSectionMeta(node);
          const key = meta.id;
          if (!map.has(key)) {
            map.set(key, { id: key, title: meta.title, order: meta.order, visual: meta.visual, nodes: [] });
          }
          map.get(key).nodes.push(node);
        });
        return Array.from(map.values())
          .filter(section => section && section.nodes.length > 0)
          .sort((a, b) => {
            if ((a.order || 0) !== (b.order || 0)) return (a.order || 0) - (b.order || 0);
            return String(a.title || '').localeCompare(String(b.title || ''), 'zh-CN');
          });
      }

      function clusterHeight(section, width) {
        const innerWidth = Math.max(layoutCfg.cardW, width - layoutCfg.clusterPadX * 2);
        const roles = roleOrder.filter(role => section.nodes.some(node => node.role === role));
        const blocks = roles.map(role => roleBlockHeight(section.nodes.filter(node => node.role === role).length, innerWidth));
        return layoutCfg.clusterLabelH + blocks.reduce((sum, h) => sum + h, 0) + Math.max(0, blocks.length - 1) * layoutCfg.roleGap + layoutCfg.clusterPadBottom;
      }

      function sectionLayoutMeta(zone, section) {
        if ((zone.layout_template || 'stack') !== 'single_cluster_multi_group') {
          const id = String(section.id || '');
          if (id.endsWith(':unmatched-mgmt-devices')) return { rowOrder: 3, slot: 99 };
          return { rowOrder: Number(section.order) || 1000, slot: Number(section.order) || 1000 };
        }
        const id = String(section.id || '');
        if (id.endsWith(':core')) return { rowOrder: 1, slot: 1 };
        const match = id.match(/group(\d+)-(aggregate|access)$/);
        if (match) {
          return {
            rowOrder: match[2] === 'aggregate' ? 2 : 3,
            slot: Number(match[1]) || 99
          };
        }
        if (id.endsWith(':compute-devices')) return { rowOrder: 4, slot: 1 };
        if (id.endsWith(':others')) return { rowOrder: 4, slot: 1 };
        return { rowOrder: 4, slot: Number(section.order) || 999 };
      }

      function sectionRows(zone, sections) {
        if ((zone.layout_template || 'stack') !== 'single_cluster_multi_group') {
          return sections.map(section => ({ order: Number(section.order) || 1000, sections: [section] }));
        }
        const rowMap = new Map();
        sections.forEach(section => {
          const meta = sectionLayoutMeta(zone, section);
          const key = String(meta.rowOrder);
          if (!rowMap.has(key)) rowMap.set(key, { order: meta.rowOrder, sections: [] });
          rowMap.get(key).sections.push({ ...section, __slot: meta.slot });
        });
        return Array.from(rowMap.values())
          .sort((a, b) => a.order - b.order)
          .map(row => ({
            ...row,
            sections: row.sections.sort((a, b) => (a.__slot || 0) - (b.__slot || 0) || String(a.title || '').localeCompare(String(b.title || ''), 'zh-CN'))
          }));
      }

      function zoneHeight(def, list) {
        const width = def.w || 530;
        const sections = clusterSections(list);
        const rows = sectionRows(def, sections);
        const blocks = rows.map(row => {
          const rowWidth = width - 24;
          const sectionWidth = row.sections.length <= 1
            ? rowWidth
            : Math.floor((rowWidth - layoutCfg.clusterGap * (row.sections.length - 1)) / row.sections.length);
          return Math.max(...row.sections.map(section => clusterHeight(section, sectionWidth)));
        });
        const contentH = layoutCfg.headerH + blocks.reduce((sum, h) => sum + h, 0) + Math.max(0, blocks.length - 1) * layoutCfg.clusterGap + layoutCfg.padBottom;
        return Math.max(def.minH, contentH);
      }

      const viewportWidth = Math.max(1174, (stage && stage.clientWidth) || svg.clientWidth || 1174);
      const outerMargin = 38;
      const zoneGap = 38;
      const contentWidth = viewportWidth - outerMargin * 2;
      const dualZoneWidth = Math.floor((contentWidth - zoneGap) / 2);
      const zoneById = new Map(zoneDefinitions.map(def => [def.id, def]));
      const hasNodes = id => (byZone.get(id) || []).length > 0;
      activeZones = [];
      let y = 34;
      const configuredRows = ((state.architectureConfig && state.architectureConfig.layout && state.architectureConfig.layout.rows) || [zoneDefinitions.map(zone => zone.id)]);
      configuredRows.forEach(pair => {
        const defs = pair.filter(hasNodes).map(id => zoneById.get(id));
        if (!defs.length) return;
        const fullWidth = defs.length === 1;
        const rowDefs = defs.map(def => ({
          ...def,
          x: fullWidth ? outerMargin : (def.column === 'left' ? outerMargin : (outerMargin + dualZoneWidth + zoneGap)),
          w: fullWidth ? contentWidth : dualZoneWidth
        }));
        const rowH = Math.max(...rowDefs.map(def => zoneHeight(def, byZone.get(def.id))));
        rowDefs.forEach(def => {
          activeZones.push({
            ...def,
            y,
            h: rowH
          });
        });
        y += rowH + 22;
      });

      activeZones.forEach(zone => {
        const list = byZone.get(zone.id) || [];
        const sections = clusterSections(list);
        const rows = sectionRows(zone, sections);
        let cursorY = zone.y + layoutCfg.headerH;
        zone.sections = [];
        rows.forEach(row => {
          const totalW = zone.w - 24;
          const sectionCount = row.sections.length;
          const sectionW = sectionCount <= 1
            ? totalW
            : Math.floor((totalW - layoutCfg.clusterGap * (sectionCount - 1)) / sectionCount);
          const rowH = Math.max(...row.sections.map(section => clusterHeight(section, sectionW)));
          row.sections.forEach((section, idx) => {
            const sectionH = clusterHeight(section, sectionW);
            const sectionBox = {
              ...section,
              x: zone.x + 12 + idx * (sectionW + layoutCfg.clusterGap),
              y: cursorY,
              w: sectionW,
              h: sectionH
            };
            zone.sections.push(sectionBox);
            const innerW = sectionBox.w - layoutCfg.clusterPadX * 2;
            const cols = columnsFor(innerW);
            let nodeY = sectionBox.y + layoutCfg.clusterLabelH;
            roleOrder.filter(role => section.nodes.some(node => node.role === role)).forEach(role => {
              const roleNodes = section.nodes.filter(node => node.role === role).sort((a, b) => String(a.label).localeCompare(String(b.label), 'zh-CN'));
              const rowsCount = Math.ceil(roleNodes.length / cols);
              for (let rowIdx = 0; rowIdx < rowsCount; rowIdx++) {
                const rowNodes = roleNodes.slice(rowIdx * cols, rowIdx * cols + cols);
                const rowW = rowNodes.length * layoutCfg.cardW + Math.max(0, rowNodes.length - 1) * layoutCfg.colGap;
                const startX = sectionBox.x + Math.max(layoutCfg.clusterPadX, (sectionBox.w - rowW) / 2);
                rowNodes.forEach((node, nodeIdx) => {
                  node.w = layoutCfg.cardW;
                  node.h = layoutCfg.cardH;
                  node.x = startX + nodeIdx * (layoutCfg.cardW + layoutCfg.colGap);
                  node.y = nodeY;
                  node.cx = node.x + layoutCfg.cardW / 2;
                  node.cy = node.y + layoutCfg.cardH / 2;
                  node.iconCx = node.x + layoutCfg.cardW / 2;
                  node.iconCy = node.y + 38;
                  node.sectionVisual = section.visual || 'group';
                });
                nodeY += layoutCfg.cardH + layoutCfg.rowGap;
              }
              nodeY += layoutCfg.roleGap - layoutCfg.rowGap;
            });
          });
          cursorY += rowH + layoutCfg.clusterGap;
        });
      });
    }

    function colorBySpeed(speed, down) {
      if (down) return '#ef4444';
      if (speed >= 400) return '#06b6d4';
      if (speed >= 200) return '#22c55e';
      if (speed >= 100) return '#fb923c';
      if (speed >= 25) return '#8b5cf6';
      if (speed >= 10) return '#64748b';
      return '#94a3b8';
    }

    function svgEl(tag, attrs) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
      Object.entries(attrs || {}).forEach(([key, value]) => el.setAttribute(key, value));
      return el;
    }

    function truncate(text, max) {
      const s = String(text || '');
      return s.length > max ? s.slice(0, max - 1) + '...' : s;
    }

    function appendSwitchIcon(group, node) {
      const x = (node.w - 54) / 2;
      const y = 10;
      if (node.kind === 'group') {
        group.appendChild(svgEl('rect', {
          x: x + 5,
          y: y + 6,
          width: 48,
          height: 38,
          rx: 8,
          fill: node.down ? '#3a1820' : '#0b4260',
          stroke: node.down ? '#ef4444' : '#0369a1',
          'stroke-width': 1
        }));
      }
      if (node.kind === 'device' || node.sectionVisual === 'device') {
        const body = svgEl('rect', {
          class: 'switch-icon-body',
          x: x + 2,
          y: y + 2,
          width: 50,
          height: 34,
          rx: 6,
          fill: node.down ? '#7f1d1d' : '#334155'
        });
        group.appendChild(body);
        [10, 17, 24].forEach(offset => {
          group.appendChild(svgEl('path', {
            class: 'switch-icon-mark',
            d: `M${x + 12},${y + offset}h22`,
            'stroke-width': 2
          }));
        });
        group.appendChild(svgEl('circle', {
          cx: x + 40,
          cy: y + 12,
          r: 2.6,
          fill: node.down ? '#fca5a5' : '#67e8f9'
        }));
        group.appendChild(svgEl('circle', {
          cx: x + 40,
          cy: y + 24,
          r: 2.6,
          fill: node.down ? '#f87171' : '#22c55e'
        }));
        return;
      }
      const bodyFill = node.down ? '#991b1b' : (node.role === 1 ? '#0284c7' : '#2563eb');
      const body = svgEl('rect', {
        class: 'switch-icon-body',
        x,
        y,
        width: 48,
        height: 38,
        rx: 8,
        fill: bodyFill
      });
      group.appendChild(body);
      const centerX = x + 24;
      const centerY = y + 19;
      group.appendChild(svgEl('path', { class: 'switch-icon-mark', d: `M${centerX},${y + 7}v24M${x + 12},${centerY}h24` }));
      group.appendChild(svgEl('path', { class: 'switch-icon-mark', d: `M${centerX},${y + 7}l-5,5M${centerX},${y + 7}l5,5M${centerX},${y + 31}l-5,-5M${centerX},${y + 31}l5,-5M${x + 12},${centerY}l5,-5M${x + 12},${centerY}l5,5M${x + 36},${centerY}l-5,-5M${x + 36},${centerY}l-5,5` }));
    }

    function linkEndpoint(from, to) {
      const fx = from.iconCx || from.cx;
      const fy = from.iconCy || from.cy;
      const tx = to.iconCx || to.cx;
      const ty = to.iconCy || to.cy;
      const dx = tx - fx;
      const dy = ty - fy;
      const len = Math.sqrt(dx * dx + dy * dy) || 1;
      const iconRadius = 27;
      return {
        x: fx + dx / len * iconRadius,
        y: fy + dy / len * iconRadius
      };
    }

    function linePath(a, b) {
      const start = linkEndpoint(a, b);
      const end = linkEndpoint(b, a);
      const ax = start.x;
      const ay = start.y;
      const bx = end.x;
      const by = end.y;
      const dx = Math.abs(ax - bx);
      const dy = Math.abs(ay - by);
      if (dy < 90) {
        const midX = (ax + bx) / 2;
        return `M${ax},${ay} C${midX},${ay} ${midX},${by} ${bx},${by}`;
      }
      if (dx < 70) {
        const midY = (ay + by) / 2;
        return `M${ax},${ay} C${ax},${midY} ${bx},${midY} ${bx},${by}`;
      }
      const midY = (ay + by) / 2;
      return `M${ax},${ay} C${ax},${midY} ${bx},${midY} ${bx},${by}`;
    }

    function render(options = {}) {
      const rebuild = options.rebuild !== false;
      const animate = options.animate !== false;
      if (rebuild) buildDisplayModel();
      layoutNodes();
      svg.innerHTML = '';
      const width = Math.max(1174, svg.clientWidth || 1174);
      const contentHeight = Math.max(760, ...activeZones.map(zone => zone.y + zone.h + 36));
      const height = Math.max(contentHeight, svg.clientHeight || 760);
      svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
      svg.setAttribute('height', String(height));
      svg.style.height = height + 'px';

      const zoneLayer = svgEl('g');
      const linkLayer = svgEl('g');
      const nodeLayer = svgEl('g');
      focusLinkLayer = svgEl('g', { class: 'focus-link-layer' });
      svg.appendChild(zoneLayer);
      svg.appendChild(linkLayer);
      svg.appendChild(nodeLayer);
      svg.appendChild(focusLinkLayer);

      activeZones.forEach(zone => {
        zoneLayer.appendChild(svgEl('rect', { class: 'zone-bg', x: zone.x, y: zone.y, width: zone.w, height: zone.h, rx: 8 }));
        const title = svgEl('text', { class: 'zone-label', x: zone.x + 18, y: zone.y + 26 });
        title.textContent = zone.title;
        zoneLayer.appendChild(title);
        const sub = svgEl('text', { class: 'zone-sub', x: zone.x + 18, y: zone.y + 44 });
        sub.textContent = zone.subtitle;
        zoneLayer.appendChild(sub);
        (zone.sections || []).forEach(section => {
          zoneLayer.appendChild(svgEl('rect', { class: 'cluster-bg', x: section.x, y: section.y, width: section.w, height: section.h, rx: 7 }));
          const label = svgEl('text', { class: `cluster-label ${section.id}`, x: section.x + 12, y: section.y + 17 });
          label.textContent = section.title;
          zoneLayer.appendChild(label);
        });
      });

      const nodeByDisplayId = new Map(state.displayNodes.map(node => [node.id, node]));
      state.displayLinks.forEach(link => {
        const a = nodeByDisplayId.get(link.from);
        const b = nodeByDisplayId.get(link.to);
        if (!a || !b) return;
        const path = svgEl('path', {
          class: 'link' + (link.down ? ' down' : ''),
          'data-link-id': link.id,
          d: linePath(a, b),
          stroke: colorBySpeed(link.speed, link.down),
          'stroke-width': Math.min(8, 1.4 + Math.log2(link.count + 1))
        });
        const underlay = svgEl('path', {
          class: 'link-underlay',
          'data-link-id': link.id,
          d: path.getAttribute('d'),
          'stroke-width': Math.min(12, 5.2 + Math.log2(link.count + 1))
        });
        path.addEventListener('click', ev => {
          ev.stopPropagation();
          showLinkDetail(link, a, b);
        });
        linkLayer.appendChild(underlay);
        linkLayer.appendChild(path);
      });

      state.displayNodes.forEach(node => {
        const group = svgEl('g', { class: `node-card ${node.kind}${node.down ? ' down' : ''}`, 'data-node-id': node.id, transform: `translate(${node.x},${node.y})` });
        group.addEventListener('click', ev => {
          ev.stopPropagation();
          showNodeDetail(node);
        });
        group.appendChild(svgEl('rect', { class: 'node-rect', width: node.w, height: node.h, rx: 7 }));
        appendSwitchIcon(group, node);
        group.appendChild(svgEl('circle', { class: 'node-dot' + (node.down ? ' alarm' : ''), cx: node.w - 13, cy: 14, r: 5, fill: node.down ? '#ef4444' : '#22c55e' }));
        const title = svgEl('text', { class: 'node-title', x: node.w / 2, y: 66 });
        title.textContent = truncate(node.label, 14);
        group.appendChild(title);
        const meta = svgEl('text', { class: 'node-meta', x: node.w / 2, y: 87 });
        meta.textContent = node.kind === 'group' ? `${roleLabel(node.role, node.zone)} / ${node.count} 台` : `${roleLabel(node.role, node.zone)} / ${node.down ? 'DOWN' : 'UP'}`;
        group.appendChild(meta);
        nodeLayer.appendChild(group);
      });

      updateMetrics();
      refreshActiveDetail();
      applySelectionHighlight();
      if (animate && window.anime && shouldAnimateRender()) {
        anime({ targets: '.node-card', opacity: [0, 1], delay: anime.stagger(12), duration: 420, easing: 'easeOutQuad' });
        anime({ targets: '.link', strokeDashoffset: [18, 0], duration: 600, easing: 'easeOutQuad' });
      }
    }

    function updateMetrics() {
      const rawNodes = state.metricNodes || [];
      const downNodeIds = (state.faultIndex && state.faultIndex.downNodeIds) || new Set();
      $('metric-devices').textContent = rawNodes.length;
      $('metric-links').textContent = state.displayLinks.length;
      $('metric-down').textContent = downNodeIds.size;
      $('metric-fault-links').textContent = state.displayFaultLinkCount || 0;
      $('metric-meth').textContent = state.showMeth ? 0 : state.hiddenMethLinks || 0;
      const loadedAt = state.dataUpdatedAt
        ? ` / 更新时间 ${formatDateTime(state.dataUpdatedAt)}`
        : '';
      $('subtitle').textContent = `${state.displayNodes.length} 个展示节点 / ${state.links.length} 条原始链路${loadedAt}`;
    }

    function connectedSelection(id) {
      const links = state.displayLinks.filter(link => link.from === id || link.to === id);
      const nodes = new Set([id]);
      links.forEach(link => {
        nodes.add(link.from);
        nodes.add(link.to);
      });
      return { links, nodes };
    }

    function applySelectionHighlight() {
      if (!focusLinkLayer) return;
      focusLinkLayer.innerHTML = '';
      const selected = selectedDisplayNodeId;
      const nodeEls = Array.from(svg.querySelectorAll('.node-card'));
      const linkEls = Array.from(svg.querySelectorAll('.link,.link-underlay'));
      nodeEls.forEach(el => el.classList.remove('selected', 'connected', 'dimmed'));
      linkEls.forEach(el => el.classList.remove('connected', 'dimmed'));
      if (!selected || !(state.displayNodeById && state.displayNodeById.has(selected))) return;
      const conn = connectedSelection(selected);
      nodeEls.forEach(el => {
        const id = el.getAttribute('data-node-id');
        if (id === selected) el.classList.add('selected');
        else if (conn.nodes.has(id)) el.classList.add('connected');
        else el.classList.add('dimmed');
      });
      linkEls.forEach(el => {
        const id = el.getAttribute('data-link-id');
        if (conn.links.some(link => link.id === id)) el.classList.add('connected');
        else el.classList.add('dimmed');
      });
      conn.links.forEach(link => {
        const a = state.displayNodeById.get(link.from);
        const b = state.displayNodeById.get(link.to);
        if (!a || !b) return;
        const focus = svgEl('path', {
          class: 'link-focus' + (link.down ? ' down' : ''),
          d: linePath(a, b),
          stroke: colorBySpeed(link.speed, link.down),
          'stroke-width': Math.min(10, 3.6 + Math.log2(link.count + 1)),
          'data-link-id': link.id
        });
        focus.addEventListener('click', ev => {
          ev.stopPropagation();
          showLinkDetail(link, a, b);
        });
        focusLinkLayer.appendChild(focus);
      });
    }

    function setActiveMetric(name) {
      document.querySelectorAll('.metric').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.metric === name);
      });
    }

    function statusBadge(down) {
      return `<span class="badge ${down ? 'bad' : 'ok'}">${down ? 'DOWN' : 'UP'}</span>`;
    }

    function ensureDetailVisible() {
      if (state.sidebarCollapsed) {
        state.sidebarAutoOpened = true;
        toggleSidebar(false);
      }
    }

    function restoreAutoHiddenSidebar() {
      if (state.sidebarAutoOpened) {
        state.sidebarAutoOpened = false;
        toggleSidebar(true);
      }
    }

    function renderNodeList(title, nodes) {
      setActiveMetric(title.metric || '');
      selectedDisplayNodeId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: title.metric || '' };
      const rows = nodes.map(node => {
        const id = esc(node.id);
        const label = esc(node.label || node.id);
        const parts = [zoneTitle(node.zone), displayClusterTitle(node.cluster || 'default'), roleLabel(node.role, node.zone)].filter(Boolean);
        const meta = esc(`${parts.join(' / ')}${node.kind === 'group' ? ' / ' + node.count + ' 台' : ''}`);
        return `<div class="list-row" data-node-id="${id}"><div><strong>${label}</strong><small>${meta}</small></div>${statusBadge(node.down)}</div>`;
      }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>${esc(title.text)}</b><span class="badge">${nodes.length}</span></div>${detailActionsHtml()}<div class="list">${rows || '<div class="info-item">暂无数据</div>'}</div>`;
      bindDetailBackButton();
      $('detail').querySelectorAll('[data-node-id]').forEach(row => {
        row.addEventListener('click', () => {
          const node = state.displayNodeById.get(row.dataset.nodeId);
          if (node) showNodeDetail(node);
        });
      });
    }

    function rawNodeView(node) {
      const label = aliasFor(node.id) || node.label || node.id;
      return {
        id: node.id,
        label,
        zone: classifyZone(node.id, label),
        role: roleRank(node.id, label),
        cluster: clusterKey(node.id, label),
        down: Number(node.status) !== 0
      };
    }

    function renderRawDeviceList(title, rawNodes) {
      setActiveMetric(title.metric || '');
      selectedDisplayNodeId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: title.metric || '' };
      const views = rawNodes.map(rawNodeView).sort((a, b) => a.zone.localeCompare(b.zone) || a.role - b.role || a.label.localeCompare(b.label));
      const rows = views.map(node => {
        const metaParts = [zoneTitle(node.zone), displayClusterTitle(node.cluster || 'default'), roleLabel(node.role, node.zone), node.id].filter(Boolean);
        const meta = `${metaParts.join(' / ')}`;
        return `<div class="list-row" data-raw-node-id="${esc(node.id)}"><div><strong>${esc(node.label)}</strong><small>${esc(meta)}</small></div>${statusBadge(node.down)}</div>`;
      }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>${esc(title.text)}</b><span class="badge">${views.length}</span></div>${detailActionsHtml()}<div class="list">${rows || '<div class="info-item">暂无数据</div>'}</div>`;
      bindDetailBackButton();
      $('detail').querySelectorAll('[data-raw-node-id]').forEach(row => {
        row.addEventListener('click', () => showRawDeviceDetail(row.dataset.rawNodeId));
      });
    }

    function renderLinkList() {
      setActiveMetric('links');
      selectedDisplayNodeId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: 'links' };
      const rows = state.displayLinks
        .slice()
        .sort((a, b) => Number(b.down) - Number(a.down) || b.count - a.count)
        .map(link => {
          const from = state.displayNodeById.get(link.from);
          const to = state.displayNodeById.get(link.to);
          return `<div class="list-row" data-link-id="${esc(link.id)}"><div><strong>${esc((from && from.label) || link.from)} - ${esc((to && to.label) || link.to)}</strong><small>${link.count} 条 / 最大 ${link.speed || '-'}G</small></div>${statusBadge(link.down)}</div>`;
        }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>聚合链路</b><span class="badge">${state.displayLinks.length}</span></div>${detailActionsHtml()}<div class="list">${rows || '<div class="info-item">暂无数据</div>'}</div>`;
      bindDetailBackButton();
      $('detail').querySelectorAll('[data-link-id]').forEach(row => {
        row.addEventListener('click', () => {
          const link = state.displayLinks.find(item => item.id === row.dataset.linkId);
          if (!link) return;
          showLinkDetail(link, state.displayNodeById.get(link.from), state.displayNodeById.get(link.to));
        });
      });
    }

    function renderMethDetail() {
      setActiveMetric('meth');
      selectedDisplayNodeId = '';
      applySelectionHighlight();
      activeDetail = { type: 'metric', metric: 'meth' };
      const methLinks = state.showMeth ? [] : (state.links || []).filter(link => linkUsesMeth(link));
      const rows = methLinks.map(link => {
        return `<tr><td>${esc(link.source)}</td><td>${esc(link.sourcePort || '-')}</td><td>${esc(link.target)}</td><td>${esc(link.targetPort || '-')}</td></tr>`;
      }).join('');
      $('detail').innerHTML = `<div class="detail-title"><b>隐藏管理链路</b><span class="badge">${state.showMeth ? 0 : state.hiddenMethLinks || 0}</span></div>
        ${detailActionsHtml()}
        ${state.showMeth ? '<div class="info-item">当前已开启显示管理接口，暂无隐藏项。</div>' : ''}
        <div class="detail-table-wrap"><table class="port-table" style="min-width:620px"><thead><tr><th>本端设备</th><th>本端接口</th><th>对端设备</th><th>对端接口</th></tr></thead><tbody>${rows || '<tr><td colspan="4">暂无隐藏管理链路</td></tr>'}</tbody></table></div>`;
      bindDetailBackButton();
    }

    function showNodeDetail(node, options) {
      const opts = { recordHistory: true, ...(options || {}) };
      ensureDetailVisible();
      setActiveMetric('');
      if (opts.recordHistory) {
        rememberDetail(node.kind === 'group' ? { type: 'node', id: node.id } : { type: 'raw-device', id: node.id });
      }
      selectedDisplayNodeId = node.id;
      applySelectionHighlight();
      if (node.kind === 'group') {
        activeDetail = { type: 'node', id: node.id };
