# LLDP-only SNMP module for shared snmp_exporter instance.
# Auths are provided by the existing snmp_public.yml that is already loaded by 9116.
modules:
  lldp_info:
    walk:
    - 1.0.8802.1.1.2.1.3.7.1.3
    - 1.0.8802.1.1.2.1.4.1.1.7
    - 1.0.8802.1.1.2.1.4.1.1.8
    - 1.0.8802.1.1.2.1.4.1.1.9
    metrics:
    - name: lldpLocPortId
      oid: 1.0.8802.1.1.2.1.3.7.1.3
      type: OctetString
      help: The string value used to identify the port component associated with this local port. - 1.0.8802.1.1.2.1.3.7.1.3
      indexes:
      - labelname: lldpLocPortNum
        type: gauge
    - name: lldpRemPortId
      oid: 1.0.8802.1.1.2.1.4.1.1.7
      type: OctetString
      help: The string value used to identify the port component associated with the remote system. - 1.0.8802.1.1.2.1.4.1.1.7
      indexes:
      - labelname: lldpRemTimeMark
        type: gauge
      - labelname: lldpRemLocalPortNum
        type: gauge
      - labelname: lldpRemIndex
        type: gauge
    - name: lldpRemPortDesc
      oid: 1.0.8802.1.1.2.1.4.1.1.8
      type: DisplayString
      help: The string value used to identify the description of the given port associated with the remote system. - 1.0.8802.1.1.2.1.4.1.1.8
      indexes:
      - labelname: lldpRemTimeMark
        type: gauge
      - labelname: lldpRemLocalPortNum
        type: gauge
      - labelname: lldpRemIndex
        type: gauge
    - name: lldpRemSysName
      oid: 1.0.8802.1.1.2.1.4.1.1.9
      type: DisplayString
      help: The string value used to identify the system name of the remote system. - 1.0.8802.1.1.2.1.4.1.1.9
      indexes:
      - labelname: lldpRemTimeMark
        type: gauge
      - labelname: lldpRemLocalPortNum
        type: gauge
      - labelname: lldpRemIndex
        type: gauge
    max_repetitions: 25
